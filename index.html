function autoTalkLine(){
  const mask = petState.mask;
  const mood = petState.mood;
  const dCount = petState.discipline.count || 0;
  const s = petState.state;

  // 被管教得多 → 害怕/讨好
  if(dCount >= 3 && Math.random() < 0.55){
    return pick(["……我会乖的。","别、别打我……","我听话……","（缩成一团）"]);
  }
  if(s.饱腹 < 30) return pick(["好饿……","肚子咕咕叫了。","想吃东西……"]);
  if(s.体力 < 30) return pick(["好困……","眼睛睁不开了……","我想睡觉……"]);
  if(mood === "happy"){
    const pool = AUTO_TALK_POOL[mask] || ["嘿嘿~"];
    return pick(pool);
  }
  if(mood === "sad") return pick(["……","有点难过。","陪陪我好不好……"]);
  if(mood === "fear") return pick(["（发抖）","……不要伤害我。","我怕……"]);
  if(mood === "sleepy") return pick(["呼……","Zzz…","好想睡……"]);
  if(mood === "sick") return pick(["呜……难受……","肚子痛……","想喝热水……"]);
  if(mood === "angry") return pick(["哼！","别惹我！","我要生气了！"]);
  return "……";
}

function updateAutoAct(now){
  if(opening.active) return;
  // 主要页面都能主动说话（不只是 home）
  const talkPages = ["home","feed","play","bath","cage","discipline"];
  if(!talkPages.includes(currentPage)) return;
  if(panelOpen()) return;
  if(dragging) return;
  const a = petState.auto;
  if(!a) return;

  // 主动说话（每 15~30 秒一次，降低频率，避免重复）
  // 保护：nextTalkAt 异常大（存档读档后 performance.now() 重置）时自动重置
  if(!a.nextTalkAt || a.nextTalkAt > now + 60000) a.nextTalkAt = now + randInt(8000, 15000);
  if(now > a.nextTalkAt){
    a.nextTalkAt = now + randInt(15000, 30000);
    // ★ 对话保护：用户正在和它对话时，不主动说话打断
    if(petState._isTalking) return;
    // ★ 70%概率沉默：很多时候宠物只是发呆、做小动作，不说话
    if(Math.random() < 0.7) return;
    const line = autoTalkLine();
    if(line){
      showBubbleFor(currentPage, line, 5000); // 显示5秒，让玩家有时间看完
      addChatMessage("assistant", line); // 主动说话也加入对话历史
    }
  }

  // idle 随机表情变化（每 15~30 秒轻微变一次表情，让它更"活"）
  if(!a.nextMoodAt) a.nextMoodAt = now + randInt(12000, 25000);
  if(now > a.nextMoodAt && a.mode === "idle"){
    a.nextMoodAt = now + randInt(15000, 30000);
    const s = petState.state;
    // 根据状态随机选一个合理的表情
    const candidates = ["default"];
    if(s.心情 > 60) candidates.push("happy", "cute");
    if(s.体力 < 30) candidates.push("sleepy");
    if(s.饱腹 < 30) candidates.push("hungry");
    if(s.清洁 < 30) candidates.push("sad");
    if(s.心情 < 30) candidates.push("sad", "fear");
    const pickMood = pick(candidates);
    if(pickMood !== "default"){
      setMoodOverride(pickMood, randInt(3000, 6000));
    }
  }

  // 自主走动状态机：idle → walk → rest → back → idle
  // ★ 用画布实际尺寸（全局 W/H 在事件时是别的页的值，不能用来算走动目标）
  const cv = canvases.home;
  const cw = (cv && cv.parentElement.clientWidth) || W;
  const ch = (cv && cv.parentElement.clientHeight) || H;
  if(a.mode === "idle"){
    if(!a.nextMoveAt) a.nextMoveAt = now + randInt(12000, 30000);
    if(now > a.nextMoveAt){
      const targets = [
        {x:cw*0.78, y:ch*0.26+26},
        {x:cw*0.20, y:ch*0.80-8},
        {x:cw*0.50, y:ch*0.90-16},
        {x:cw*0.16, y:ch*0.72},
        {x:cw*0.86, y:ch*0.40}
      ];
      const tgt = pick(targets);
      a.mode = "walk";
      a.targetX = clamp(tgt.x, 46, cw-46);
      a.targetY = clamp(tgt.y, 46, ch-46);
      a.nextMoveAt = now + randInt(20000, 50000);
    }
  } else if(a.mode === "walk"){
    const dx = a.targetX - pet.x, dy = a.targetY - pet.y;
    const dist = Math.hypot(dx,dy);
    if(dist < 5){
      a.mode = "rest";
      a.restUntil = now + randInt(3500, 8000);
      if(Math.random() < 0.45) showBubbleFor("home", pick(["（闻了闻）","（趴下了）","（蹭了蹭）","（打了个哈欠）"]));
    } else {
      const sp = 0.9;
      pet.x += dx/dist*sp;
      pet.y += dy/dist*sp;
    }
  } else if(a.mode === "rest"){
    if(now > a.restUntil){
      a.mode = "back";
      a.targetX = pet.homeX;
      a.targetY = pet.homeY;
    }
  } else if(a.mode === "back"){
    const dx = a.targetX - pet.x, dy = a.targetY - pet.y;
    const dist = Math.hypot(dx,dy);
    if(dist < 5){
      a.mode = "idle";
      pet.x = pet.homeX;
      pet.y = pet.homeY;
    } else {
      const sp = 1.1;
      pet.x += dx/dist*sp;
      pet.y += dy/dist*sp;
    }
  }
}

function getIdleParams(t){
  const now = performance.now();
  const elapsed = now - idleAction.startTime;
  const dur = idleAction.duration;
  const name = idleAction.name;
  const progress = Math.min(1,Math.max(0,elapsed/dur));
  const bodyR = bodyRadius();
  const result = {
    headDX:0, headDY:0, headRotate:0, stretchY:1, bodyRotate:0,
    armLeftDX:0, armLeftDY:0, armLeftRot:0,
    armRightDX:0, armRightDY:0, armRightRot:0,
    legLeftDY:0, legRightDY:0, legRightDX:0,
    tailWag:1, tailUp:0, eyeShut:0, mouthOpen:0
  };
  const env = Math.min(1,elapsed/300)*Math.min(1,Math.max(0,(dur-elapsed)/300));

  switch(name){
    case "坐着发呆": break;
    case "左右看":
      result.headRotate = Math.sin(elapsed*0.005)*0.18*env; break;
    case "舔爪子":
      // 手臂抬起但不要盖住头，往身体侧面偏
      result.armRightDX = -bodyR * 0.2 * env;
      result.armRightDY = -bodyR * 0.35 * env;
      result.armRightRot = -0.9 * env;
      result.headRotate = -0.15 * env;
      result.eyeShut = 0.5 * env;
      result.mouthOpen = 0.4 * env;
      break;

    case "打哈欠": {
      const yawn = Math.sin(progress * PI);
      result.mouthOpen = yawn;
      result.eyeShut = 0.7 * yawn;
      result.headRotate = -0.1 * yawn;
      // 打哈欠时手臂微微下压，不要抬到头部位置
      result.armLeftDY  = bodyR * 0.05 * yawn;
      result.armRightDY = bodyR * 0.05 * yawn;
      break;
    }
    case "伸懒腰": {
      const st = Math.sin(progress*PI);
      result.stretchY = 1+0.2*st;
      result.armLeftDY = -bodyR*0.5*st;
      result.armRightDY = -bodyR*0.5*st;
      result.armLeftDX = -bodyR*0.2*st;
      result.armRightDX = bodyR*0.2*st;
      result.tailUp = st;
      result.eyeShut = 0.6*st; break;
    }
    case "玩尾巴":
      result.headRotate = 0.45*env;
      result.tailWag = 3*env; break;
    case "舔毛":
      result.headDY = bodyR*0.4*env;
      result.headRotate = 0.3*env;
      result.mouthOpen = 0.5*env;
      result.eyeShut = 0.7*env; break;
    case "打滚":
      result.bodyRotate = progress*TAU; break;
    case "挠痒":
      result.legRightDY = -bodyR*0.5*env;
      result.legRightDX = -bodyR*0.3*env;
      result.headRotate = 0.2*env;
      result.eyeShut = 0.7*env; break;
    case "发呆看远方":
      result.headDY = -bodyR*0.08; break;
    case "闻地板":
      result.headDY = bodyR*0.22*env;
      result.headRotate = Math.sin(elapsed*0.01)*0.1*env;
      result.eyeShut = 0.6*env;
      result.mouthOpen = 0.2*env;
      result.tailWag = 0.3*env;
      break;
    case "蹦蹦跳":
      // 上下小跳（位移在 drawPet 里处理）
      result.headRotate = Math.sin(elapsed*0.02)*0.05*env;
      result.tailWag = 2*env;
      result.mouthOpen = 0.5*env;
      break;
    case "转圈圈":
      result.bodyRotate = progress*TAU;
      result.tailWag = 2*env;
      result.mouthOpen = 0.6*env;
      result.eyeShut = 0.4*env;
      break;
    case "打喷嚏": {
      const sn = Math.sin(progress*PI);
      result.headDY = Math.sin(elapsed*0.03)*bodyR*0.1*sn;
      result.headRotate = Math.sin(elapsed*0.05)*0.12*sn;
      result.mouthOpen = 0.8*sn;
      result.eyeShut = 0.9*sn;
      result.armLeftDY = -bodyR*0.2*sn;
      result.armRightDY = -bodyR*0.2*sn;
      break;
    }
  }
  return result;
}

/* ═══════════════════════════════════════════════════════
   7. 状态系统
   ═══════════════════════════════════════════════════════ */
function updateState(dtMs){
  petState._interactCount = petState._interactCount || 0;
  const s = petState.state;
  const hours = dtMs/3600000;

  // ★ 季节系统（根据真实月份判断）
  const month = new Date().getMonth() + 1;  // 1-12
  let season = "spring";
  if(month >= 3 && month <= 5) season = "spring";
  else if(month >= 6 && month <= 8) season = "summer";
  else if(month >= 9 && month <= 11) season = "autumn";
  else season = "winter";
  petState.currentSeason = season;

  // 季节影响基础衰减（降低衰减速度，让宠物不会那么快就饿）
  let hungerRate = 5, cleanRate = 4, energyRate = 3, moodRate = 1;
  if(season === "summer"){
    hungerRate = 6;  // 夏天没胃口但消耗快
    energyRate = 5;   // 夏天容易累
    cleanRate = 6;    // 夏天容易脏
  } else if(season === "winter"){
    hungerRate = 8;  // 冬天需要更多热量
    energyRate = 3;   // 冬天想睡觉
    moodRate = 2;     // 冬天容易抑郁
  } else if(season === "spring"){
    moodRate = 0.5;     // 春天心情好
    energyRate = 3;   // 春天活跃
  } else if(season === "autumn"){
    hungerRate = 7;  // 秋天囤食
  }

  s.饱腹 = clamp(s.饱腹 - hungerRate*hours, 0, 100);
  s.清洁 = clamp(s.清洁 - cleanRate*hours, 0, 100);
  s.体力 = clamp(s.体力 - energyRate*hours, 0, 100);
  s.心情 = clamp(s.心情 - moodRate*hours, 0, 100);

  // 笼子中额外衰减
  if(cageState.inCage){
    cageState.timeInCageMs += dtMs;
    const cageHours = cageState.timeInCageMs / 3600000;
    if(cageHours > 4){
      s.心情 = clamp(s.心情 - 1 * hours, 0, 100);
      s.亲密度 = clamp(s.亲密度 - 0.5 * hours, 0, 100);
    }
    if(cageHours > 8){
      if(Math.random() < 0.005){ s.体力 = clamp(s.体力 - 5, 0, 100); }
    }
    if(cageHours > 12){
      petState.shadow = clamp(petState.shadow + 1 * hours, 0, 100);
    }
  }

  if(s.饱腹<10) s.亲密度 = clamp(s.亲密度 - 0.5*hours, 0, 100);
  if(s.心情<10) s.信任度 = clamp(s.信任度 - 0.3*hours, 0, 100);

  // 口渴衰减
  if(petState.water !== undefined){
    petState.water = clamp(petState.water - 2 * hours, 0, 100);
    if(petState.water < 10){
      s.体力 = clamp(s.体力 - 3 * hours, 0, 100);
    }
    if(petState.water <= 0){
      s.体力 = clamp(s.体力 - 5 * hours, 0, 100);
      if(s.体力 <= 0){
        s.饱腹 = clamp(s.饱腹 - 5 * hours, 0, 100);
      }
    }
  }

  // 夜晚自动睡觉
  const hour = new Date().getHours();
  if(hour >= 22 || hour < 6){
    if(petState.mood !== "sleepy" && Math.random() < 0.001){
      setMoodOverride("sleepy", 60000);
      petAutoAction("sleep");
    }
  }

  // ★ 死亡系统检测
  if(!petState._deathTimer) petState._deathTimer = { hunger:0, thirst:0, abuse:0 };
  const dt = petState._deathTimer;

  // ★ 行为记忆系统：被管教后会记住，减少再犯概率
  if(!petState.behaviorMemory) petState.behaviorMemory = {
    随地大小便被管教: 0,
    破坏东西被管教: 0,
    咬人被管教: 0,
    不听话被管教: 0,
    lastDisciplineTime: 0
  };
  const bm = petState.behaviorMemory;
  // 记忆会随时间慢慢消退（每天消退10%）
  const memoryDecay = Math.pow(0.9, hours);
  bm.随地大小便被管教 *= memoryDecay;
  bm.破坏东西被管教 *= memoryDecay;
  bm.咬人被管教 *= memoryDecay;
  bm.不听话被管教 *= memoryDecay;

  // ★ 性格渐变系统：根据玩家的行为慢慢改变宠物的性格
  const traits = petState.traits;
  // 被善待多了：粘人度上升，记仇度下降，胆量上升
  if(s.亲密度 > 70 && s.信任度 > 60){
    traits.粘人 = clamp(traits.粘人 + 0.1 * hours, 0, 100);
    traits.记仇 = clamp(traits.记仇 - 0.05 * hours, 0, 100);
    traits.胆量 = clamp(traits.胆量 + 0.05 * hours, 0, 100);
  }
  // 被虐待多了：记仇度上升，粘人度下降，胆量下降
  if(petState.discipline.恐惧值 > 60 || petState.shadow > 50){
    traits.记仇 = clamp(traits.记仇 + 0.15 * hours, 0, 100);
    traits.粘人 = clamp(traits.粘人 - 0.1 * hours, 0, 100);
    traits.胆量 = clamp(traits.胆量 - 0.1 * hours, 0, 100);
    traits.脾气 = clamp(traits.脾气 + 0.08 * hours, 0, 100);
  }
  // 被忽略多了：好奇心下降，粘人度变化（可能更粘人或更冷漠）
  if(playerActivity.lonelyStage >= 3){
    traits.好奇 = clamp(traits.好奇 - 0.05 * hours, 0, 100);
  }

  // 饥饿致死：饱腹=0 且 体力<=10
  if(s.饱腹 <= 0 && s.体力 <= 10){
    dt.hunger += dtMs;
    if(dt.hunger > 60000 && !petState._deathWarned){ // 1分钟警告
      petState._deathWarned = true;
      showBubbleFor("home", "……好饿……我快不行了……");
    }
    if(dt.hunger > 180000){ // 3分钟死亡
      triggerPetDeath("饥饿");
      return;
    }
  } else {
    dt.hunger = 0;
  }

  // 口渴致死：water=0 且 体力<=10
  if(petState.water !== undefined && petState.water <= 0 && s.体力 <= 10){
    dt.thirst += dtMs;
    if(dt.thirst > 60000 && !petState._thirstWarned){
      petState._thirstWarned = true;
      showBubbleFor("home", "……好渴……给我水……");
    }
    if(dt.thirst > 180000){
      triggerPetDeath("口渴");
      return;
    }
  } else {
    dt.thirst = 0;
  }

  // 殴打致死：体力=0 且 暗影值>70
  if(s.体力 <= 0 && petState.shadow > 70){
    dt.abuse += dtMs;
    if(dt.abuse > 30000 && !petState._abuseWarned){
      petState._abuseWarned = true;
      showBubbleFor("home", "……好痛……不要……");
      setMoodOverride("broken", 8000);
    }
    if(dt.abuse > 90000){ // 1.5分钟死亡
      triggerPetDeath("虐待");
      return;
    }
  } else {
    dt.abuse = 0;
  }

  // 恢复时重置警告
  if(s.饱腹 > 20) petState._deathWarned = false;
  if(petState.water > 20) petState._thirstWarned = false;
  if(s.体力 > 30) petState._abuseWarned = false;

  // ★ 亲密度突破阈值的特殊反应
  if(!petState._intimacyMilestones) petState._intimacyMilestones = { level: 0 };
  const currentLevel = Math.floor(s.亲密度 / 20);  // 0-5级
  if(currentLevel > petState._intimacyMilestones.level && currentPage === "home"){
    petState._intimacyMilestones.level = currentLevel;
    const milestoneLines = {
      1: ["（偷偷看你）……你好像也没那么讨厌。", "（小声）……谢了。", "（凑近一点）"],
      2: ["嘿嘿，你人还挺好的~", "（蹭蹭）最喜欢你了！", "（摇尾巴）以后也请多关照！"],
      3: ["（扑过来）我最喜欢你了！！", "你是全世界最好的主人！", "（脸红）……最喜欢你了。"],
      4: ["（紧紧抱着）不要离开我……", "你是我的唯一……", "（蹭蹭）永远在一起好不好？"],
      5: ["（含泪）谢谢你……一直陪着我。", "我这辈子都不会忘记你。", "（紧紧依偎）有你在真好……"]
    };
    const lines = milestoneLines[currentLevel] || ["（开心）"];
    setTimeout(()=>{
      triggerBodyReaction("blushing", 3000, 0.8);
      triggerBodyReaction("trembling", 2000, 0.4);
      showBubbleFor("home", pick(lines));
      sfxHappy();
      recordMemory("亲密度突破", "达到" + (currentLevel*20) + "%");
    }, 500);
  }
}

/* 宠物死亡 */
function triggerPetDeath(cause){
  if(!checkContentSafety("death")){
    // 内容安全关闭时，不死亡，只进入濒死状态
    petState.state.体力 = 1;
    petState.state.饱腹 = 1;
    showBubbleFor("home", "……（它奄奄一息，但还活着）");
    return;
  }
  petState.isDead = true;
  petState.deathCause = cause;
  recordMemory("死亡", cause);
  showModal({
    title:"💔 它走了",
    text:"原因：" + cause + "\n\n它回到了星尘之中。\n你可以重新领养一只新的宠物。",
    actions:[
      { label:"重新领养", type:"primary", onClick:()=>{
        localStorage.removeItem(STORAGE_KEY);
        initNewPet();
        location.reload();
      }}
    ]
  });
  saveState();
}

  "对话":   { 亲密度: 0,   心情: 0,   记仇: 0,  标签: "对话" },
  "被放出": { 亲密度: +1,  心情: +2,  记仇: -1, 标签: "被放出" }
};

function recordMemory(type, detail, extra){
  if(!petState.memory) return;
  const w = MEMORY_WEIGHT[type] || { 亲密度:0, 心情:0, 记仇:0, 标签:type };

  const s = petState.state;
  s.亲密度 = clamp(s.亲密度 + w.亲密度, 0, 100);
  s.心情 = clamp(s.心情 + w.心情, 0, 100);

  const evt = {
    type: type,
    detail: detail || "",
    extra: extra || null,
    time: Date.now(),
    mood: petState.mood,
    moodAtTime: petState.state.心情
  };

  petState.memory.events.push(evt);
  if(petState.memory.events.length > 50){
    petState.memory.events.shift();
  }

  const key = w.标签;
  if(petState.memory.summary[key] !== undefined){
    petState.memory.summary[key]++;
  }

  if(w.记仇 > 0 && type !== "关笼" && type !== "管教"){
    petState.memory.grudges.push({
      reason: type,
      detail: detail,
      time: Date.now()
    });
    if(petState.memory.grudges.length > 20) petState.memory.grudges.shift();
  }

  if(type === "喂食" && extra && extra.liked){
    petState.memory.favorites.push({
      food: extra.food,
      time: Date.now()
    });
    if(petState.memory.favorites.length > 15) petState.memory.favorites.shift();
  }

  petState.memory.lastInteraction = Date.now();
  updateLastInteraction();

  // ★ AI感知层：写入最近事件队列（让AI能"看到"游戏里刚发生的事）
  if(!petState.recentEvents) petState.recentEvents = [];
  const eventText = type + (detail ? "：" + detail : "");
  petState.recentEvents.push({
    text: eventText,
    time: Date.now(),
    type: type,
    mood: petState.mood,
    moodValue: petState.state.心情
  });
  if(petState.recentEvents.length > 15) petState.recentEvents.shift();

  saveState();
}

/* 获取最近事件文本（供AI使用） */
function getRecentEventsText(n){
  if(!petState.recentEvents || petState.recentEvents.length === 0) return "（最近没有特别的事）";
  const events = petState.recentEvents.slice(-(n || 10));
  return events.map(e => {
    const ago = Math.floor((Date.now() - e.time) / 1000);
    let timeStr = "";
    if(ago < 60) timeStr = ago + "秒前";
    else if(ago < 3600) timeStr = Math.floor(ago/60) + "分钟前";
    else timeStr = Math.floor(ago/3600) + "小时前";
    return "[" + timeStr + "] " + e.text + "（当时心情：" + e.mood + "）";
  }).join("\n");
}

function getRecentMemory(n){
  if(!petState.memory) return [];
  return petState.memory.events.slice(-n).map(e=>{
    const ago = Math.floor((Date.now() - e.time) / 60000);
    return e.type + (e.detail ? "(" + e.detail + ")" : "") + " [距今" + ago + "分钟]";
  });
}

function getMemorySummary(){
  if(!petState.memory) return "无记忆";
  const s = petState.memory.summary;
  const lines = [];
  // 遍历所有计数键
  Object.keys(s).forEach(k=>{
    if(s[k] > 0 && k !== undefined){
      lines.push(k + " " + s[k] + " 次");
    }
  });
  if(petState.memory.grudges.length > 0){
    lines.push("最近记仇：" + petState.memory.grudges.slice(-3).map(g=>g.reason).join("、"));
  }
  // ★ 昨天的记忆
  const yesterdayEvents = getYesterdayMemory();
  if(yesterdayEvents.length > 0){
    lines.push("昨天发生的事：" + yesterdayEvents.join("、"));
  }
  return lines.join("；") || "还没有重要记忆";
}

/* 获取昨天的记忆事件 */
function getYesterdayMemory(){
  if(!petState.memory || !petState.memory.events) return [];
  const now = new Date();
  const yesterdayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()-1).getTime();
  const yesterdayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return petState.memory.events
    .filter(e => e.time >= yesterdayStart && e.time < yesterdayEnd)
    .slice(-5)
    .map(e => e.type + (e.detail ? "("+e.detail+")" : ""));
}

/* ═══════════════ 音频系统（Web Audio API 纯代码生成） ═══════════════ */
let audioCtx = null;
let audioEnabled = true;
let bgmGain = null;
let sfxGain = null;
let voiceGain = null;

function initAudio(){
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = (settings.bgmVolume || 0.4) * 0.4;
    bgmGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = (settings.sfxVolume || 0.7) * 0.35;
    sfxGain.connect(audioCtx.destination);
    voiceGain = audioCtx.createGain();
    voiceGain.gain.value = (settings.voiceVolume || 0.6) * 0.3;
    voiceGain.connect(audioCtx.destination);
  } catch(e) {
    audioEnabled = false;
  }
}

document.addEventListener("pointerdown", ()=>{
  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }
  if(audioCtx && audioEnabled && !bgmState.playing){
    setTimeout(startBgm, 500);
  }
}, { once: true });

function getPetVoiceParams(){
  const base = { pitch: 400, speed: 1.0, waveform: "triangle", vibrato: 0, filterFreq: 2000 };
  switch(petState.bodyType){
    case "圆胖型": base.pitch = 320; base.speed = 0.85; base.waveform = "triangle"; base.filterFreq = 1500; break;
    case "瘦长型": base.pitch = 520; base.speed = 1.15; base.waveform = "square"; base.filterFreq = 3000; break;
    case "毛茸茸型": base.pitch = 280; base.speed = 0.8; base.waveform = "sine"; base.filterFreq = 1200; break;
    case "带翅型": base.pitch = 580; base.speed = 1.2; base.waveform = "square"; base.filterFreq = 3500; break;
    case "带角型": base.pitch = 300; base.speed = 0.95; base.waveform = "sawtooth"; base.filterFreq = 1800; break;
  }
  switch(petState.mask){
    case "小可爱": base.pitch *= 1.2; base.vibrato = 3; break;
    case "病娇": base.speed *= 0.9; base.filterFreq *= 0.7; break;
    case "疯批": base.speed *= 1.3; break;
    case "冷淡": base.vibrato = 0; base.pitch *= 0.9; break;
    case "戏精": base.pitch *= 1.1; base.vibrato = 5; break;
    case "公主病": base.pitch *= 1.15; base.speed *= 0.95; break;
    case "本大人": base.pitch *= 0.9; base.speed *= 0.9; break;
    case "傲娇": base.pitch *= 1.05; break;
    case "学者": base.speed *= 0.95; base.filterFreq *= 1.1; break;
    case "憨憨": base.pitch *= 0.85; base.speed *= 0.85; break;
  }
  return base;
}

function playNote(freq, duration, type, gainNode, volume){
  if(!audioCtx || !audioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  filter.type = "lowpass";
  filter.frequency.value = 3000;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(volume || 0.3, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(gainNode || sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playSlide(fromFreq, toFreq, duration, type, gainNode, volume){
  if(!audioCtx || !audioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(fromFreq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(toFreq, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(volume || 0.3, audioCtx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(gainNode || sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

let voiceTimer = null;
function playVoice(text, mood){
  if(!audioCtx || !audioEnabled || !text) return;
  const params = getPetVoiceParams();
  const chars = text.replace(/\s/g, "").slice(0, 20);
  const baseFreq = params.pitch;
  let i = 0;
  if(voiceTimer) clearInterval(voiceTimer);
  voiceTimer = setInterval(()=>{
    if(i >= chars.length){ clearInterval(voiceTimer); voiceTimer = null; return; }
    const ch = chars[i];
    let freq = baseFreq + (ch.charCodeAt(0) % 200) - 100;
    let dur = 0.06 / params.speed;
    if(mood === "happy") freq *= 1.15;
    else if(mood === "sad") freq *= 0.85;
    else if(mood === "angry") freq *= 1.1;
    else if(mood === "fear") freq *= 1.2;
    else if(mood === "sleepy") { freq *= 0.8; dur *= 1.5; }
    else if(mood === "sick") freq *= 0.9;
    if(ch === "。" || ch === "！" || ch === "？"){
      dur = 0.15;
      if(ch === "！") freq *= 1.3;
      if(ch === "？") freq *= 1.15;
    }
    if(ch === "~" || ch === "～"){
      playSlide(freq, freq * 1.2, dur * 2, params.waveform, voiceGain, 0.15);
    } else {
      playNote(freq, dur, params.waveform, voiceGain, 0.12);
    }
    i++;
  }, 140 / params.speed);  // 放慢到原来的2倍（70→140ms），和文字显示同步
}

  mousePos.x = e.clientX;
  mousePos.y = e.clientY;
  lastMouseMoveTime = Date.now();

  if(!window._mouseTrace) window._mouseTrace = { x:[], y:[], t:[], lastAction:0 };
  const mt = window._mouseTrace;
  mt.x.push(e.clientX);
  mt.y.push(e.clientY);
  mt.t.push(Date.now());
  if(mt.x.length > 20){ mt.x.shift(); mt.y.shift(); mt.t.shift(); }

  if(mt.x.length >= 10 && Date.now() - mt.lastAction > 3000){
    const xs = mt.x.slice(-10);
    const ys = mt.y.slice(-10);
    const dx = Math.max(...xs) - Math.min(...xs);
    const dy = Math.max(...ys) - Math.min(...ys);
    const speed = Math.hypot(xs[9]-xs[0], ys[9]-ys[0]);

    if(dx > 150 && dy < 80 && speed > 100){
      // 快速左右移动：宠物摇头
      mt.lastAction = Date.now();
      if(currentPage === "home" && !dragging){

  // ★ 打翻东西（心情差/记仇高时会搞破坏，但被管教过会减少概率）

function getCurrentPeriod(){
  const hour = new Date().getHours();
  for(const p of TIME_PERIODS){
    if(hour >= p.start && hour < p.end) return p;
  }
  return TIME_PERIODS[0];
}

function isNightTime(){
  const hour = new Date().getHours();
  return hour >= 22 || hour < 6;
}

/* ═══════════════ 天气系统 ═══════════════ */
let weatherState = {
  type: "sunny",  // sunny, rainy, cloudy
  lastChange: 0,
  raindrops: []
};

function updateWeather(){
  const now = Date.now();
  // 每30分钟可能变化天气
  if(now - weatherState.lastChange > 30*60*1000){
    weatherState.lastChange = now;
    const r = Math.random();
    if(r < 0.6) weatherState.type = "sunny";
    else if(r < 0.85) weatherState.type = "cloudy";
    else weatherState.type = "rainy";
    // 初始化雨滴
    if(weatherState.type === "rainy"){
      weatherState.raindrops = [];
      for(let i=0;i<40;i++){
        weatherState.raindrops.push({
          x: Math.random()*W,
          y: Math.random()*H,
          speed: 3 + Math.random()*4,
          len: 8 + Math.random()*8
        });
      }
    }
  }
}

function drawWeather(c, W, H, t){
  if(weatherState.type === "rainy"){
    // 画雨滴
    c.save();
    c.strokeStyle = "rgba(150,180,220,0.5)";
    c.lineWidth = 1.5;
    weatherState.raindrops.forEach(drop=>{
      c.beginPath();
      c.moveTo(drop.x, drop.y);
      c.lineTo(drop.x - 2, drop.y + drop.len);
      c.stroke();
      drop.y += drop.speed;
      drop.x -= 1;
      if(drop.y > H){
        drop.y = -10;
        drop.x = Math.random()*W;
      }
    });
    c.restore();
    // 雨天整体变暗
    c.fillStyle = "rgba(100,120,160,0.1)";
    c.fillRect(0,0,W,H);
  } else if(weatherState.type === "cloudy"){
    // 阴天变暗
    c.fillStyle = "rgba(150,150,170,0.12)";
    c.fillRect(0,0,W,H);
  }
}

function getWeatherName(){
  return { sunny:"晴天", rainy:"雨天", cloudy:"阴天" }[weatherState.type] || "晴天";
}

/* 绘制米白色木地板 + 斑点图案地毯（上帝视角背景） */
function drawFloorBackground(c, W, H){
  // 米白色木地板
  c.save();
  c.fillStyle = "#F5EFE6";
  c.fillRect(0, 0, W, H);
  // 木纹纹理（横向木板）
  const plankHeight = H / 12;
  for(let i = 0; i < 12; i++){
    const y = i * plankHeight;
    // 木板接缝
    c.strokeStyle = "rgba(200,185,165,0.3)";
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(W, y);
    c.stroke();
    // 木纹细节
    if(i % 2 === 0){
      c.fillStyle = "rgba(220,205,185,0.15)";
      c.fillRect(0, y, W, plankHeight);
    }
    // 随机木结
    const knotX = (i * 137.5) % W;
    c.fillStyle = "rgba(190,170,145,0.2)";
    c.beginPath();
    c.arc(knotX, y + plankHeight/2, 8, 0, TAU);
    c.fill();
  }
  c.restore();

  // 斑点图案地毯（放在中间偏下，圆形）
  const rugX = W * 0.5;
  const rugY = H * 0.62;
  const rugR = Math.min(W, H) * 0.28;
  c.save();
  // 地毯底色（柔和的粉紫色）
  c.fillStyle = "#E8DFF0";
  c.beginPath();
  c.arc(rugX, rugY, rugR, 0, TAU);
  c.fill();
  // 地毯边缘
  c.strokeStyle = "rgba(180,160,200,0.5)";
  c.lineWidth = 4;
  c.beginPath();
  c.arc(rugX, rugY, rugR - 2, 0, TAU);
  c.stroke();
  // 斑点图案（不要太显眼）
  const spotColors = ["rgba(200,180,220,0.4)", "rgba(220,200,230,0.35)", "rgba(190,170,210,0.3)"];
  for(let i = 0; i < 25; i++){
    const angle = (i / 25) * TAU + (i % 3) * 0.5;
    const dist = rugR * 0.2 + ((i * 37) % 100) / 100 * rugR * 0.65;
    const sx = rugX + Math.cos(angle) * dist;
    const sy = rugY + Math.sin(angle) * dist;
    const sr = 5 + (i % 4) * 3;
    c.fillStyle = spotColors[i % spotColors.length];
    c.beginPath();
    c.arc(sx, sy, sr, 0, TAU);
    c.fill();
  }
  c.restore();
}

function drawDayNightOverlay(c, W, H){
  const period = getCurrentPeriod();
  if(period.overlay && period.overlay !== "rgba(255,255,255,0)"){
    c.save();
    c.fillStyle = period.overlay;
    c.fillRect(0, 0, W, H);
    c.restore();
  }
  // 深夜画星星
  if(isNightTime()){
    c.save();
    const t = performance.now();
    for(let i = 0; i < 30; i++){
      const sx = (i * 137.5) % W;
      const sy = (i * 73.3) % (H * 0.5);
      const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.001 + i));
      c.fillStyle = "rgba(255,255,220," + (0.4 * twinkle) + ")";
      c.beginPath();
      c.arc(sx, sy, 1.5, 0, TAU);
      c.fill();
    }
    c.restore();
  }
}

// 伤感和弦：小调和弦，悲伤温柔
const CHORD_SAD = [

  { name: "F", notes: ["F3","A3","C4"], bass: "F2" },

];

let bgmState = {
  playing: false,
  currentChord: 0,
  beat: 0,
  melodyIndex: 0,
  melodyBeat: 0,
  bpm: 90,
  nextNoteTime: 0,
  timer: null,
  currentStyle: "day",
  targetGain: 0.08,
  currentGain: 0,
  heartbeatTimer: null
};

function playBgmNote(freq, duration, type, gain, when){
  if(!audioCtx || !audioEnabled) return;
  const t = when || audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  filter.type = "lowpass";
  filter.frequency.value = 3000;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(filter);
  filter.connect(g);
  g.connect(bgmGain);
  osc.start(t);
  osc.stop(t + duration + 0.1);
}

function bgmScheduler(){
  if(!bgmState.playing || !audioCtx) return;
  const beatDuration = 60 / bgmState.bpm;
  const now = audioCtx.currentTime;

  while(bgmState.nextNoteTime < now + 0.3){
    const t = bgmState.nextNoteTime;
    const style = bgmState.currentStyle;

    if(style === "dark"){
      // 暗影管教BGM（保留旧版）
      const chord = CHORD_DARK[bgmState.currentChord % CHORD_DARK.length];
      const beatInBar = bgmState.beat % 4;

      // 每小节第一拍：低沉低音 + 心跳
      if(beatInBar === 0){
        playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 2, "sine", 0.15, t);
        // 心跳声（低频脉冲）
        playBgmNote(60, 0.15, "sine", 0.2, t);
        playBgmNote(60, 0.15, "sine", 0.15, t + beatDuration * 0.5);
      }

      // 和弦铺底（每拍一个音，缓慢）
      const chordNote = chord.notes[beatInBar % chord.notes.length];
      playBgmNote(NOTE_FREQ[chordNote], beatDuration * 1.5, "triangle", 0.04, t);

      // 固定旋律
      const melody = MELODY_DARK;
      if(bgmState.melodyIndex < melody.length){
        const m = melody[bgmState.melodyIndex];
        if(m.note && NOTE_FREQ[m.note]){
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.9, "sine", 0.06, t);
        }
        bgmState.melodyBeat += 1;
        if(bgmState.melodyBeat >= m.dur){
          bgmState.melodyBeat = 0;
          bgmState.melodyIndex++;
          if(bgmState.melodyIndex >= melody.length){
            bgmState.melodyIndex = 0;
          }
        }
      }

      // 偶尔的钟声（每8拍一次）
      if(bgmState.beat % 8 === 4){
        playBgmNote(NOTE_FREQ["C5"], beatDuration * 2, "sine", 0.03, t);
      }

      bgmState.beat++;
      if(bgmState.beat % 4 === 0){
        bgmState.currentChord++;
      }
      bgmState.nextNoteTime += beatDuration;

    } else if(style === "battle"){
      // ★ 战斗BGM（暗影管教模式）：激烈、紧张、快速
      const chord = CHORD_BATTLE[bgmState.currentChord % CHORD_BATTLE.length];
      const beatInBar = bgmState.beat % 4;

      // 快速低音脉冲（每拍都有，像心跳加速）
      playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 0.4, "sawtooth", 0.08, t);
      playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 0.3, "sine", 0.12, t + beatDuration * 0.5);

      // 不和谐和弦铺底（锯齿波，紧张感）
      const chordNote = chord.notes[beatInBar % chord.notes.length];
      playBgmNote(NOTE_FREQ[chordNote], beatDuration * 0.6, "sawtooth", 0.03, t);

      // 战斗旋律（快速、不和谐音程）
      const melody = MELODY_BATTLE;
      if(bgmState.melodyIndex < melody.length){
        const m = melody[bgmState.melodyIndex];
        if(m.note && NOTE_FREQ[m.note]){
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.8, "square", 0.05, t);
        }
        bgmState.melodyBeat += 1;
        if(bgmState.melodyBeat >= m.dur){
          bgmState.melodyBeat = 0;
          bgmState.melodyIndex++;
          if(bgmState.melodyIndex >= melody.length){
            bgmState.melodyIndex = 0;
          }
        }
      }

      // 鼓点（白噪声模拟，每拍）
      if(beatInBar === 0 || beatInBar === 2){
        playBgmNote(150, 0.08, "square", 0.06, t);
      }
      // 刺耳高音警报（每8拍一次）
      if(bgmState.beat % 8 === 0){
        playBgmNote(NOTE_FREQ["A5"], beatDuration * 0.5, "sawtooth", 0.04, t);
      }

      bgmState.beat++;
      if(bgmState.beat % 4 === 0){
        bgmState.currentChord++;
      }
      bgmState.nextNoteTime += beatDuration;

    } else if(style === "cage"){
      // ★ 笼子BGM（禁闭/孤独）：缓慢、稀疏、压抑
      const chord = CHORD_CAGE[bgmState.currentChord % CHORD_CAGE.length];
      const beatInBar = bgmState.beat % 8; // 8拍一小节，更慢

      // 极慢的低音持续音（每8拍一次）
      if(beatInBar === 0){
        playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 6, "sine", 0.1, t);
      }

      // 稀疏的和弦音（每2拍一个，大量留白）
      if(beatInBar % 2 === 0){
        const chordNote = chord.notes[Math.floor(beatInBar / 2) % chord.notes.length];
        playBgmNote(NOTE_FREQ[chordNote], beatDuration * 1.5, "triangle", 0.03, t);
        // 回声效果（延迟重复，像在笼子里回响）
        playBgmNote(NOTE_FREQ[chordNote], beatDuration * 1.2, "sine", 0.015, t + beatDuration * 0.8);
      }

      // 笼子旋律（极稀疏，大量休止符）
      const melody = MELODY_CAGE;
      if(bgmState.melodyIndex < melody.length){
        const m = melody[bgmState.melodyIndex];
        if(m.note && NOTE_FREQ[m.note]){
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.9, "sine", 0.05, t);
          // 回声
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.7, "sine", 0.02, t + beatDuration * 0.5);
        }
        bgmState.melodyBeat += 1;
        if(bgmState.melodyBeat >= m.dur){
          bgmState.melodyBeat = 0;
          bgmState.melodyIndex++;
          if(bgmState.melodyIndex >= melody.length){
            bgmState.melodyIndex = 0;
          }
        }
      }

      // 偶尔的金属碰撞声（像笼子栏杆，每16拍一次）
      if(bgmState.beat % 16 === 8){
        playBgmNote(NOTE_FREQ["C6"], 0.1, "square", 0.02, t);
        playBgmNote(NOTE_FREQ["G5"], 0.15, "square", 0.015, t + 0.1);
      }

      bgmState.beat++;
      if(bgmState.beat % 8 === 0){
        bgmState.currentChord++;
      }
      bgmState.nextNoteTime += beatDuration;

    } else if(style === "sad"){
      // ★ 伤感BGM（心情差/绝望）：悲伤、温柔、缓慢
      const chord = CHORD_SAD[bgmState.currentChord % CHORD_SAD.length];
      const beatInBar = bgmState.beat % 4;

      // 缓慢的低音（每小节第一拍）
      if(beatInBar === 0){
        playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 3, "sine", 0.08, t);
      }

      // 温柔的和弦铺底（钢琴音色，纯净正弦波）
      const chordNote = chord.notes[beatInBar % chord.notes.length];
      playBgmNote(NOTE_FREQ[chordNote], beatDuration * 1.2, "sine", 0.035, t);

      // 伤感旋律（缓慢、长音符、偶尔休止）
      const melody = MELODY_SAD;
      if(bgmState.melodyIndex < melody.length){
        const m = melody[bgmState.melodyIndex];
        if(m.note && NOTE_FREQ[m.note]){
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.95, "sine", 0.06, t);
        }
        bgmState.melodyBeat += 1;
        if(bgmState.melodyBeat >= m.dur){
          bgmState.melodyBeat = 0;
          bgmState.melodyIndex++;
          if(bgmState.melodyIndex >= melody.length){
            bgmState.melodyIndex = 0;
          }
        }
      }

      // 偶尔的高音装饰（像哭泣时的颤音，每8拍一次）
      if(bgmState.beat % 8 === 6){
        playBgmNote(NOTE_FREQ["E5"], beatDuration * 1.5, "sine", 0.025, t);
      }

      bgmState.beat++;
      if(bgmState.beat % 4 === 0){
        bgmState.currentChord++;
      }
      bgmState.nextNoteTime += beatDuration;

    } else {
      // 白天/夜晚/黄昏BGM
      const chord = CHORD_PROGRESSION[bgmState.currentChord % CHORD_PROGRESSION.length];
      const beatInBar = bgmState.beat % 4;
      const melody = style === "night" ? MELODY_NIGHT : MELODY_DAY;

      // 每小节第一拍弹低音
      if(beatInBar === 0){
        playBgmNote(NOTE_FREQ[chord.bass], beatDuration * 1.8, "sine", 0.12, t);
      }

      // 和弦铺底（八音盒风格，三角波）
      const chordNote = chord.notes[beatInBar % chord.notes.length];
      playBgmNote(NOTE_FREQ[chordNote], beatDuration * 0.8, "triangle", 0.05, t);

      // ★ 固定旋律（不再随机）
      if(bgmState.melodyIndex < melody.length){
        const m = melody[bgmState.melodyIndex];
        if(m.note && NOTE_FREQ[m.note]){
          playBgmNote(NOTE_FREQ[m.note], beatDuration * m.dur * 0.85, "sine", 0.07, t);
        }
        bgmState.melodyBeat += 1;
        if(bgmState.melodyBeat >= m.dur){
          bgmState.melodyBeat = 0;
          bgmState.melodyIndex++;
          if(bgmState.melodyIndex >= melody.length){
            bgmState.melodyIndex = 0;
          }
        }
      }

      bgmState.beat++;
      if(bgmState.beat % 4 === 0){
        bgmState.currentChord++;
      }
      bgmState.nextNoteTime += beatDuration;
    }
  }

  bgmState.timer = setTimeout(bgmScheduler, 50);
}

function updateBgmStyle(){
  const period = getCurrentPeriod();
  let newStyle = "day";
  let newBpm = 90;
  let newGain = 0.08;

  // ★ 优先级1：暗影管教页面 → 战斗BGM（激烈紧张）
  if(currentPage === "dark" || petState.discipline?.darkMode){
    newStyle = "battle";
    // 宠物越害怕，BPM越快（120→140动态变化）
    const fear = petState.discipline?.恐惧值 || 0;
    newBpm = 120 + Math.floor(fear / 100 * 20);
    newGain = 0.1;
    bgmState.currentStyle = "battle";
    bgmState.bpm = newBpm;
    bgmState.targetGain = newGain;
    bgmState.melodyIndex = 0;
    bgmState.melodyBeat = 0;
    bgmState.currentChord = 0;
    return;
  }

  // ★ 优先级2：关在笼子里 → 笼子BGM（压抑孤独）
  if(currentPage === "cage" || petState.inCage){
    newStyle = "cage";
    newBpm = 45;
    newGain = 0.06;
    bgmState.currentStyle = "cage";
    bgmState.bpm = newBpm;
    bgmState.targetGain = newGain;
    bgmState.melodyIndex = 0;
    bgmState.melodyBeat = 0;
    bgmState.currentChord = 0;
    return;
  }

  // ★ 优先级3：宠物心情很差/绝望/精神受损 → 伤感BGM
  const mood = petState.mood;
  const moodVal = petState.state?.心情 || 50;
  if(mood === "despair" || mood === "broken" || moodVal < 20){
    newStyle = "sad";
    newBpm = 65;
    newGain = 0.07;
    bgmState.currentStyle = "sad";
    bgmState.bpm = newBpm;
    bgmState.targetGain = newGain;
    bgmState.melodyIndex = 0;
    bgmState.melodyBeat = 0;
    bgmState.currentChord = 0;
    return;
  }

  // 优先级4：时间影响
  if(isNightTime()){
    newStyle = "night";
    newBpm = 60;
    newGain = 0.05;
  } else if(period.name === "黄昏"){
    newStyle = "dusk";
    newBpm = 75;
    newGain = 0.07;
  } else if(period.name === "中午"){
    newStyle = "noon";
    newBpm = 100;
    newGain = 0.09;
  }

  // 场景影响（喂食/玩耍稍快）
  if(currentPage === "feed" || currentPage === "play"){
    newBpm = Math.min(newBpm + 15, 120);
  }

  if(newStyle !== bgmState.currentStyle || newBpm !== bgmState.bpm){
    bgmState.currentStyle = newStyle;
    bgmState.bpm = newBpm;
    bgmState.melodyIndex = 0;
    bgmState.melodyBeat = 0;
  }
  bgmState.targetGain = newGain;
}

function startBgm(){
  if(!audioCtx || !audioEnabled || bgmState.playing) return;
  bgmState.playing = true;
  bgmState.nextNoteTime = audioCtx.currentTime + 0.1;
  bgmState.currentChord = 0;
  bgmState.beat = 0;
  updateBgmStyle();
  bgmScheduler();
}

function stopBgm(){
  bgmState.playing = false;
  if(bgmState.timer){
    clearTimeout(bgmState.timer);
    bgmState.timer = null;
  }
}

// BGM 音量渐变（交叉淡入淡出）
setInterval(()=>{
  if(!audioCtx || !bgmGain) return;
  bgmState.currentGain += (bgmState.targetGain - bgmState.currentGain) * 0.05;
  bgmGain.gain.value = bgmState.currentGain;
}, 100);

// 每5秒更新BGM风格
setInterval(()=>{
  if(bgmState.playing) updateBgmStyle();
}, 5000);

/* ═══════════════ 三层后果系统（延迟反应 + 命运分支） ═══════════════ */
function addDelayedReaction(type, delayMs, data){
  if(!petState.pendingReactions) petState.pendingReactions = [];
  petState.pendingReactions.push({
    type: type,
    triggerAt: Date.now() + delayMs,
    data: data || {},
    triggered: false
  });
  saveState();
}

function checkDelayedReactions(){
  if(!petState.pendingReactions) return;
  const now = Date.now();
  petState.pendingReactions.forEach(r=>{
    if(!r.triggered && now >= r.triggerAt){
      r.triggered = true;
      triggerDelayedReaction(r);
    }
  });
  // 清理已触发的
  petState.pendingReactions = petState.pendingReactions.filter(r=>!r.triggered);
}

function triggerDelayedReaction(reaction){
  const pk = currentPage || "home";
  switch(reaction.type){
    case "被打后冷淡":
      // 被打后第二天不主动找你
      if(pk === "home"){
        showBubbleFor("home", pick(["……（它看了你一眼，扭过头）","不想理你。","……哼。","（背对着你）"]));
        sfxSad();
      }
      break;
    case "喂食后报恩":
      // 喂了最爱三天后送礼物
      if(pk === "home" && !petState.fateFlags.送过礼物){
        petState.fateFlags.送过礼物 = true;
        showBubbleFor("home", pick(["（它叼来一个亮晶晶的东西给你）","给你……我藏的宝贝。","（用头蹭蹭你的手）"]));
        sfxHappy();
        showModal({
          title: "🎁 它送了你礼物",
          text: "它把自己藏了很久的宝贝送给了你。\n亲密度 +10",
          actions:[{ label:"收下", type:"primary", onClick:()=>{
            petState.state.亲密度 = clamp(petState.state.亲密度 + 10, 0, 100);
            saveState();
          }}]
        });
      }
      break;
    case "饿肚子后不安":
      // 饿了一天后在日记里写不安
      if(pk === "home"){
        showBubbleFor("home", pick(["……你是不是不要我了？","（它缩在角落，看起来很不安）","好饿……你去哪了？"]));
        sfxSad();
        petState.state.心情 = clamp(petState.state.心情 - 10, 0, 100);
        petState.state.信任度 = clamp(petState.state.信任度 - 5, 0, 100);
      }
      break;
    case "被冷落":
      // 被冷落很久后主动找你
      if(pk === "home"){
        showBubbleFor("home", pick(["……你已经很久没理我了。","陪陪我好不好？","（它慢慢走过来，蹭了蹭你）","我好想你……"]));
        petState._targetX = pet.homeX + rand(-30, 30);
        petState._targetY = pet.homeY;
      }
      break;
  }
  saveState();
}

function checkFateBranches(){
  if(!petState.fateFlags) return;
  const s = petState.state;
  const mem = petState.memory;
  const now = Date.now();

  // 命运分支1：被打10次 + 记仇高 → 不再叫你主人
  if(!petState.fateFlags.不再叫主人 && mem && mem.summary.被管教次数 >= 10 && petState.traits.记仇 > 60){
    petState.fateFlags.不再叫主人 = true;
    showModal({
      title: "💔 它变了",
      text: "它不再叫你'主人'了。\n它开始用'你'来称呼你。\n信任度 -20，亲密度 -15",
      actions:[{ label:"……", type:"danger", onClick:()=>{
        s.信任度 = clamp(s.信任度 - 20, 0, 100);
        s.亲密度 = clamp(s.亲密度 - 15, 0, 100);
        saveState();
      }}]
    });
    recordMemory("命运分支", "不再叫主人");
  }

  // 命运分支2：被爱30次 + 亲密度高 → 主动送礼物
  if(!petState.fateFlags.送过礼物 && mem && mem.summary.被爱次数 >= 30 && s.亲密度 > 80){
    addDelayedReaction("喂食后报恩", 1000, {});
  }

  // 命运分支3：被忽略 → 离家出走（完整回归机制）
  const daysSinceLastInteract = (now - (mem ? mem.lastInteraction : now)) / (1000 * 60 * 60 * 24);
  const hoursSinceLastInteract = (now - (mem ? mem.lastInteraction : now)) / (1000 * 60 * 60);
  // 触发条件：亲密度<30 + 连续12小时未互动，或者被忽略7天
  const shouldRunAway = !petState.fateFlags.离家出走 && 
    ((s.亲密度 < 30 && hoursSinceLastInteract >= 12) || daysSinceLastInteract >= 7);
  
  if(shouldRunAway && !petState.runawayState){
    petState.fateFlags.离家出走 = true;
    petState.runawayState = {
      leftAt: Date.now(),
      location: pick(["客厅", "街角", "公园", "废弃星尘区", "伴侣处"]),
      status: "出走中",
      survivalRolls: 0,
      letter: pick([
        "我走了。这个家好像不需要我。",
        "对不起，我只是想出去看看。",
        "如果你还想要我，就来找我吧。",
        "我会在某个地方等你……",
        "不要找我了。"
      ])
    };
    showModal({
      title: "🏃 它离家出走了",
      text: "它留下了一封信：\n'" + petState.runawayState.letter + "'\n\n它现在可能在：" + petState.runawayState.location + "\n你可以选择去找它，或者等它自己回来。",
      actions:[
        { label:"去找它", type:"primary", onClick:()=>{
          // 去找它：100%成功，除非它已经死了
          if(petState.runawayState.status === "已死亡"){
            showModal({ title:"💔 来不及了", text:"它已经不在了……\n你在" + petState.runawayState.location + "找到了它的项圈。", actions:[{label:"重新开始",type:"primary",onClick:()=>{localStorage.removeItem(STORAGE_KEY);location.reload();}}] });
          } else {
            petState.runawayState.status = "被找回";
            petState.runawayState.foundAt = Date.now();
            // 回归效果：信任度大幅降低，亲密度重置
            s.信任度 = clamp(s.信任度 - 30, 0, 100);
            s.亲密度 = clamp(s.亲密度 + 10, 0, 100); // 找它回来会增加一点亲密度
            petState.shadow = clamp(petState.shadow + 10, 0, 100);
            recordMemory("被找回", "从" + petState.runawayState.location + "找回");
            showModal({
              title:"✨ 找到了",
              text:"你在" + petState.runawayState.location + "找到了它。\n它看起来很虚弱，但还活着。\n它看了你一眼，没有说话。",
              actions:[{label:"带它回家",type:"primary",onClick:()=>{
                petState.runawayState = null;
                petState.fateFlags.离家出走 = false;
                showBubbleFor("home", pick(["……你来了。","（小声）对不起。","（躲开你的目光）","……"]));
                saveState();
              }}]
            });
          }
        }},
        { label:"等它自己回来", type:"default", onClick:()=>{
          // 不找：进入等待状态，宠物可能自己回来，也可能死在外面
          petState.runawayState.waiting = true;
          showBubbleFor("home", "你决定等它自己回来……");
        }}
      ]
    });
  }
  
  // 出走期间的生存判定（每小时一次）
  if(petState.runawayState && petState.runawayState.waiting){
    const hoursAway = (Date.now() - petState.runawayState.leftAt) / (1000 * 60 * 60);
    const rollInterval = 1; // 每小时判定一次
    if(hoursAway >= (petState.runawayState.survivalRolls + 1) * rollInterval){
      petState.runawayState.survivalRolls++;
      // 生存判定：胆量、粘人度、亲密度、好奇心、外部威胁
      const survivalChance = Math.max(0.1, 
        0.7 - hoursAway * 0.05 + // 时间越长越危险
        (petState.traits.胆量 - 50) * 0.005 + // 胆量高更容易活
        (petState.traits.粘人度 - 50) * 0.003 // 粘人高更容易回来
      );
      
      if(Math.random() > survivalChance){
        // 死亡
        petState.runawayState.status = "已死亡";
        petState.runawayState.deathCause = pick(["被食肉动物发现了", "星尘耗尽了", "太饿了……", "受了重伤没撑过去"]);
        showModal({
          title:"💔 它没有回来",
          text:"你等了很久，它还是没有回来。\n后来你听说，" + petState.runawayState.deathCause + "。\n\n（游戏结束）",
          actions:[{label:"重新开始",type:"primary",onClick:()=>{localStorage.removeItem(STORAGE_KEY);location.reload();}}]
        });
      } else if(Math.random() < 0.3){
        // 自行回归
        const returnType = pick(["悔悟回归", "走投无路回归", "受伤回归", "假装回归"]);
        petState.runawayState.status = returnType;
        petState.runawayState.returnedAt = Date.now();
        
        let returnText = "";
        let intimacyChange = 0;
        let trustChange = 0;
        
        if(returnType === "悔悟回归"){
          returnText = "它自己回来了。\n它看起来很后悔，蹭了蹭你的脚。";
          intimacyChange = 15;
          trustChange = -10;
        } else if(returnType === "走投无路回归"){
          returnText = "它回来了。\n它看起来很虚弱，身上很脏。\n'外面……好可怕。'";
          intimacyChange = 5;
          trustChange = -20;
        } else if(returnType === "受伤回归"){
          returnText = "它拖着受伤的身体回来了。\n它的身上有新的伤口。";
          intimacyChange = 10;
          trustChange = -15;
          // 增加伤口
          if(!Array.isArray(petState.marks)) petState.marks = [];
          petState.marks.push({ type: pick(["鞭痕","瘀青","伤疤"]), since: Date.now() });
        } else { // 假装回归
          returnText = "它回来了。\n它看起来很乖，但你注意到它的眼神在躲闪。";
          intimacyChange = 0;
          trustChange = -30;
          petState.shadow = clamp(petState.shadow + 20, 0, 100);
        }
        
        s.亲密度 = clamp(s.亲密度 + intimacyChange, 0, 100);
        s.信任度 = clamp(s.信任度 + trustChange, 0, 100);
        s.体力 = clamp(s.体力 - 20, 0, 100);
        s.饱腹 = clamp(s.饱腹 - 30, 0, 100);
        recordMemory("自行回归", returnType);
        
        showModal({
          title:"🚪 它回来了",
          text: returnText,
          actions:[
            { label:"接纳它", type:"primary", onClick:()=>{
              petState.runawayState = null;
              petState.fateFlags.离家出走 = false;
              s.亲密度 = clamp(s.亲密度 + 5, 0, 100);
              showBubbleFor("home", pick(["……我回来了。","（小声）对不起。","（蹭过来）不要赶我走。","……"]));
              saveState();
            }},
            { label:"拒绝它", type:"danger", onClick:()=>{
              petState.runawayState.status = "被拒绝";
              showModal({
                title:"💔 你关上了门",
                text:"它在门口站了很久，然后走了。\n这一次，它不会再回来了。\n\n（游戏结束）",
                actions:[{label:"重新开始",type:"primary",onClick:()=>{localStorage.removeItem(STORAGE_KEY);location.reload();}}]
              });
            }}
          ]
        });
      }
    }
  }

  // 连续被打计数重置
  if(petState.fateFlags.连续被打次数 > 0 && mem && mem.lastInteraction && (now - mem.lastInteraction) > 1000 * 60 * 60 * 24){
    petState.fateFlags.连续被打次数 = 0;
  }
}

  if(currentPage === "home"){
    checkDelayedReactions();

}, 10000);

/* ═══════════════ 环境互动系统（食盆变质、水盆蒸发、笼子开锁） ═══════════════ */
function checkFoodSpoilage(){
  if(!petState.bowlFood || petState.bowlFood.length === 0) return;
  const now = Date.now();
  const spoilTime = 1000 * 60 * 60 * 2; // 2小时变质
  let spoiled = false;
  petState.bowlFood.forEach(f=>{
    if(!f.addedTime) f.addedTime = now;
    if(now - f.addedTime > spoilTime && !f.spoiled){
      f.spoiled = true;
      f.name = "变质的" + f.name;
      spoiled = true;
    }
  });
  if(spoiled && currentPage === "home"){
    showBubbleFor("home", pick(["食盆里的东西好像坏了……","（它闻了闻食盆，皱起鼻子）","好臭……"]));
    sfxSad();
  }
  // 清理超过5小时的变质食物
  petState.bowlFood = petState.bowlFood.filter(f=> now - (f.addedTime || now) < 1000 * 60 * 60 * 5);
}

function checkWaterEvaporation(){
  if(!petState.hasWaterBowl) return;
  const now = Date.now();
  const hours = (now - (petState.lastWaterEvapCheck || now)) / 3600000;
  if(hours > 0.1){ // 每6分钟检查一次
    petState.water = clamp((petState.water || 50) - hours * 3, 0, 100); // 每小时蒸发3%
    petState.lastWaterEvapCheck = now;
    if(petState.water < 10 && currentPage === "home" && !petState.waterAsked){
      petState.waterAsked = true;
      showBubbleFor("home", pick(["水盆快干了……","想喝水……","（它看着空水盆）"]));
    }
  }
}

function checkCageEscape(){
  if(!petState.inCage) return;
  const now = Date.now();

  // ★ 笼子里的主动行为：说话、挣扎、抓栏杆
  if(currentPage === "cage" || currentPage === "home"){
    const pageKey = currentPage === "cage" ? "cage" : "home";
    if(Math.random() < 0.003){
      const s = petState.state;
      const cageTime = (now - (petState.cageSince || now)) / 60000;  // 被关了多少分钟
      let behavior = Math.random();

      if(cageTime > 10 && behavior < 0.3){
        // 被关久了：绝望/哭泣
        triggerBodyReaction("crying_sob", 2000, 0.7);
        triggerBodyReaction("trembling", 2000, 0.6);
        showBubbleFor(pageKey, pick([
          "放我出去……",
          "呜呜……我错了……",
          "（抓栏杆）放我出去！",
          "我再也不敢了……",
          "（蜷缩在角落）……"
        ]));
      } else if(behavior < 0.3){
        // 挣扎/抓栏杆
        triggerBodyReaction("trembling", 1500, 0.8);
        triggerBodyReaction("head_shake", 800, 0.7);
        sfxCage();
        showBubbleFor(pageKey, pick([
          "（摇晃笼子）放我出去！",
          "（抓栏杆）咔咔……",
          "开门！开门！",
          "你放我出去！",
          "（用身体撞笼子）"
        ]));
      } else if(behavior < 0.5){
        // 求饶
        triggerBodyReaction("crying_whimper", 2000, 0.6);
        showBubbleFor(pageKey, pick([
          "我知道错了……",
          "放我出去好不好？",
          "求求你了……",
          "我以后会乖的……",
          "（眼巴巴看着你）"
        ]));
      } else if(behavior < 0.7){
        // 生气/记仇
        triggerBodyReaction("trembling", 1500, 0.5);
        showBubbleFor(pageKey, pick([
          "……我记住了。",
          "哼，放我出去你就完了。",
          "（瞪着你）",
          "你会后悔的。",
          "……（沉默）"
        ]));
      } else if(behavior < 0.85){
        // 研究锁
        showBubbleFor(pageKey, pick([
          "（摆弄笼子的锁……）",
          "咔哒……",
          "（研究锁的结构）",
          "这个锁……好像不难？",
          "（偷偷试开锁）"
        ]));
      } else {
        // 睡觉/发呆
        triggerBodyReaction("blank_stare", 2000, 0.6);
        showBubbleFor(pageKey, pick([
          "（发呆）……",
          "zzz……",
          "（蜷缩着睡觉）",
          "……（两眼无神）",
          "（数栏杆）1、2、3……"
        ]));
      }
    }
  }

  const hours = (now - (petState.lastCageEscapeCheck || now)) / 3600000;
  if(hours > 0.5){ // 每30分钟检查一次
    petState.lastCageEscapeCheck = now;
    petState.escapeAttempts = (petState.escapeAttempts || 0) + 1;
    // 开锁概率：锁等级越低、被关越久、智商越高，概率越大
    const iq = petState.traits ? (petState.traits.好奇 || 50) : 50;
    const lockBonus = petState.cageLockLevel * 15;
    const timeBonus = Math.min(hours * 5, 30);
    const escapeChance = Math.max(0, (iq / 2 + timeBonus - lockBonus) / 100);
    if(Math.random() < escapeChance){
      // 开锁成功！
      petState.inCage = false;
      petState.escapeAttempts = 0;
      if(currentPage === "home"){
        showBubbleFor("home", pick(["（它自己把笼子打开了！）","嘿嘿，出来了~","（它得意地看着你）","锁不难嘛。"]));
        sfxHappy();
        showModal({
          title: "🔓 它自己开锁跑出来了",
          text: "它研究了很久笼子的锁，终于打开了。\n看来简单的锁已经关不住它了。",
          actions:[{ label:"这就去抓它", type:"primary", onClick:()=>{} }]
        });
      }
      recordMemory("自己开锁", "逃跑成功");
    } else if(Math.random() < 0.3 && currentPage === "home"){
      // 开锁失败，但会发出声音
      showBubbleFor("home", pick(["（它在摆弄笼子的锁……）","咔哒……","（它又在试开锁了）"]));
    }
  }
}

/* ═══════════════ AI 灵魂层 ═══════════════ */
let soulState = {
  lastThinkTime: 0,
  thinkInterval: 60000,  // 从30秒改成60秒，大幅降低主动说话频率
  pendingAction: null,
  currentThought: ""
};
// 玩家活动跟踪
const playerActivity = {
  lastInteraction: Date.now(),
  lastPageChange: Date.now(),
  lastMouseMove: Date.now(),
  awayNotified: false,
  idleNotified: false,
  lonelyStage: 0,  // 0=正常, 1=不安, 2=求你, 3=孤独, 4=绝望
  lastLonelyTalk: 0
};

async function petSoulTick(){
  if(currentPage !== "home") return;
  if(dragging) return;
  // ★ 对话保护：用户正在对话时，灵魂层不主动决策
  if(petState._isTalking) return;
  if(Date.now() - soulState.lastThinkTime < soulState.thinkInterval) return;
  soulState.lastThinkTime = Date.now();

  const s = petState.state;
  const now = Date.now();
  const idleMinutes = (now - playerActivity.lastInteraction) / 60000;

  // ★ 被冷落的渐进式反应（5个阶段）
  if(idleMinutes > 0.5){  // 30秒没互动就开始有反应
    const stage = idleMinutes < 1 ? 1 : idleMinutes < 3 ? 2 : idleMinutes < 8 ? 3 : idleMinutes < 15 ? 4 : 5;
    if(stage > playerActivity.lonelyStage){
      playerActivity.lonelyStage = stage;
      triggerLonelyReaction(stage);
      return;
    }
    // 同一阶段内每隔一段时间继续说话（从30秒改成60秒）
    if(now - playerActivity.lastLonelyTalk > 60000 && stage >= 2){
      triggerLonelyReaction(stage);
      return;
    }
  }
  // 有交互时重置
  if(idleMinutes < 0.5){
    playerActivity.lonelyStage = 0;
    playerActivity.idleNotified = false;
    playerActivity.awayNotified = false;
  }

  // ★ 一直不让睡觉的反应
  if(s.体力 < 15 && petState.mood !== "sleepy" && Math.random() < 0.5){
    showBubbleFor("home", pick(["好困……让我睡嘛……","眼皮好重……","我要睡着了……"]));
    setMoodOverride("sleepy", 5000);
    return;
  }

  // 紧急响应
  if(s.体力 < 20 && petState.mood !== "sleepy"){
    petAutoAction("sleep");
    return;
  }

  // ★ 口渴反应（渐进式）
  if(petState.water !== undefined){
    const water = petState.water;
    if(water < 10 && Math.random() < 0.3){
      // 极度口渴：舔嘴唇+找水+虚弱
      triggerBodyReaction("tongue_out", 2000, 0.6);  // 舔嘴唇
      triggerBodyReaction("trembling", 2000, 0.5);   // 虚弱发抖
      triggerBodyReaction("dizzy", 1500, 0.4);       // 头晕
      // 走到水盆旁边
      const zones = sceneLayout();
      if(zones.water){
        petState._targetX = zones.water.x;
        petState._targetY = zones.water.y - 30;
      }
      showBubbleFor("home", pick([
        "（舔嘴唇）好渴……水……",
        "（虚弱地爬向水盆）给我水……",
        "（舌头干得发疼）渴死了……",
        "（两眼无神）水……我要水……",
        "（趴在水盆边）为什么没有水……"
      ]));
      recordMemory("口渴", "极度口渴");
      return;
    }
    if(water < 25 && Math.random() < 0.25){
      // 中度口渴：舔嘴唇+抱怨
      triggerBodyReaction("tongue_out", 1500, 0.5);  // 舔嘴唇
      // 走到水盆旁边看看
      const zones = sceneLayout();
      if(zones.water && Math.random() < 0.5){
        petState._targetX = zones.water.x;
        petState._targetY = zones.water.y - 30;
      }
      showBubbleFor("home", pick([
        "（舔嘴唇）有点渴了……",
        "（看向水盆）水好像没了……",
        "（舔嘴唇）想喝水……",
        "（扒拉水盆）空的……",
        "（舔嘴唇）主人，我渴了……"
      ]));
      recordMemory("口渴", "口渴");
      return;
    }
    if(water < 40 && Math.random() < 0.1){
      // 轻度口渴：偶尔舔嘴唇
      triggerBodyReaction("tongue_out", 1000, 0.3);
      showBubbleFor("home", pick([
        "（舔嘴唇）",
        "（咽了咽口水）",
        "（舔嘴唇）有点干……"
      ]));
      return;
    }
  }

  if(s.饱腹 < 25 && !petState.hungryAsked){
    petState.hungryAsked = true;
    showBubbleFor("home", "我饿了……");
    return;
  }

  // ★ 玩家信息询问（宠物会主动问你的名字、生日等）
  checkPlayerInfoQuestions();
  // ★ 检查今天是不是玩家生日
  checkPlayerBirthday();
  // ★ 纪念日检查
  checkAnniversary();
  // ★ 门口等你
  checkWaitingAtDoor();
  // ★ 偶尔提到你之前说过的话
  mentionPastWords();
  // ★ 小秘密（亲密度高时偶尔偷偷告诉你）
  tellSecret();

  // 隐藏状态检查
  checkHiddenStates();
  // 离家出走检查
  checkRunaway();
  checkRunawayReturn();
  // 伴侣事件检查
  checkPartnerEvent();
  checkPartnerStatus();
  // 多宠互动
  if(petState.partner && Math.random() < 0.1){
    multiPetInteraction();
    return;
  }
  // 如果宠物离家出走了，不执行其他行为
  if(petState.runaway && petState.runaway.isAway) return;
  // 如果隐藏状态阻止了行为，直接返回
  if(applyHiddenStateBehavior()) return;

  // 食盆有食物且饱腹较低，可能偷吃
  if(petState.bowlFood && petState.bowlFood.length > 0 && s.饱腹 < 60 && Math.random() < 0.4){
    const stolen = petState.bowlFood.shift();
    s.饱腹 = clamp(s.饱腹 + 12, 0, 100);
    s.清洁 = clamp(s.清洁 - 3, 0, 100);
    showBubbleFor("home", "（它偷偷吃了" + stolen.name + "）");
    recordMemory("偷吃", stolen.name);
    return;
  }

  // 夜晚（22:00-6:00）宠物自动睡觉
  if(isNightTime() && petState.mood !== "sleepy" && Math.random() < 0.15){
    petAutoAction("sleep");
    showBubbleFor("home", "好困……晚安~");
    return;
  }

  // ★ AI融合模式：让AI决定宠物接下来做什么（每60秒一次）
  if(petState.aiFusionMode && API_URL){
    petAIDecide();
  }

  // ★ 60%概率沉默：很多时候宠物只是发呆、做小动作，不说话（降低主动说话频率）
  if(Math.random() < 0.6){
    // 沉默：只做小动作，不说话
    const silentActions = ["发呆看远方", "坐着发呆", "舔爪子"];
    idleAction = { name: pick(silentActions), startTime: performance.now(), duration: 4000 + Math.random()*3000 };
    return;
  }

  if(!API_URL){
    petSimpleThink();
    return;
  }
  petAIThink();
}

/* ═══════════════ 被冷落的渐进式反应 ═══════════════ */
async function triggerLonelyReaction(stage){
  playerActivity.lastLonelyTalk = Date.now();
  const s = petState.state;
  const mask = petState.mask;
  const selfCall = petState.selfCall || "我";

  // 根据亲密度决定称呼（亲密度高会叫主人/大人，会讨好）

  const honorific = intimacy > 70 ? (mask === "本大人" ? "大人" : "主人") : "你";

  let lines = [];
  let bodyReaction = null;
  let moodChange = 0;

  if(stage === 1){
    // 阶段1：不安（30秒-1分钟）
    lines = [
      "……你还在吗？",
      "（歪着头看你）",
      "你在干嘛呢？",
      "喂——听得到吗？",
      "（它走到你面前）"
    ];

  }
  else if(stage === 2){
    // 阶段2：求你理它（1-3分钟）
    lines = [
      "理理我嘛……",
      "求求你，理理我。",
      "（拉你的衣角）看看我嘛……",
      "不要不理我……",
      "（它在你脚边转来转去）",
      useHonorific ? honorific + "，求求你，理理" + selfCall + "嘛。" : "求求你，理理我嘛。",
      "（用头蹭你的手）"
    ];
    bodyReaction = { type: "trembling", duration: 2000, intensity: 0.4 };
    moodChange = -3;
  }
  else if(stage === 3){
    // 阶段3：讨好+害怕被抛弃（3-8分钟）
    lines = [
      useHonorific ? honorific + "，求求你，不要离开" + selfCall + "。" : "求求你，不要离开我。",
      "不要丢下我一个人，好不好？",
      "（紧紧抱着你的腿）不要走……",
      "呜呜……你是不是讨厌" + selfCall + "了？",
      useHonorific ? honorific + "你看看" + selfCall + "嘛……" : "你看看我嘛……",
      "（眼泪汪汪）求求你……",
      "不要不理我……不要离开我……",
      "（小声呜咽）呜……"

    bodyReaction = { type: "crying_whimper", duration: 3000, intensity: 0.7 };
    triggerBodyReaction("trembling", 3000, 0.6);

  else if(stage === 4){

    lines = [
      "（一个人缩在角落）……",
      "（自言自语）大家都不喜欢" + selfCall + "吗……",
      "（对着空气说话）你好呀……有人吗？",
      "（发呆）……好孤独。",
      "（小声）是不是" + selfCall + "做错了什么……",
      "（抱着自己）好冷……",
      "（眼泪无声地掉下来）……",
      "（喃喃自语）不要丢下我……不要……"
    ];
    bodyReaction = { type: "crying_silent", duration: 4000, intensity: 0.8 };
    triggerBodyReaction("blank_stare", 3000, 0.7);
    // 走到角落
    petState._targetX = W * 0.15;
    petState._targetY = H * 0.7;
    moodChange = -8;
    s.信任度 = clamp(s.信任度 - 2, 0, 100);
    petState.shadow = clamp(petState.shadow + 1, 0, 100);
  }
  else if(stage >= 5){
    // 阶段5：绝望+想死倾向（15分钟以上）
    lines = [
      "（两眼无神地看着天花板）……",
      "（喃喃）如果" + selfCall + "消失了，你会在意吗……",
      "（蜷缩成一团）好痛苦……",
      "（无声流泪）……是不是没有" + selfCall + "会更好……",
      "（对着自己的爪子发呆）……",
      "（声音沙哑）求求你……回来……",
      "（一动不动）……",
      "（小声）如果" + selfCall + "死了，你会哭吗……"
    ];
    bodyReaction = { type: "crying_silent", duration: 5000, intensity: 1 };
    triggerBodyReaction("blank_stare", 4000, 1);
    triggerBodyReaction("trembling", 4000, 0.8);
    moodChange = -12;
    s.信任度 = clamp(s.信任度 - 3, 0, 100);
    petState.shadow = clamp(petState.shadow + 3, 0, 100);

    recordMemory("被冷落", "玩家" + Math.round((Date.now() - playerActivity.lastInteraction)/60000) + "分钟没互动，进入绝望");
  }

  // 面具专属调整
  if(mask === "傲娇"){

    if(stage >= 3) lines.push("（扭过头偷偷擦眼泪）……才、才没有哭呢。");
  }
  if(mask === "病娇"){
    lines = [
      "（微笑）你不会离开" + selfCall + "的，对吧？",
      "（眼神空洞）你要是走了，" + selfCall + "就……",
      "（紧紧盯着你）不要走……不然" + selfCall + "不知道会做出什么。",
      "（自言自语）你是" + selfCall + "的……只能是" + selfCall + "的……"
    ];
    if(stage >= 4) triggerBodyReaction("blank_stare", 4000, 1);
  }
  if(mask === "冷淡"){
    lines = ["……", "（它看了你一眼，又移开视线）", "……无所谓。", "（背对著你）"];
    if(stage >= 4) lines.push("（小声）……别走。");
  }
  if(mask === "疯批"){
    lines = [
      "（笑）嘿嘿……你不理" + selfCall + "？",
      "（自言自语）那" + selfCall + "就自己找点乐子~",
      "（开始破坏东西）嘿嘿嘿……",
      "（盯着你）你会后悔的哦~"
    ];
  }

  const stageNames = ["", "不安", "求你理它", "讨好+害怕被抛弃", "孤独+自言自语", "绝望+想死倾向"];
  const line = await generateAILine(
    "被主人冷落" + stageNames[stage] || "被冷落",
    "玩家" + Math.round((Date.now() - playerActivity.lastInteraction)/60000) + "分钟没互动，亲密度" + Math.round(s.亲密度) + "，心情" + Math.round(s.心情) + "。面具：" + mask + "，自称：" + selfCall + "。",
    lines
  );
  showBubbleFor("home", line);
  addChatMessage("assistant", line);
  if(bodyReaction) triggerBodyReaction(bodyReaction.type, bodyReaction.duration, bodyReaction.intensity);
  s.心情 = clamp(s.心情 + moodChange, 0, 100);
  recordMemory("被冷落", "阶段" + stage);
  saveState();
}

/* 从玩家对话中提取信息 */
function extractPlayerInfo(input){
  if(!petState.playerInfo) return;
  const pi = petState.playerInfo;
  const text = input.trim();

  // 提取名字："我叫XX" "我是XX" "叫我XX" "我的名字是XX"
  const nameMatch = text.match(/(?:我叫|我是|叫我|我的名字是|我名字是|名字叫)\s*(.+?)(?:[，。！？\s]|$)/);
  if(nameMatch && nameMatch[1] && nameMatch[1].length <= 10){
    const name = nameMatch[1].trim();
    if(!pi.name || pi.name !== name){
      pi.name = name;
      const mask = petState.mask;
      const reactions = {
        "公主病": ["哦~" + name + "啊，本公主记住了。","" + name + "？哼，还算好听。"],
        "本大人": ["" + name + "……本大人记住了。","哦，" + name + "。"],
        "小可爱": ["" + name + "~好好听的名字！","我记住了！" + name + "~"],
        "病娇": ["" + name + "……你的名字……我会刻在心里……","" + name + "……好美的名字……只属于我……"],
        "傲娇": ["哼，" + name + "嘛……还、还行啦。","才、才不是记住了呢！"],
        "冷淡": ["……" + name + "。知道了。"],
        "疯批": ["嘿嘿~" + name + "~好好听~老子记住了！"],
        "学者": ["" + name + "。在下记录了。"],
        "戏精": ["啊~" + name + "~真是个好名字~人家记住了~"],
        "憨憨": ["" + name + "~嘿嘿，我记住了！"]
      };
      setTimeout(()=>{
        showBubbleFor("home", pick(reactions[mask] || reactions["小可爱"]));
        recordMemory("知道玩家名字", name);
      }, 500);
    }
  }

  // 提取生日："我生日是X月X日" "X月X日是我生日"
  const bdayMatch = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if(bdayMatch){
    const month = parseInt(bdayMatch[1]);
    const day = parseInt(bdayMatch[2]);
    if(month >= 1 && month <= 12 && day >= 1 && day <= 31){
      pi.birthday = { month, day };
      setTimeout(()=>{
        showBubbleFor("home", pick([
          month + "月" + day + "日……我记住了！到时候我给你过生日~",
          "你的生日是" + month + "月" + day + "日呀~我记住了！",
          "（认真点头）" + month + "月" + day + "日……不会忘的！"
        ]));
        recordMemory("知道玩家生日", month + "月" + day + "日");
      }, 500);
    }
  }

  // 提取爱好："我喜欢XX" "我的爱好是XX"
  const hobbyMatch = text.match(/(?:我喜欢|我的爱好是|我爱好是|我平时喜欢)\s*(.+?)(?:[，。！？\s]|$)/);
  if(hobbyMatch && hobbyMatch[1] && hobbyMatch[1].length <= 15){
    const hobby = hobbyMatch[1].trim();
    if(!pi.hobby || pi.hobby !== hobby){
      pi.hobby = hobby;
      setTimeout(()=>{
        showBubbleFor("home", pick([
          "你喜欢" + hobby + "呀~我记住了！",
          "（认真点头）" + hobby + "……以后我陪你一起~",
          "原来你喜欢" + hobby + "~好厉害！"
        ]));
        recordMemory("知道玩家爱好", hobby);
      }, 500);
    }
  }

  // 记录其他事情（重要的话会被标记）
  if(text.length > 5 && text.length < 50){
    let importance = "normal";
    // 识别重要的话
    if(/我喜欢你|我爱你|永远在一起|非你不娶|非你不嫁|嫁给我|我们结婚|一辈子|永远/.test(text)){
      importance = "love";
    } else if(/我要走了|再见|永别|离开你|不要你了|分手/.test(text)){
      importance = "sad";
    } else if(/我会回来|等我|很快回来|明天见/.test(text)){
      importance = "promise";
    } else if(/今天好开心|今天真高兴|谢谢你|多亏了你/.test(text)){
      importance = "happy";
    }
    pi.thingsTold.push({ text: text.slice(0, 30), time: Date.now(), importance: importance });
    if(pi.thingsTold.length > 20) pi.thingsTold.shift();
  }

  saveState();
}

/* ═══════════════ 玩家情绪感知与安慰 ═══════════════ */
function detectPlayerMood(text){
  const t = text.toLowerCase();
  // 悲伤
  if(/难过|伤心|哭|郁闷|抑郁|不开心|不高兴|失落|沮丧|心碎|痛苦|绝望|孤独|寂寞|累|疲惫|烦|压力|焦虑|担心|害怕|紧张/.test(t)){
    if(/累|疲惫|困|没力气|撑不住/.test(t)) return "tired";
    if(/烦|生气|气死|愤怒|讨厌|可恶|妈的|操/.test(t)) return "angry";
    return "sad";
  }
  if(/生气|气死|愤怒|讨厌|可恶|烦|妈的|操|滚|恨/.test(t)) return "angry";
  if(/累|疲惫|困|没力气|撑不住|加班|工作|考试|忙/.test(t)) return "tired";
  return "normal";
}

async function generateAILine(actionType, context, fallbackLines){

  }

  const s = petState.state;

只返回台词本身，不要任何其他内容。`;

  try {
    const res = await fetch(API_URL, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, API_KEY?{"Authorization":"Bearer "+API_KEY}:{}),
      body: JSON.stringify({
        model: AI_MODEL,
        messages:[
          { role:"system", content:"你是游戏AI，只输出台词。" },
          { role:"user", content: prompt }
        ],
        temperature: 0.9
      })
    });
    const data = await res.json();
    let reply = data?.choices?.[0]?.message?.content || data?.reply || "";
    reply = reply.trim().replace(/^["']|["']$/g, "");
    if(reply && reply.length > 0 && reply.length < 60){
      return reply;
    }
    return pick(fallbackLines);
  } catch(e){
    return pick(fallbackLines);
  }
}

function updateGrowthTransition(now, dt){
  if(!growthTransition.active) return;
  const elapsed = now - growthTransition.startTime;

  // 阶段1：0-500ms 屏幕变暗
  if(elapsed < 500){
    growthTransition.phase = 1;
  }
  // 阶段2：500-1500ms 闪光+宠物变大
  else if(elapsed < 1500){
    growthTransition.phase = 2;
    growthTransition.petScale = 1 + (elapsed - 500) / 1000 * 0.3;
  }
  // 阶段3：1500-2500ms 恢复正常
  else if(elapsed < 2500){
    growthTransition.phase = 3;
    growthTransition.petScale = 1.3 - (elapsed - 1500) / 1000 * 0.3;
  }
}

function isGrowthTransitionActive(){
  return growthTransition.active;
}

function getGrowthTransitionOverlayAlpha(){
  if(!growthTransition.active) return 0;
  const elapsed = performance.now() - growthTransition.startTime;
  if(elapsed < 300) return elapsed / 300 * 0.7;  // 变暗
  if(elapsed < 600) return 0.7 - (elapsed - 300) / 300 * 0.7;  // 闪光恢复
  if(elapsed < 2000) return 0;  // 正常
  if(elapsed < 2500) return (elapsed - 2000) / 500 * 0.5;  // 结尾变暗
  return 0;
}

/* ═══════════════ 成年阶段系统 ═══════════════ */
function checkAdultStage(){
  if(petState.stage === "成年" || petState.stage === "老年") return;
  if(growthTransition.active) return;  // 成长过渡中不重复触发

  const daysOld = (Date.now() - petState.birthTime) / 86400000;
  const s = petState.state;

  // ★ 第一阶段：婴儿 → 幼年（1游戏天 或 互动8次，更容易触发）
  if(petState.stage === "婴儿"){
    const canGrowToChild = daysOld >= 1 || (petState._interactCount || 0) >= 8;
    if(!canGrowToChild) return;
    petState.stage = "幼年";
    triggerGrowthTransition("幼年");
    saveState();
    return;
  }

  // ★ 第二阶段：幼年 → 成年（3游戏天，或亲密度≥50 且互动次数≥20）
  const canGrow = daysOld >= 3 || (s.亲密度 >= 50 && (petState._interactCount || 0) >= 20);
  if(!canGrow) return;

  // 阶段过渡
  petState.stage = "成年";
  petState._adultTime = Date.now();
  triggerGrowthTransition("成年");

  // 自动分配职业
  assignCareer();
  // 解锁日记
  petState.diaryUnlocked = true;
  saveState();
}

function assignCareer(){
  if(!petState.attributes) petState.attributes = generatePetAttributes();
  if(petState.attributes.career) return;

  const hobbies = petState.attributes.hobbies || [];
  const traits = petState.traits;

  // 爱好 → 职业映射
  const hobbyToCareer = {
    "写小说":"作家", "编故事":"故事家", "画画":"画家",
    "唱歌":"歌手", "做饭":"厨师", "种花":"园丁",
    "看星星":"星象师", "数星星":"星象师", "收集石头":"收藏家"
  };

  // 优先按爱好推荐
  let candidates = [];
  for(const h of hobbies){
    if(hobbyToCareer[h]) candidates.push(hobbyToCareer[h]);
  }

  // 根据性格补充
  if(traits.好奇 > 70) candidates.push("探险家");
  if(traits.粘人 > 70) candidates.push("治疗师");

  // 如果还没有，随机
  if(candidates.length === 0){
    candidates = Object.keys(CAREER_DATA);
  }

  const career = pick(candidates);
  petState.attributes.career = career;
  petState.attributes.careerLevel = 1;

  setTimeout(()=>{
    if(currentPage === "home"){
      showBubbleFor("home", "我决定了，我要成为" + career + "！", 4000);
    }
  }, 3500);
}

  if(!petState.attributes || !petState.attributes.career) return;

  const career = petState.attributes.career;

  s.心情 = clamp(s.心情 + 5, 0, 100);
  petState.attributes.careerLevel = (petState.attributes.careerLevel || 1) + 0.1;

  const eat = todayFoods.length ? pick(todayFoods) : "普通粮";
  const eatmood = petState.state.心情 > 60 ? "不错" : (petState.state.心情 > 30 ? "一般" : "很差");

  const text = template
    .replace(/\{eat\}/g, eat)
    .replace(/\{eatmood\}/g, eatmood)
    .replace(/\{player\}/g, playerProfile.nickname || "主人")
    .replace(/\{n\}/g, String(randInt(1, 30)))
    .replace(/\{m\}/g, String(randInt(0, 59)));

  const entry = {
    date: new Date().toLocaleDateString("zh-CN"),
    text: text,
    mood: petState.mood,
    read: false
  };

  if(!petState.attributes.diary) petState.attributes.diary = [];
  petState.attributes.diary.push(entry);
  if(petState.attributes.diary.length > 60){
    petState.attributes.diary.shift();
  }
  petState._todayEaten = [];
}

function setMoodOverride(mood,ms){
  moodOverride = { mood, until: performance.now()+ms };
}
function currentMood(now){
  if(moodOverride && now < moodOverride.until) return moodOverride.mood;
  const s = petState.state;
  // 刚被管教过（90 秒内）→ 持续害怕（真实感：行为影响不会马上消失）
  if(petState.discipline.lastTime && now - petState.discipline.lastTime < 90000) return "fear";
  // 身上的伤太多 → 难过
  if((petState.marks||[]).length >= 3) return "sad";
  if(s.饱腹<20 || s.清洁<20) return "sick";
  if(s.体力<20) return "sleepy";
  if(s.心情<30) return "sad";
  if(s.信任度<25) return "fear";
  if(s.心情>=50) return "happy";
  return "sad";
}

/* ═══════════════ 身体反应系统（强烈情绪/生理反应） ═══════════════ */
/*
  支持的反应类型：
  - crying_whimper: 呜咽（小声哭）
  - crying_sob: 啜泣（一抽一抽）
  - crying_bawl: 嚎啕大哭
  - crying_choke: 抽噎/哽咽
  - crying_silent: 泣不成声（无声流泪）
  - fainting: 晕厥（倒下）
  - convulsion: 痉挛/剧烈抽搐
  - trembling: 颤抖
  - dazed: 失神/呆滞/目瞪口呆
  - blank_stare: 两眼无神
  - vomiting: 呕吐
  - dizzy: 头晕（转圈）
  - cold_sweat: 冒冷汗
  - rolling_eyes: 翻白眼
  - drooling: 流口水
  - blushing: 脸红
  - foaming: 口吐白沫
  - incontinence: 失禁
  - tongue_out: 吐舌头
  - head_shake: 摇头晃脑
*/
let bodyReaction = { type: null, until: 0, intensity: 1 };

function triggerBodyReaction(type, duration, intensity){
  bodyReaction.type = type;
  bodyReaction.until = Date.now() + duration;
  bodyReaction.intensity = intensity || 1;
}

function getActiveBodyReaction(){
  if(bodyReaction.type && Date.now() < bodyReaction.until){
    return bodyReaction;
  }
  return null;
}

/* 哭泣台词库（按程度分） */
const CRYING_LINES = {
  whimper: ["呜……","呜呜……","（小声抽泣）","……呜","（肩膀发抖）"],
  sob: ["呜……呜呜……","抽……抽噎……","（一抽一抽地哭）","嗝……呜……","眼泪止不住……"],

  choke: ["呜……咳咳……","（哽咽）说……说不出话……","（抽噎到喘不过气）","嗝……呜……咳咳……"],

/* 被打后的反应（按严重程度） */
async function triggerHitReaction(severity){
  // severity: 1=轻, 2=中, 3=重, 4=极重
  const s = petState.state;
  const mask = petState.mask;
  const d = petState.discipline;

  // ★ 面具专属反应（覆盖标准反应）
  const maskReaction = getMaskHitReaction(mask, severity);
  if(maskReaction){
    // 应用面具专属的身体反应
    maskReaction.bodyReactions.forEach(br => {
      triggerBodyReaction(br.type, br.duration, br.intensity);
    });
    // 应用面具专属台词
    if(maskReaction.lines.length > 0){
      setTimeout(()=>{
        showBubbleFor(currentPage, pick(maskReaction.lines));
      }, 300);
    }
    // 应用数值影响
    if(maskReaction.moodChange) s.心情 = clamp(s.心情 + maskReaction.moodChange, 0, 100);
    if(maskReaction.energyChange) s.体力 = clamp(s.体力 + maskReaction.energyChange, 0, 100);
    // ★ 面具专属也可能求饶（恐惧值高时）
    if(d.恐惧值 > 60 && severity >= 2 && Math.random() < 0.5){
      setTimeout(async ()=>{
        showBubbleFor(currentPage, await getBegForMercyLine(severity));
      }, 1500);
    }
    return;
  }

  // ★ 生成求饶台词（根据恐惧值和亲密度）
  const begLine = await getBegForMercyLine(severity);

  if(severity >= 4){
    // 极重：晕厥+抽搐+失禁
    triggerBodyReaction("fainting", 5000, 1);
    setTimeout(()=>{
      triggerBodyReaction("convulsion", 4000, 1);
      triggerBodyReaction("incontinence", 3000, 1);
    }, 1000);
    showBubbleFor(currentPage, pick(["……","（失去意识）","……呜……","（两眼翻白）","（身体剧烈抽搐）"]));
    s.体力 = clamp(s.体力 - 20, 0, 100);
  } else if(severity >= 3){
    // 重：嚎啕大哭+抽搐+口吐白沫
    triggerBodyReaction("crying_bawl", 6000, 1);
    setTimeout(()=> triggerBodyReaction("convulsion", 3000, 0.7), 500);
    if(Math.random() < 0.3) triggerBodyReaction("foaming", 4000, 0.5);
    // 先哭，然后求饶
    showBubbleFor(currentPage, pick(CRYING_LINES.bawl));
    if(d.恐惧值 > 50){
      setTimeout(()=>{
        showBubbleFor(currentPage, begLine);
        triggerBodyReaction("crying_choke", 3000, 0.8);
      }, 2000);
    }
    s.体力 = clamp(s.体力 - 10, 0, 100);
    s.心情 = clamp(s.心情 - 15, 0, 100);
  } else if(severity >= 2){
    // 中：啜泣+颤抖+冒冷汗
    triggerBodyReaction("crying_sob", 4000, 1);
    triggerBodyReaction("trembling", 5000, 0.8);
    triggerBodyReaction("cold_sweat", 4000, 0.6);
    showBubbleFor(currentPage, pick(CRYING_LINES.sob));
    if(d.恐惧值 > 40 && Math.random() < 0.6){
      setTimeout(()=>{
        showBubbleFor(currentPage, begLine);
      }, 1500);
    }
    s.心情 = clamp(s.心情 - 8, 0, 100);
  } else {
    // 轻：呜咽+颤抖
    triggerBodyReaction("crying_whimper", 3000, 1);
    triggerBodyReaction("trembling", 3000, 0.5);
    showBubbleFor(currentPage, pick(CRYING_LINES.whimper));
    if(d.恐惧值 > 50 && Math.random() < 0.4){
      setTimeout(()=>{
        showBubbleFor(currentPage, begLine);
      }, 1200);
    }
    s.心情 = clamp(s.心情 - 4, 0, 100);
  }
}

/* ═══════════════════════════════════════════════════════
   9. 气泡系统
   ═══════════════════════════════════════════════════════ */
let lastBubbleTime = 0;  // 上次说话时间，用于控制说话频率
const BUBBLE_COOLDOWN = 6000;  // 说话最小间隔6秒（确保一句话说完）

function showBubbleFor(pageKey, text, duration, priority){
  const b = bubbles[pageKey];
  if(!b || !b.el) return;

  // ★ 高优先级（玩家交互回应）：跳过冷却，立即显示，可打断正在说的话
  const isHighPriority = priority === "high";

  if(!isHighPriority){
    // 低优先级（主动说话）：受冷却限制
    const now = Date.now();
    const waitTime = BUBBLE_COOLDOWN - (now - lastBubbleTime);
    if(waitTime > 0 && pageKey === "home"){
      setTimeout(()=>{ showBubbleFor(pageKey, text, duration, priority); }, waitTime);
      return;
    }
    lastBubbleTime = now;
  } else {
    // 高优先级：重置冷却时间，立即显示
    lastBubbleTime = Date.now();
  }

  b.text = text;
  b.thinking = false;
  if(b.typeTimer) clearInterval(b.typeTimer);
  if(b.hideTimer) clearTimeout(b.hideTimer);

  // ★ 语录去重：记录这句话
  recordSpokenLine(text);

  // GAL 对话框：home 页面时同时在底部对话框显示
  if(pageKey === "home"){
    const galText = document.getElementById("homeGalText");
    const galName = document.getElementById("homeGalName");
    if(galText && galName){
      galName.textContent = petState.name || "小星";
      galText.textContent = text;
    }
  }

  const emoji = MASK_EMOJI[petState.mask] || "🌸";
  b.el.querySelector(".bubble-emoji").textContent = emoji;
  const textEl = b.el.querySelector(".bubble-text");
  textEl.textContent = "";
  b.el.classList.add("show");
  // 语音模拟：宠物说话时播放电子哔哔声
  playVoice(text, petState.mood);

  let i = 0;
  b.typeTimer = setInterval(()=>{
    i++;
    textEl.textContent = text.slice(0,i);
    if(i >= text.length){
      clearInterval(b.typeTimer);
      b.typeTimer = null;
    }
  }, 100);  // 放慢到原来的2倍（50→100ms）

  const hold = duration || (isHighPriority ? 3000 : 4000);  // 高优先级停留时间稍短，方便连续交互
  b.hideTimer = setTimeout(()=>{
    b.el.classList.remove("show");
  }, hold + text.length*100);  // 逐字时间也翻倍
}

function showThinking(pageKey){
  const b = bubbles[pageKey];
  if(!b || !b.el) return;
  if(b.hideTimer) clearTimeout(b.hideTimer);
  b.el.querySelector(".bubble-emoji").textContent = MASK_EMOJI[petState.mask]||"🌸";
  b.el.querySelector(".bubble-text").textContent = "正在思考...";
  b.el.classList.add("show");
  // ★ 标记正在对话，阻止主动说话打断
  petState._isTalking = true;
  setTimeout(()=>{ petState._isTalking = false; }, 15000);
}

function hideBubbleFor(pageKey){
  const b = bubbles[pageKey];
  if(!b || !b.el) return;
  b.el.classList.remove("show");
}

/* ═══════════════════════════════════════════════════════
   12. 页面切换
   ═══════════════════════════════════════════════════════ */
function resizePageCanvas(pageKey){
  const c = canvases[pageKey];
  if(!c) return;
  const parent = c.parentElement;
  if(!parent) return;
  const pw = parent.clientWidth;
  const ph = parent.clientHeight;
  if(pw <= 0 || ph <= 0) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.floor(pw * dpr);
  c.height = Math.floor(ph * dpr);
  c.style.width = pw + "px";
  c.style.height = ph + "px";
  ctxs[pageKey].setTransform(dpr, 0, 0, dpr, 0, 0);
  // 重新初始化该页背景元素（尺寸变了，旧的坐标就废了）
  if(stars[pageKey])   initStarsFor(pageKey);
  if(clouds[pageKey])  initCloudsFor(pageKey);
  if(bgParticles[pageKey]) initParticlesFor(pageKey);
}

function switchPage(name){
  // 新增：opening 页面
  if(name === "opening"){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    const op = document.getElementById("page-opening");
    if(op) op.classList.add("active");
    currentPage = "opening";
    // ★ 立即初始化开场canvas（不等待，确保蛋能出现）
    try { initOpeningCanvas(); } catch(e){ console.warn("initOpeningCanvas error", e); }
    // ★ 停止BGM和所有音效（回到开场时应该安静）
    try { stopBgm(); } catch(e){}
    // 停止所有正在播放的音效
    if(audioCtx){
      try {
        // 淡出所有音效
        if(sfxGain) sfxGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
      } catch(e){}
    }
    return;
  }

  // ★ 离开home时记录时间
  if(currentPage === "home" && name !== "home"){
    petState._leftHomeAt = Date.now();
  }

  const pages = document.querySelectorAll(".page");
  pages.forEach(p=>p.classList.remove("active"));
  const target = document.getElementById("page-"+name);
  if(target) target.classList.add("active");
  currentPage = name;

  // ★ 切换页面时立即更新BGM风格（不再等5秒）
  if(bgmState.playing) updateBgmStyle();

  // ★ 回到home时，如果离开太久，宠物会抱怨
  if(name === "home" && petState._leftHomeAt){
    const awayTime = Date.now() - petState._leftHomeAt;
    if(awayTime > 120000){  // 超过2分钟
      const minutes = Math.floor(awayTime / 60000);
      setTimeout(()=>{
        const lines = [
          "你终于回来了……我等了好久",
          "你去哪了嘛！人家好想你",
          "（赌气）你还知道回来啊",
          "哼，我还以为你不要我了",
          "你走了"+minutes+"分钟呢……",
          "（扑过来）你回来啦！"
        ];
        showBubbleFor("home", pick(lines));
        petState.state.心情 = clamp(petState.state.心情 - 2, 0, 100);
      }, 500);
    }
    petState._leftHomeAt = null;
  }

  // 重置宠物位置
  if(!dragging){
    pet.x = pet.homeX;
    pet.y = pet.homeY;
  }
  // 各页面初始化
  if(name==="feed") renderFoodGrid();
  if(name==="bath") initBathPage();
  if(name==="play") initPlayPage();
  if(name==="cage") initCagePage();
  if(name==="discipline") initDisciplinePage();
  if(name==="dark") initDarkPage();
  if(name==="dress") initDressPage();
  if(name==="family") renderFamilyPage();
  if(name==="diary") renderDiaryPage();
  if(name==="settings") renderSettingsPage();

  // 延迟两帧后重算 canvas，确保父容器已经有尺寸
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(currentPage === name) resizePageCanvas(name);
    });
  });
}

function sceneLayout(){

  return {
    cage:      { x: W*0.15, y: H*0.18, w: 260*scale, h: 260*scale },

  };
