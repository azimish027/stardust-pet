/* 检查内容安全（在敏感操作前调用） */
function checkContentSafety(feature){
  const cs = petState.contentSettings;
  if(feature === "darkMode" && !cs.darkMode) return false;
  if(feature === "death" && !cs.death) return false;
  if(feature === "runaway" && !cs.runaway) return false;
  if(feature === "multiPetConflict" && !cs.multiPetConflict) return false;
  return true;
}

async function doDiscipline(action){
  petState._interactCount = (petState._interactCount || 0) + 1;
  addAction("主人对你使用了" + action);
  const s = petState.state;
  const mul = disciplineState.intensity === "轻" ? 0.5 :
              disciplineState.intensity === "重" ? 1.5 : 1.0;

  const effects = {
    "训斥":    { 信任:-5, 纪律:5, 恐惧:0, 暗影:2 },
    "星光教鞭":{ 信任:-15, 恐惧:15, 服从:10, 暗影:8 },
    "毛绒手套":{ 信任:-10, 恐惧:10, 服从:15, 暗影:6 },
    "禁闭":    { 信任:-20, 恐惧:20, 愤怒:15, 暗影:10 },
    "减食":    { 信任:-15, 愤怒:20, 减食:30, 暗影:7 },
    "冷处理":  { 信任:-10, 亲密度:-15, 心情:-20, 暗影:5 }
  };

  const e = effects[action];
  if(!e) return;

  if(e.信任) s.信任度 = clamp(s.信任度 + e.信任*mul, 0, 100);
  if(e.恐惧) petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + e.恐惧*mul, 0, 100);
  if(e.服从) petState.discipline.服从值 = clamp(petState.discipline.服从值 + e.服从*mul, 0, 100);
  if(e.亲密度) s.亲密度 = clamp(s.亲密度 + e.亲密度*mul, 0, 100);
  if(e.心情) s.心情 = clamp(s.心情 + e.心情*mul, 0, 100);
  if(e.愤怒) s.心情 = clamp(s.心情 - e.愤怒*mul, 0, 100);
  if(e.减食) s.饱腹 = clamp(s.饱腹 - 30*mul, 0, 100);
  if(e.暗影) petState.shadow = clamp(petState.shadow + e.暗影*mul, 0, 100);

  // ★ 持久痕迹：管教在它身上留下看得见的伤（存进存档，跨页面一直显示）
  const markMap = { "星光教鞭":"鞭痕", "训斥":"泪痕", "毛绒手套":"瘀青", "禁闭":"锁痕", "减食":"泪痕", "冷处理":"瘀青" };
  const mk = markMap[action];
  if(mk){
    if(!Array.isArray(petState.marks)) petState.marks = [];
    petState.marks.push({ type: mk, since: Date.now() });
    if(petState.marks.length > 5) petState.marks.shift();
  }
  // ★ 情绪记忆：它记得被管教这件事（影响后续表情和主动说话）
  petState.discipline.count = (petState.discipline.count||0) + 1;
  petState.discipline.lastTime = Date.now();

  // ★ 行为记忆：被管教后会记住，减少再犯概率
  if(!petState.behaviorMemory) petState.behaviorMemory = {
    随地大小便被管教: 0, 破坏东西被管教: 0, 咬人被管教: 0, 不听话被管教: 0, lastDisciplineTime: 0
  };
  petState.behaviorMemory.lastDisciplineTime = Date.now();
  // 根据管教强度增加记忆
  const memoryGain = disciplineState.intensity === "重" ? 30 : disciplineState.intensity === "轻" ? 10 : 20;
  petState.behaviorMemory.不听话被管教 = clamp(petState.behaviorMemory.不听话被管教 + memoryGain, 0, 100);

  // ★ 身体反应系统
  let disciplineSeverity = 1;
  if(action === "训斥") disciplineSeverity = 1;
  else if(action === "冷处理" || action === "减食") disciplineSeverity = 2;
  else if(action === "毛绒手套") disciplineSeverity = 2;
  else if(action === "星光教鞭") disciplineSeverity = 3;
  else if(action === "禁闭") disciplineSeverity = 2;
  // 累积次数增加严重程度
  const totalCount = petState.discipline.count || 1;
  disciplineSeverity = Math.min(4, disciplineSeverity + Math.floor(totalCount / 5));
  if(!isYandereLoyal()){
    await triggerHitReaction(disciplineSeverity);
  } else {
    // 病娇忠诚线：被打反而脸红+开心
    triggerBodyReaction("blushing", 3000, 1);
    triggerBodyReaction("trembling", 2000, 0.5);
  }

  // 反应
  let text = "";
  if(isYandereLoyal()){
    // 病娇忠诚线：被虐待反而更黏人
    text = yandereReply(action === "禁闭" ? "cage" : "hit");
    setMoodOverride("happy", 3000);  // 反直觉：被虐待后反而显得"满足"
    petState.state.亲密度 = clamp(petState.state.亲密度 + 5, 0, 100);
    petState.shadow = clamp(petState.shadow + 5, 0, 100);
  } else {
    const bt = BODY_TYPES[petState.bodyType] || BODY_TYPES["圆胖型"];
    if(bt.disciplineReact === "resist" && petState.traits.胆量 > 60){
      text = "你凭什么……！";
      setMoodOverride("angry", 3000);
    } else if(bt.disciplineReact === "stubborn"){
      text = "哼。";
      setMoodOverride("angry", 2500);
    } else if(petState.traits.记仇 > 60){
      text = "……我记住了。";
      setMoodOverride("sad", 3000);
    } else {
      text = "呜……对不起。";
      setMoodOverride("sad", 3000);
    }
  }

  // 管教音效
  if(action === "星光教鞭" || action === "毛绒手套") sfxHit();
  else sfxDiscipline();
  showBubbleFor("discipline", text);
  addClickEffect(W/2, H/2 - 20, "#C7B8FF");

  // 暗影值100触发结局
  if(petState.shadow >= 100){
    triggerShadowEnding();
  }

  initDisciplinePage();
  recordMemory("管教", action);
  // 三层后果：被打后第二天会冷淡（延迟反应）
  if(action === "星光教鞭" || action === "毛绒手套" || action === "禁闭"){
    addDelayedReaction("被打后冷淡", 1000 * 60 * 60 * 12, { action: action });
    if(petState.fateFlags) petState.fateFlags.连续被打次数 = (petState.fateFlags.连续被打次数 || 0) + 1;
  }
  saveState();
}

function triggerShadowEnding(){
  const isAngel = Math.random() < 0.5;

  if(isAngel){
    petState.soul = clamp((petState.soul||0) + 50, -100, 100);
    petState.shadow = 60;
    showModal({
      title:"✨ 天使化",
      text:"它的身体泛起柔和的白光。\n它还记得你所有的好。",
      actions:[{ label:"继续", type:"primary", onClick:()=>{
        petState.mood = "happy";
        recordMemory("天使化");
        showBubbleFor("home", "……我还在。");
      }}]
    });
  } else {
    petState.soul = clamp((petState.soul||0) - 60, -100, 100);
    petState.shadow = 85;
    showModal({
      title:"🌑 恶魔化",
      text:"暗影将它包裹。\n它不再是它了。\n但它还在。",
      actions:[{ label:"继续", type:"danger", onClick:()=>{
        petState.mood = "angry";
        petState.traits.脾气 = clamp(petState.traits.脾气 + 30, 0, 100);
        petState.traits.记仇 = clamp(petState.traits.记仇 + 30, 0, 100);
        petState.traits.粘人 = clamp(petState.traits.粘人 - 30, 0, 100);
        recordMemory("恶魔化");
        showBubbleFor("home", "……哼。");
      }}]
    });
  }
  saveState();
}

function resetPet(){
  // ★ 每次宠物结束（天使化/恶魔化/重置）都算完成一次周目
  incrementPlaythroughCount();

  petState.shadow = 0;
  petState.discipline = { 服从值:0, 恐惧值:0, 记仇值:0, 黑化值:0, 天使值:50, count:0, lastTime:0, darkMode:false, opCounts:{} };
  petState.hiddenStates = { 假顺从:false, 伺机报复:false, 抑郁:false, 绝食:false, 报复倒计时:0, 最后报复时间:0 };
  petState.runaway = { isAway:false, awayTime:0, location:"", canCatch:true, isDeadOutside:false, lastInteraction:Date.now() };
  petState.partner = null;
  petState.children = [];
  petState.state = { 饱腹:80, 清洁:70, 体力:90, 心情:85, 亲密度:60, 信任度:70 };
  petState.generation = (petState.generation || 1) + 1;
  petState.attributes = null; // 清空属性，下次重建
  petState.tutorial = null;
  petState.diaryUnlocked = false;
  petState._interactCount = 0;
  saveState();

  switchPage("home");

function drawDisciplineScene(c, t){
  const bx = W/2, by = H/2 - 20;
  c.save();
  // 星星丝带
  c.strokeStyle = "rgba(199,184,255,0.6)";
  c.lineWidth = 5;
  c.setLineDash([10,10]);
  c.lineDashOffset = -t * 0.03;
  c.beginPath();
  c.ellipse(bx, by, 130, 160, 0, 0, TAU);
  c.stroke();
  c.setLineDash([]);

  // 糖果结界
  const pulse = 0.5 + 0.5*Math.sin(t*0.004);
  c.strokeStyle = "rgba(255,233,168,"+(0.3+0.3*pulse)+")";
  c.lineWidth = 4;
  c.beginPath();
  c.arc(bx, by, 180 + pulse*6, 0, TAU);
  c.stroke();

  // 暗影值
  const shadowA = petState.shadow / 100;
  if(shadowA > 0.2){
    const g = c.createRadialGradient(bx, by, 40, bx, by, 200);
    g.addColorStop(0, "rgba(123,79,168,"+(shadowA*0.5)+")");
    g.addColorStop(1, "rgba(61,31,92,0)");
    c.fillStyle = g;
    c.beginPath();
    c.arc(bx, by, 200, 0, TAU);
    c.fill();
  }

  // 状态
  c.fillStyle = "rgba(255,233,168,0.9)";
  c.font = "13px \"PingFang SC\", sans-serif";
  c.textAlign = "center";
  c.textBaseline = "top";
  c.fillText("暗影值 " + Math.round(petState.shadow) + " · " + getShadowStage(petState.shadow), bx, 24);
  c.fillText("服从 " + Math.round(petState.discipline.服从值) + " · 恐惧 " + Math.round(petState.discipline.恐惧值), bx, 44);
  if(petState.shadow > 60){
    c.fillStyle = "rgba(255,150,180,0.9)";
    c.fillText("⚠️ 可以选择救赎", bx, 64);
  }

  // 道具跟随鼠标
  if(disciplineState.mode && disciplineState.mouseX !== undefined && disciplineState.mouseY !== undefined){
    c.save();
    c.font = "36px sans-serif";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(DISCIPLINE_ICONS[disciplineState.mode] || "✋", disciplineState.mouseX, disciplineState.mouseY);
    c.restore();
  }
  c.restore();
}

/* 暗影管教场景绘制 */
function drawDarkScene(c, t){
  const bx = W/2, by = H*0.45;
  const d = petState.discipline;
  c.save();

  // 暗紫背景渐变（简化版，移除复杂的糖果结界大圆圈）
  const bg = c.createRadialGradient(bx, by, 50, bx, by, Math.max(W,H)*0.7);
  bg.addColorStop(0, "rgba(61,31,92,0.2)");
  bg.addColorStop(1, "rgba(26,10,46,0.85)");
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  // ★ 简化版结界：只有一圈淡淡的虚线，不旋转、不发光、不装饰
  c.save();
  c.translate(bx, by);
  c.strokeStyle = "rgba(200,170,230,0.25)";
  c.lineWidth = 2;
  c.setLineDash([8, 6]);
  c.beginPath();
  c.arc(0, 0, bodyRadius()*1.6, 0, TAU);
  c.stroke();
  c.setLineDash([]);
  c.restore();

  // 暗影光晕（随着黑化值上升而加深）
  const darkA = d.黑化值 / 100;
  if(darkA > 0.1){
    const dg = c.createRadialGradient(bx, by, bodyRadius()*0.3, bx, by, bodyRadius()*2);
    dg.addColorStop(0, "rgba(123,79,168,"+(darkA*0.4)+")");
    dg.addColorStop(1, "rgba(61,31,92,0)");
    c.fillStyle = dg;
    c.beginPath();
    c.arc(bx, by, bodyRadius()*2, 0, TAU);
    c.fill();
  }

  // 天使光晕（天使值高时）
  const angelA = d.天使值 / 100;
  if(angelA > 0.5){
    const ag = c.createRadialGradient(bx, by, bodyRadius()*0.3, bx, by, bodyRadius()*2);
    ag.addColorStop(0, "rgba(255,245,224,"+(angelA*0.3)+")");
    ag.addColorStop(1, "rgba(255,233,168,0)");
    c.fillStyle = ag;
    c.beginPath();
    c.arc(bx, by, bodyRadius()*2, 0, TAU);
    c.fill();
  }

  // 恐惧值高时的屏幕边缘暗角
  if(d.恐惧值 > 50){
    const vg = c.createRadialGradient(bx, by, bodyRadius(), bx, by, Math.max(W,H)*0.6);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,"+(d.恐惧值/200)+")");
    c.fillStyle = vg;
    c.fillRect(0, 0, W, H);
  }

  c.restore();
}

function renderDiaryPage(){
  const el = document.getElementById("diaryContent");
  if(!el) return;

  if(!petState.diaryUnlocked){
    el.innerHTML = '<div style="text-align:center;color:rgba(150,130,180,0.7);padding:60px 20px;font-size:14px;">' +
      '它还没有开始写日记。<br>或许等它长大一些……</div>';
    return;
  }

  const diary = (petState.attributes && petState.attributes.diary) || [];
  if(diary.length === 0){
    el.innerHTML = '<div style="text-align:center;color:rgba(150,130,180,0.7);padding:60px 20px;font-size:14px;">' +
      '今天还没有写。<br>明天再来看看吧。</div>';
    return;
  }

  let html = "";
  // 倒序显示，最新在上
  for(let i = diary.length - 1; i >= 0; i--){
    const d = diary[i];
    const readMark = d.read ? "" : '<span style="color:#FF6B8A;font-size:11px;margin-left:6px;">●未读</span>';
    html += '<div class="diary-entry" data-idx="'+i+'" style="' +
      'background:rgba(255,255,255,0.85);padding:14px;border-radius:12px;border:1px solid rgba(255,180,220,0.4);' +
      'margin-bottom:10px;cursor:pointer;' +
      'transition:all 0.15s;">' +
      '<div style="color:#B080D0;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;">' +
      '<span>📅 '+d.date+'</span>'+readMark+'</div>' +
      '<div style="color:rgba(90,74,122,0.8);font-size:12px;max-height:60px;overflow:hidden;">' +
      d.text.replace(/\n/g,"<br>")+'</div></div>';
  }
  el.innerHTML = html;

  el.querySelectorAll(".diary-entry").forEach(node=>{
    node.addEventListener("click", ()=>{
      const idx = parseInt(node.dataset.idx);
      const d = diary[idx];
      // 偷看机制：30% 概率被发现
      const caught = Math.random() < 0.3 && !d.read;
      d.read = true;
      showModal({
        title:"📖 " + d.date,
        text: d.text.replace(/\n/g,"\n"),
        actions: caught ? [
          { label:"……被发现了？", type:"danger", onClick:()=>{
            petState.state.信任度 = clamp(petState.state.信任度 - 20, 0, 100);
            petState.state.亲密度 = clamp(petState.state.亲密度 - 10, 0, 100);
            petState.shadow = clamp(petState.shadow + 5, 0, 100);
            setTimeout(()=>{
              switchPage("home");
              showBubbleFor("home", "……你偷看我的日记。");
            }, 400);
          }}
        ] : [
          { label:"合上日记本", type:"primary", onClick:()=>{} }
        ]
      });
      saveState();
      renderDiaryPage();
    });
  });
}

        }},

          petState.state.信任度 = clamp(petState.state.信任度 - 10, 0, 100);
          petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + 10, 0, 100);
          showBubbleFor("home","呜……对不起。");

        }},

          petState.state.信任度 = clamp(petState.state.信任度 - 20, 0, 100);
          petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + 20, 0, 100);
          petState.traits.记仇 = clamp(petState.traits.记仇 + 15, 0, 100);
          petState.shadow = clamp(petState.shadow + 5, 0, 100);
          showBubbleFor("home","……");

function nextDay(){
  const s = petState.state;
  // 数值衰减
  s.饱腹 = clamp(s.饱腹 - 10, 0, 100);
  s.清洁 = clamp(s.清洁 - 8, 0, 100);
  s.体力 = clamp(s.体力 + 30, 0, 100);
  s.心情 = clamp(s.心情 - 5, 0, 100);

  // 随机事件
  let eventText = "新的一天开始了。";
  if(Math.random() < 0.3){
    const r = Math.random();
    if(r < 0.25){
      s.心情 = clamp(s.心情 - 10, 0, 100);
      s.亲密度 = clamp(s.亲密度 + 5, 0, 100);
      eventText = "它做噩梦了……抱着你才安心。";
    } else if(r < 0.5){
      bedroomState.petOnPlayerBed = true;
      eventText = "它梦游到你床上了……";
    } else if(r < 0.75){
      s.清洁 = clamp(s.清洁 - 20, 0, 100);
      eventText = "它尿床了……要清理。";
    } else {
      eventText = "平安夜，一切安好。";
    }
  }

  // 检查饥饿状态描述
  if(s.饱腹 < 30) eventText += " 它看起来有点饿。";
  if(s.心情 < 30) eventText += " 它心情不太好。";

  // 伤痕慢慢痊愈（每天消退一条，60% 概率）
  if(Array.isArray(petState.marks) && petState.marks.length && Math.random() < 0.6){
    petState.marks.shift();
  }

  saveState();
  showBubbleFor("home", eventText, 5000);

  // 随机宠物跑到床上
  if(!bedroomState.petOnPlayerBed && Math.random() < 0.15){
    if(petState.state.亲密度 > 60 || petState.state.心情 < 30 || petState.traits.好奇 > 70){
      bedroomState.petOnPlayerBed = true;
    }
  }

  // 成年宠物做职业行为
  if(petState.stage === "成年"){
    setTimeout(()=>doCareerAction(), 2500);
  }
  // 生成今天的日记
  if(petState.diaryUnlocked){
    generateDiaryEntry();
  }
}

/* ═══════════════════════════════════════════════════════
   26. 交互绑定
   ═══════════════════════════════════════════════════════ */
function getPos(e, canvas){
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

let activePointerCanvas = null;

function bindCanvasEvents(canvas, pageKey){
  canvas.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    activePointerCanvas = canvas;

    if(panelOpen()){
      hideModal();
      return;
    }

    const p = getPos(e, canvas);

    // 洗澡页特殊处理
    if(pageKey === "bath"){
      handleBathPointerDown(p, canvas);
      return;
    }

    // 玩耍页：先判定玩具
    if(pageKey === "play"){
      if(handlePlayPointerDown(p, canvas)) return;
    }

    // 管教页：道具模式 → 点击宠物执行管教
    if(pageKey === "discipline" && disciplineState.mode){
      // 注意：宠物绘制后位置会被还原，这里按画布实际尺寸重算宠物中央
      const parent = canvas.parentElement;
      const cw = (parent && parent.clientWidth) || W;
      const ch = (parent && parent.clientHeight) || H;
      const cx = cw/2, cy = ch/2 - 20;
      const br = Math.min(cw,ch) * 0.12 * ((BODY_TYPES[petState.bodyType]?.bodyR || 42) / 42);
      const d = Math.hypot(p.x - cx, p.y - cy);
      if(d < br*1.9){
        doDiscipline(disciplineState.mode);
        addClickEffect(p.x, p.y, "#FF6B8A");
      } else {
        showBubbleFor("discipline", "要打在它身上才有效哦……");
      }
      return;
    }

    // 点击粑粑 → 直接清理（不进入拖拽）
    if(pageKey === "home"){
      const poops = petState.poops || [];
      for(let i = poops.length-1; i >= 0; i--){
        const pp = poops[i];
        if(Math.hypot(p.x - pp.x, p.y - pp.y) < 22){
          poops.splice(i, 1);
          petState.state.清洁 = clamp(petState.state.清洁 + 8, 0, 100);
          addClickEffect(pp.x, pp.y, "#8B5A2B");
          showBubbleFor("home", pick(["（清理掉了）","嗯，干净了。","下次不要随地拉了哦。"]));
          saveState();
          activePointerCanvas = null;
          return;
        }
      }
    }

    const bodyR = bodyRadius();
    // 命中范围放宽：宠物在走动时也能轻松摸到
    const d = Math.hypot(p.x - pet.x, p.y - pet.y - bodyR*0.2);
    if(d < bodyR*2.1){
      dragging = true;
      dragMoved = false;
      dragStart = { x:p.x, y:p.y };
      dragOffset = { x:p.x-pet.x, y:p.y-pet.y };
      dragTrail = [];
      lastDragPos = { x:p.x, y:p.y };
      lastDragTime = performance.now();
      try { canvas.setPointerCapture(e.pointerId); } catch(err){}

      // ★ 被抱起时的反应（使用新语录库+高优先级）
      const s = petState.state;
      const dragLines = DRAG_LINES[petState.mask]?.normal || ["嘿嘿~","好高呀~","（蹭蹭）"];
      const dragLine = pickUniqueLine(dragLines);
      if(s.亲密度 > 60){
        // 亲密度高：享受
        triggerBodyReaction("blushing", 2000, 0.6);
        triggerBodyReaction("tongue_out", 1500, 0.5);
        showBubbleFor(currentPage, dragLine, null, "high");
        setMoodOverride("happy", 2000);
      } else if(s.亲密度 > 30){
        // 中等：有点紧张
        triggerBodyReaction("trembling", 1500, 0.4);
        showBubbleFor(currentPage, dragLine, null, "high");
      } else {
        // 亲密度低：挣扎、害怕
        triggerBodyReaction("trembling", 2000, 0.7);
        triggerBodyReaction("crying_whimper", 1500, 0.5);
        const struggleLines = DRAG_LINES[petState.mask]?.struggle || ["放开我！","不要碰我！","救命啊！"];
        showBubbleFor(currentPage, pickUniqueLine(struggleLines), null, "high");
        setMoodOverride("fear", 2000);
      }
    }
  });

  canvas.addEventListener("pointermove", (e)=>{
    if(activePointerCanvas !== canvas) return;
    const p = getPos(e, canvas);

    if(pageKey === "bath"){
      handleBathPointerMove(p, canvas);
      return;
    }

    // 玩耍页：拖动玩具
    if(pageKey === "play"){
      if(handlePlayPointerMove(p, canvas)) return;
    }

    // 管教页：记录鼠标位置（道具跟随）
    if(pageKey === "discipline"){
      disciplineState.mouseX = p.x;
      disciplineState.mouseY = p.y;
    }

    if(!dragging) return;
    e.preventDefault();

    if(!dragMoved){
      if(Math.hypot(p.x-dragStart.x, p.y-dragStart.y) > 6) dragMoved = true;
    }
    if(!dragMoved) return;

    pet.x = p.x - dragOffset.x;
    pet.y = p.y - dragOffset.y;

    dragTrail.push({ x:pet.x, y:pet.y, life:1 });
    if(dragTrail.length > 12) dragTrail.shift();

    currentZone = checkDropZone(p.x, p.y);

    const now = performance.now();
    const dt = now - lastDragTime;
    if(dt > 0){
      const speed = Math.hypot(p.x-lastDragPos.x, p.y-lastDragPos.y) / (dt/16);
      if(speed > 26){
        setMoodOverride("fear", 800);
        // ★ 快速甩动：恐惧、哭泣、头晕
        if(Math.random() < 0.1){
          triggerBodyReaction("crying_whimper", 800, 0.6);
          triggerBodyReaction("dizzy", 1000, 0.5);
          triggerBodyReaction("trembling", 800, 0.7);
        }
        // ★ 晃动时的对话回应（低概率，避免太频繁）
        if(Math.random() < 0.04){
          const shakeLines = DRAG_LINES[petState.mask]?.shake || ["头好晕……","别晃了！","要吐了……"];
          showBubbleFor(pageKey, pickUniqueLine(shakeLines), null, "high");
        }
      }
      else if(speed > 14){
        setMoodOverride("angry", 500);
        // ★ 中速甩动：生气、挣扎
        if(Math.random() < 0.08){
          triggerBodyReaction("trembling", 600, 0.5);
          triggerBodyReaction("head_shake", 400, 0.7);
        }
        // ★ 中速晃动时的对话回应（更低概率）
        if(Math.random() < 0.02){
          const struggleLines = DRAG_LINES[petState.mask]?.struggle || ["慢点啦！","你干嘛！","放我下来！"];
          showBubbleFor(pageKey, pickUniqueLine(struggleLines), null, "high");
        }
      }
    }
    lastDragPos = { x:p.x, y:p.y };
    lastDragTime = now;
  });

  canvas.addEventListener("pointerup", (e)=>{
    if(activePointerCanvas !== canvas) return;
    const p = getPos(e, canvas);

    if(pageKey === "bath"){
      handleBathPointerUp(p, canvas);
      return;
    }

    // 玩耍页：释放玩具
    if(pageKey === "play"){
      if(handlePlayPointerUp(p, canvas)) return;
    }

    if(!dragging) return;
    dragging = false;

    if(dragMoved){
      // ★ 甩动检测：根据最后阶段的拖动速度判断
      let throwSpeed = 0;
      if(lastDragPos && lastDragTime){
        const dt = Math.max(1, Date.now() - lastDragTime);
        throwSpeed = Math.hypot(p.x - lastDragPos.x, p.y - lastDragPos.y) / dt * 1000;
      }
      const isThrow = throwSpeed > 800; // 超过800px/秒算甩动

      const zone = checkDropZone(p.x, p.y);
      if(zone) handleDropZone(zone);
      else {
        if(isThrow){
          // 甩动：恐惧 + 受伤
          petState.state.体力 = clamp(petState.state.体力 - 8, 0, 100);
          petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + 8, 0, 100);
          petState.discipline.记仇值 = clamp(petState.discipline.记仇值 + 3, 0, 100);
          setMoodOverride("fear", 4000);
          const shakeLines = DRAG_LINES[petState.mask]?.shake || ["呜呜……好晕！","你、你甩我！","好痛……"];
          showBubbleFor(pageKey, pickUniqueLine(shakeLines), null, "high");
          recordMemory("甩动", "速度:" + Math.round(throwSpeed));
          sfxHit();
          // 甩动后宠物弹开
          pet.x = W/2 + (Math.random()-0.5)*100;
          pet.y = H*0.62;
        } else {
          // 被放下后的反应：根据拖拽距离决定情绪
          const dragDist = Math.hypot(p.x - dragStart.x, p.y - dragStart.y);
          if(dragDist > 150){
            // 拖得很远 → 害怕/生气
            if(petState.traits.胆量 > 50) setMoodOverride("angry", 3000);
            else setMoodOverride("fear", 3000);
            showBubbleFor(pageKey, pick(["……你把我甩来甩去的！","放我下来！","呜呜……好晕……","你干嘛啦！"]));
          } else {
            setMoodOverride("happy", 2000);
            showBubbleFor(pageKey, pick(["……你把我放下了？","干嘛突然放下我……","嗯？不抱了？","（晃了晃脑袋）"]));
          }
        }
      }
      currentZone = null;
      dragTrail = [];
    } else {
      const part = checkPart(dragStart.x, dragStart.y);
      if(part) handlePartClick(part, dragStart.x, dragStart.y);
      else {
        // 点中宠物但没点中具体部位 → 也给回应（增强反馈）
        petState._interactCount = (petState._interactCount || 0) + 1;
        addClickEffect(dragStart.x, dragStart.y, "#FFE9A8");
        clickBounceUntil = performance.now() + 800;
        const d2 = Math.hypot(dragStart.x - pet.x, dragStart.y - pet.y - bodyRadius()*0.2);
        if(d2 < bodyRadius()*2.0){
          const s = petState.state;
          s.心情 = clamp(s.心情+2, 0, 100);
          s.亲密度 = clamp(s.亲密度+0.5, 0, 100);
          setMoodOverride("happy", 2500);
          // 播放抚摸音效
          try { sfxPetHead(); } catch(e){}
          // 身体反应：轻微抖动+脸红
          triggerBodyReaction("blushing", 1200, 0.4);
          triggerBodyReaction("trembling", 600, 0.2);
          showBubbleFor(pageKey, pick(TOUCH_LINES), null, "high");
          recordMemory("抚摸", "身体");
        }
      }
    }
    activePointerCanvas = null;
  });

  // 点击检测（床）
  canvas.addEventListener("click", (e)=>{
    if(pageKey !== "home") return;
    const p = getPos(e, canvas);
    const zones = sceneLayout();
    const bz = zones.playerBed;
    if(p.x > bz.x - bz.w/2 && p.x < bz.x + bz.w/2 &&
       p.y > bz.y - bz.h/2 && p.y < bz.y + bz.h/2){
      clickPlayerBed();
    }
  });
}

function handleDropZone(zone){
  petState._interactCount = (petState._interactCount || 0) + 1;
  const s = petState.state;

  switch(zone){
    case "petMat":
      s.体力 = clamp(s.体力 + 8, 0, 100);
      s.心情 = clamp(s.心情 + 4, 0, 100);
      showBubbleFor("home","垫子好舒服……");
      setMoodOverride("happy", 1500);
      break;
    case "playerBed":
      s.体力 = clamp(s.体力 + 12, 0, 100);
      showBubbleFor("home","唔…好软…");
      setMoodOverride("sleepy", 2500);
      bedroomState.petOnPlayerBed = true;
      break;
    case "food":
      s.饱腹 = clamp(s.饱腹 + 18, 0, 100);
      s.心情 = clamp(s.心情 + 3, 0, 100);
      showBubbleFor("home","开饭啦！");
      setMoodOverride("happy", 1500);
      break;
    case "cage":
      s.信任度 = clamp(s.信任度 - 5, 0, 100);
      s.心情 = clamp(s.心情 - 10, 0, 100);
      showBubbleFor("home","放我出去……");
      setMoodOverride("sad", 2000);
      break;
  }
}

function handleBathPointerDown(p, canvas){
  if(bathState.mode === "toilet"){
    // 允许拖拽宠物
    const d = Math.hypot(p.x - pet.x, p.y - pet.y - bodyRadius()*0.2);
    if(d < bodyRadius() * 1.6){
      toiletState.dragging = true;
      dragStart = { x: p.x, y: p.y };
      dragOffset = { x: p.x - pet.x, y: p.y - pet.y };
    }
    return;
  }
  // 用 canvas 实际尺寸，避免全局 W/H 是其他页面的值
  const parent = canvas.parentElement;
  const cw = (parent && parent.clientWidth) || W;
  const ch = (parent && parent.clientHeight) || H;
  const sx = cw * bathState.showerX;
  const sy = ch * bathState.showerY;
  const tx = cw * bathState.towelX;
  const ty = ch * bathState.towelY;

  // 增大点击区域到半径70，更容易点中（匹配放大后的花洒位置）
  if(Math.hypot(p.x - (sx+35), p.y - (sy+55)) < 70){
    bathState.draggingShower = true;
    return;
  }
  if(Math.hypot(p.x - tx, p.y - ty) < 70){
    bathState.draggingTowel = true;
    return;
  }

  // 点击吹风机
  if(bathState.step === 6 && p.x > cw-100 && p.x < cw-20 && p.y > ch-180 && p.y < ch-100){
    bathState.blowActive = true;
    return;
  }

  // 洗澡页中点击宠物身体（搓洗）
  if(bathState.step === 3){
    const part = checkPart(p.x, p.y);
    if(part && (part === "head" || part === "belly" || part === "leftArm" || part === "rightArm" || part === "tail")){
      const partKey = part === "belly" ? "body" : part;
      if(!bathState.washedParts[partKey]){
        bathState.washedParts[partKey] = true;
        bathState.washProgress += 20;
        if(bathState.washProgress >= 100){
          bathState.washProgress = 100;
          bathState.step = 4;
          renderBathControls();
        } else {
          const fill = document.getElementById("washFill");
          if(fill) fill.style.width = bathState.washProgress + "%";
        }
        addClickEffect(p.x, p.y, "#BFF7E8");
      }
    }
  }
}

function handleBathPointerMove(p, canvas){
  if(bathState.mode === "toilet" && toiletState.dragging){
    pet.x = p.x - dragOffset.x;
    pet.y = p.y - dragOffset.y;
    // 判断是否在尿垫上
    const d = Math.hypot(pet.x - toiletState.spotX, pet.y - toiletState.spotY);
    toiletState.petOverSpot = d < 100;
    return;
  }
  // 用 canvas 实际尺寸
  const parent = canvas.parentElement;
  const cw = (parent && parent.clientWidth) || W;
  const ch = (parent && parent.clientHeight) || H;
  if(bathState.draggingShower){
    bathState.showerX = p.x / cw;
    bathState.showerY = p.y / ch;
    const bx = cw/2, by = ch*0.6;
    if(Math.abs(p.x - bx) < 150 && Math.abs(p.y - by + 50) < 120){
      bathState.showerOnPet = true;
    } else {
      bathState.showerOnPet = false;
    }
  }
  if(bathState.draggingTowel){
    bathState.towelX = p.x / cw;
    bathState.towelY = p.y / ch;
    const bx = cw/2, by = ch*0.6;
    if(Math.abs(p.x - bx) < 150 && Math.abs(p.y - by + 50) < 120){
      bathState.towelOnPet = true;
    } else {
      bathState.towelOnPet = false;
    }
  }
}

function handleBathPointerUp(p, canvas){
  if(bathState.mode === "toilet" && toiletState.dragging){
    toiletState.dragging = false;
    if(toiletState.petOverSpot){
      toiletState.progress += 34;
      if(toiletState.progress >= 100){
        toiletState.progress = 100;
        // 学会上厕所
        if(petState.tutorial){
          petState.tutorial.toiletCount += 1;
          if(petState.tutorial.toiletCount >= 3){
            petState.tutorial.learnedToilet = true;
            petState.state.亲密度 = clamp(petState.state.亲密度 + 10, 0, 100);
            petState.state.心情 = clamp(petState.state.心情 + 10, 0, 100);
            showBubbleFor("bath", pick(["我会用尿垫了！","嘿嘿，我厉害吧？","以后不会随地大小便了~","终于学会了！"]));
            recordMemory("学会上厕所");
          } else {
            showBubbleFor("bath", pick(["嗯……在这里？","好像有点感觉了","下次我自己来试试","这样对吗？"]));
          }
        }
        setTimeout(()=>{
          bathState.mode = null;
          initBathPage();
        }, 1500);
      } else {
        const fill = document.getElementById("toiletFill");
        if(fill) fill.style.width = toiletState.progress + "%";
        showBubbleFor("bath", pick(["唔……","快了快了","再等一下","好害羞……"]));
      }
    } else {
      // 没放到尿垫上
      showBubbleFor("bath", pick(["不是这里啦！","尿垫在那边！","你放错地方了啦！","我要尿在地上了……"]));
    }
    // 宠物自己回家
    pet.x = pet.homeX;
    pet.y = pet.homeY;
    return;
  }
  bathState.draggingShower = false;
  bathState.draggingTowel = false;
  bathState.showerOnPet = false;
  bathState.towelOnPet = false;
}

/* ═══════════════════════════════════════════════════════

function updateTimers(dt){
  Object.keys(timers).forEach(k=>{
    if(timers[k] > 0) timers[k] = Math.max(0, timers[k] - dt);
  });
}

function updateDragTrail(dt){
  for(let i=dragTrail.length-1;i>=0;i--){
    dragTrail[i].life -= dt/400;
    if(dragTrail[i].life <= 0) dragTrail.splice(i,1);
  }
}

function drawDragTrail(c){
  if(!dragging || dragTrail.length === 0) return;
  const bodyR = bodyRadius();
  c.save();
  for(let i=0;i<dragTrail.length;i++){
    const g = dragTrail[i];
    const a = (i/dragTrail.length) * 0.22 * g.life;
    if(a <= 0.01) continue;
    c.globalAlpha = a;
    c.fillStyle = "#C7B8FF";
    c.beginPath();
    c.arc(g.x, g.y, bodyR*0.92, 0, TAU);
    c.fill();
  }
  c.restore();
  c.globalAlpha = 1;
}

function renderPage(pageKey, t, dt){
  const c = ctxs[pageKey];
  const canvasEl = canvases[pageKey];
  if(!c || !canvasEl) return;
  const parent = canvasEl.parentElement;
  if(!parent) return;

  const cW = parent.clientWidth;
  const cH = parent.clientHeight;

  // ★ 关键修复：如果 canvas 尺寸为 0，强制重设
  if(canvasEl.width === 0 || canvasEl.height === 0 || Math.abs(canvasEl.width/DPR - cW) > 2 || Math.abs(canvasEl.height/DPR - cH) > 2){
    if(cW > 0 && cH > 0){
      canvasEl.width = Math.floor(cW * DPR);
      canvasEl.height = Math.floor(cH * DPR);
      canvasEl.style.width = cW + "px";
      canvasEl.style.height = cH + "px";
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      if(stars[pageKey]) initStarsFor(pageKey);
      if(clouds[pageKey]) initCloudsFor(pageKey);
      if(bgParticles[pageKey]) initParticlesFor(pageKey);
    } else {
      return; // 父容器还没布局好，跳过这一帧
    }
  }

  const oldW = W, oldH = H;
  W = cW; H = cH;
  pet.homeX = W/2;
  // 厕所模式下宠物站得低一点（靠近尿垫），且拖拽时不被拉回
  const isToiletPage = pageKey === "bath" && bathState.mode === "toilet";
  pet.homeY = isToiletPage ? H*0.62 : H*0.55;
  // 首页自主行走时（walk/rest/back）不要拉回原位
  const autoBusy = pageKey === "home" && petState.auto && (petState.auto.mode === "walk" || petState.auto.mode === "rest" || petState.auto.mode === "back");

  // ★ 玩耍页：宠物追逐被拖动的玩具
  if(pageKey === "play" && playState.toys){
    let draggedToy = null;
    for(const toy of playState.toys){
      if(toy.dragging){ draggedToy = toy; break; }
    }
    if(draggedToy && !dragging){
      const tx = draggedToy.x * W;
      const ty = draggedToy.y * H;
      const dist = Math.hypot(tx - pet.x, ty - pet.y);
      const br = bodyRadius();
      if(dist > br * 1.2){
        // 追着玩具跑，速度比平时快
        const speed = 0.08;
        pet.x += (tx - pet.x) * speed;
        pet.y += (ty - pet.y) * speed;
        // 追逐时心情慢慢增加
        if(!playState.lastChaseTime || Date.now() - playState.lastChaseTime > 2000){
          petState.state.心情 = clamp(petState.state.心情 + 1, 0, 100);
          petState.state.体力 = clamp(petState.state.体力 - 0.5, 0, 100);
          playState.lastChaseTime = Date.now();
        }
      } else {
        // 追上玩具了
        if(!playState.caughtToy || playState.caughtToy !== draggedToy.id){
          playState.caughtToy = draggedToy.id;
          petState.state.心情 = clamp(petState.state.心情 + 5, 0, 100);
          petState.state.亲密度 = clamp(petState.state.亲密度 + 2, 0, 100);
          showBubbleFor("play", pick(["抓到啦！","嘿嘿！","这个好玩！","再来！"]));
          setMoodOverride("happy", 1500);
          addClickEffect(pet.x, pet.y - br, "#FFE9A8");
        }
      }
    } else {
      // 没有玩具被拖动时，重置捕获状态
      playState.caughtToy = null;
    }
  }

  if(!dragging && !autoBusy && !(isToiletPage && toiletState.dragging) && !(pageKey === "play" && playState.toys && playState.toys.some(t=>t.dragging))){
    // 慢慢飘回目标位置（不再强制拉回中央）
    const targetX = petState._targetX !== undefined ? petState._targetX : pet.homeX;
    const targetY = petState._targetY !== undefined ? petState._targetY : pet.homeY;
    pet.x += (targetX - pet.x) * 0.05;
    pet.y += (targetY - pet.y) * 0.05;
    if(Math.abs(pet.x - targetX) < 3 && Math.abs(pet.y - targetY) < 3){
      petState._targetX = undefined;
      petState._targetY = undefined;
    }
  }

  // ★ 玩耍页：宠物自由活动（没有目标时自己走动）
  if(pageKey === "play" && !dragging && petState._targetX === undefined && !playState.fetchingToy){
    if(!playState.lastWanderTime || Date.now() - playState.lastWanderTime > 4000){
      const br = bodyRadius();
      petState._targetX = br + Math.random() * (W - br*2);
      petState._targetY = br*1.5 + Math.random() * (H*0.5 - br);
      playState.lastWanderTime = Date.now();
      if(Math.random() < 0.3){
        showBubbleFor("play", pick(["四处逛逛~","这里看看","嗯？","..."]));
      }
    }
  }

  // ★ 玩耍页：捡玩具回来
  if(pageKey === "play" && playState.fetchingToy){
    const toy = playState.toys.find(t=>t.id === playState.fetchingToy);
    if(toy){
      const br = bodyRadius();
      const dist = Math.hypot(toy.x*W - pet.x, toy.y*H - pet.y);
      if(playState.fetchState === "going" && dist < br*1.5){
        // 到达玩具位置 → 叼起来往回走
        playState.fetchState = "returning";
        petState._targetX = W/2 + rand(-50, 50);
        petState._targetY = H*0.5 + rand(-30, 30);
        showBubbleFor("play", pick(["捡到啦！","给你~","嘿嘿"]));
      }
      if(playState.fetchState === "returning"){
        // 玩具跟着宠物移动
        toy.x += ((pet.x / W) - toy.x) * 0.1;
        toy.y += (((pet.y - br*0.8) / H) - toy.y) * 0.1;
        // 到达目标位置 → 放下玩具
        if(petState._targetX === undefined){
          playState.fetchingToy = null;
          playState.fetchState = null;
          petState.state.心情 = clamp(petState.state.心情 + 6, 0, 100);
          petState.state.亲密度 = clamp(petState.state.亲密度 + 3, 0, 100);
          petState.state.体力 = clamp(petState.state.体力 - 5, 0, 100);
          saveState();
        }
      }
    } else {
      playState.fetchingToy = null;
    }
  }

  c.clearRect(0,0,W,H);

  // ★ 上帝视角背景：米白色木地板 + 斑点图案地毯
  drawFloorBackground(c, W, H);

  // ★ 昼夜系统：根据真实时间叠加天色和星星
  drawDayNightOverlay(c, W, H);

  // ★ 天气系统
  drawWeather(c, W, H, t);

  if(pageKey === "home"){
    const zones = sceneLayout();
    // ★ 用 AI 道具图替换手绘家具（加载失败时回退到手绘）
    const bedDrawn = drawItem(c, "bed", zones.playerBed.x, zones.playerBed.y, zones.playerBed.w, zones.playerBed.h);
    if(!bedDrawn) drawPlayerBed(zones.playerBed,c,t);
    const matDrawn = drawItem(c, "mat", zones.petMat.x, zones.petMat.y, zones.petMat.w, zones.petMat.h);
    if(!matDrawn) drawPetMat(zones.petMat,c,t);
    const foodDrawn = drawItem(c, "foodbowl", zones.food.x, zones.food.y, zones.food.w, zones.food.h);
    if(!foodDrawn) drawFoodBowl(zones.food,c);
    drawWaterBowl(zones.water, c, t);
    const cageDrawn = drawItem(c, "cage", zones.cage.x, zones.cage.y, zones.cage.w, zones.cage.h);
    if(!cageDrawn) drawCage(zones.cage,c);
    drawPoops(c, t);  // 粑粑画在宠物后面
    if(currentZone) highlightZoneFor(currentZone,c);
    drawDragTrail(c);
    drawPet(c,t);
    drawStateIcons(c,t);
    drawClickEffects(c);
    updateStatusBar();
  } else if(pageKey === "feed"){
    const foodDrawn = drawItem(c, "foodbowl", W*0.5, H*0.85, 120, 70);
    if(!foodDrawn) drawFoodBowl({x:W*0.5,y:H*0.85,w:90,h:50},c);
    drawPet(c,t);
    drawStateIcons(c,t);
    drawClickEffects(c);
  } else if(pageKey === "play"){
    drawPlayScene(c,t);
    drawPet(c,t);
    drawStateIcons(c,t);
  } else if(pageKey === "bath"){
    if(bathState.mode === "toilet"){
      // 厕所模式：用 AI 尿垫图替换手绘
      const padDrawn = drawItem(c, "toiletpad", W/2, H*0.72, 200, 100);
      if(!padDrawn) drawToiletScene(c, t);
      drawPet(c, t);
      drawStateIcons(c, t);
    } else {
      // 洗澡模式：用 AI 浴缸图替换手绘
      const tubDrawn = drawItem(c, "bathtub", W/2, H*0.58, W*0.85, H*0.5);
      if(!tubDrawn) drawBathScene(c, t);
      drawPetInBath(c, t);
    }
  } else if(pageKey === "cage"){
    // 笼子页：用 AI 笼子图替换手绘
    const cageDrawn = drawItem(c, "cage", W/2, H*0.5, W*0.6, H*0.5);
    if(!cageDrawn) drawCageScene(c,t);
    drawPetInCage(c,t);
  } else if(pageKey === "discipline"){
    drawDisciplineScene(c,t);
    // 宠物固定在中央
    const oldX = pet.x, oldY = pet.y;
    pet.x = W/2; pet.y = H/2 - 20;
    drawPet(c,t);
    pet.x = oldX; pet.y = oldY;
  } else if(pageKey === "dark"){
    drawDarkScene(c,t);
    // 宠物固定在中央
    const oldX = pet.x, oldY = pet.y;
    pet.x = W/2; pet.y = H*0.45;
    drawPet(c,t);
    pet.x = oldX; pet.y = oldY;
  } else if(pageKey === "dress"){
    // 装扮页：米白背景 + 宠物固定中央
    c.fillStyle = "#FFF8F0";
    c.fillRect(0,0,W,H);
    // 画一个简单的地台
    c.fillStyle = "rgba(255,200,220,0.2)";
    c.beginPath();
    c.ellipse(W/2, H*0.65, W*0.3, 20, 0, 0, TAU);
    c.fill();
    // 宠物固定在中央偏上
    const oldX = pet.x, oldY = pet.y;
    pet.x = W/2; pet.y = H*0.45;
    drawPet(c,t);
    pet.x = oldX; pet.y = oldY;
  }

  W = oldW; H = oldH;
  pet.homeX = W/2;
  pet.homeY = H*0.55;
}

function highlightZoneFor(key,c){
  const zones = sceneLayout();
  const z = zones[key];
  if(!z) return;
  const pulse = 0.5 + 0.5*Math.sin(performance.now()*0.008);
  c.save();
  c.strokeStyle = "rgba(255,233,168,"+(0.35+0.55*pulse)+")";
  c.lineWidth = 3;
  c.setLineDash([6,6]);
  roundRectPath(c,z.x-z.w/2,z.y-z.h/2,z.w,z.h,12);
  c.stroke();
  c.restore();
}

function loop(now){
  requestAnimationFrame(loop);
  try {
  const t = now - startTime;
  let dt = now - lastFrameTime;
  if(dt > 100) dt = 100;
  if(dt < 0) dt = 0;
  lastFrameTime = now;

  // 新增：开场阶段独立处理
  if(opening.active){
    openingUpdate(now, dt);
    return; // 不渲染主游戏
  }

  // ★ 死亡检查：宠物已死亡时不执行正常逻辑
  if(petState.isDead){
    return;
  }

  updateTimers(dt);
  updateDragTrail(dt);
  updateState(dt);
  updateWeather();  // 天气系统
  if(!dragging) updateIdleAction(now);
  updateAutoAct(now);
  petState.mood = currentMood(now);

  // 幼年期随地大小便判定（每 60 秒游戏时间触发一次）
  if(!petState.tutorial || !petState.tutorial.learnedToilet){
    if(!petState._lastToiletCheck) petState._lastToiletCheck = now;
    if(now - petState._lastToiletCheck > 60000 && petState.stage === "幼年"){
      petState._lastToiletCheck = now;
      if(Math.random() < 0.3){
        petState.state.清洁 = clamp(petState.state.清洁 - 20, 0, 100);
        addPoop();  // 在旁边生成一坨粑粑
        if(currentPage === "home" && !panelOpen()){
          showBubbleFor("home", "……（它在地上拉了一坨）");
          setTimeout(()=>{
            showChoice({
              title:"它随地大小便了",
              text:"地上有一坨粑粑，要怎么处理？",
              options:[
                { label:"教训它", type:"danger", effect:()=>{
                  petState.state.信任度 = clamp(petState.state.信任度 - 10, 0, 100);
                  petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + 10, 0, 100);
                  petState.discipline.lastTime = Date.now();
                  // 留泪痕
                  if(!Array.isArray(petState.marks)) petState.marks = [];
                  petState.marks.push({ type:"泪痕", since:Date.now() });
                  if(petState.marks.length > 5) petState.marks.shift();
                  // 表情变害怕/难过
                  if(petState.traits.胆量 > 60) setMoodOverride("angry", 3500);
                  else setMoodOverride("fear", 3500);
                  showBubbleFor("home", pick(["呜呜……对不起！","我、我不是故意的……","下次不敢了！","（缩成一团）"]));
                  if(petState.tutorial) petState.tutorial.noBiteCount += 1;
                  saveState();
                }},
                { label:"耐心教它去尿垫", type:"primary", effect:()=>{
                  petState.state.亲密度 = clamp(petState.state.亲密度 + 5, 0, 100);
                  setMoodOverride("happy", 2500);
                  showBubbleFor("home", pick(["嗯……我记住了。","下次我会去尿垫的！","（认真点头）"]));
                  if(petState.tutorial) petState.tutorial.toiletCount += 1;
                  if(petState.tutorial && petState.tutorial.toiletCount >= 3){
                    petState.tutorial.learnedToilet = true;
                    setTimeout(()=>showBubbleFor("home", "我会用尿垫了！"), 1500);
                  }
                  saveState();
                }},
                { label:"先清理掉", effect:()=>{
                  clearPoops();
                  petState.state.清洁 = clamp(petState.state.清洁 + 10, 0, 100);
                  setMoodOverride("default", 1500);
                  showBubbleFor("home", "……（你清理了粑粑）");
                  saveState();
                }}
              ]
            });
          }, 1500);
        }
      }
    }
  }

  // 成长过渡动画更新
  updateGrowthTransition(now, dt);

  // 成年阶段检查（每帧判定一次，条件达成只触发一次）
  checkAdultStage();

  // AI 灵魂层：宠物自主思考
  petSoulTick();

  // 宠物主动行为检测（指针停留走过来、冒想法气泡）
  checkPetAutoBehavior();

  // 洗澡页进度
  if(currentPage === "bath" && bathState.step > 1 && bathState.step < 7){
    updateBathProgress(dt);
  }

  renderPage(currentPage, t, dt);

  // ★ 成长过渡遮罩效果
  if(growthTransition.active && currentPage === "home"){
    const c = ctxs["home"];
    if(c){
      const alpha = getGrowthTransitionOverlayAlpha();
      if(alpha > 0){
        c.save();
        c.fillStyle = `rgba(255, 240, 200, ${alpha})`;
        c.fillRect(0, 0, W, H);
        c.restore();
      }
      // 成长闪光粒子
      if(growthTransition.phase === 2){
        c.save();
        for(let i=0;i<20;i++){
          const a = (i/20)*TAU + t*0.005;
          const r = 50 + Math.sin(t*0.01 + i)*30;
          const px = pet.x + Math.cos(a)*r;
          const py = pet.y + Math.sin(a)*r;
          c.fillStyle = `rgba(255, 233, 168, ${0.5 + 0.3*Math.sin(t*0.01+i)})`;
          c.beginPath();
          c.arc(px, py, 3 + Math.sin(t*0.02+i)*2, 0, TAU);
          c.fill();
        }
        c.restore();
      }
    }
  }
  } catch(e){
    console.warn("loop frame error", e);
  }
}

let openingCanvas = null;
let openingCtx = null;

function initOpeningCanvas(){
  openingCanvas = document.getElementById("openingCanvas");
  if(!openingCanvas) return;
  openingCtx = openingCanvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  openingCanvas.width = Math.floor(w*dpr);
  openingCanvas.height = Math.floor(h*dpr);
  openingCanvas.style.width = w+"px";
  openingCanvas.style.height = h+"px";
  openingCtx.setTransform(dpr,0,0,dpr,0,0);
  opening.egg.x = w/2;
  opening.egg.y = h*0.55;
  opening.egg.r = Math.min(w,h)*0.09;
}

function openingShowText(text, duration, callback){
  const el = document.getElementById("openingText");
  if(!el){ if(callback) callback(); return; }
  el.textContent = "";
  el.classList.add("show");
  let i = 0;
  const timer = setInterval(()=>{
    i++;
    el.textContent = text.slice(0,i);
    if(i >= text.length){
      clearInterval(timer);
      setTimeout(()=>{
        el.classList.remove("show");
        setTimeout(()=>{
          if(callback) callback();
        }, 600);
      }, duration || 2000);
    }
  }, 120);
}

function openingShowHint(text){
  const el = document.getElementById("openingHint");
  if(!el) return;
  el.textContent = text;
  el.classList.add("show");
}
function openingHideHint(){
  const el = document.getElementById("openingHint");
  if(el) el.classList.remove("show");
}

function startOpening(){
  initOpeningCanvas();
  opening.active = true;
  opening.phase = 0;
  opening.startTime = performance.now();
  opening.phaseStart = performance.now();

  // 初始宠物数据先随机生成（起名会重新设置 traits，这里先给个底）
  // ★ 无存档首次进入 / 无有效 mask 时强制随机——避免每次领蛋都是同一只
  const noSave = !localStorage.getItem(STORAGE_KEY);
  if(noSave || !petState.mask || !ALL_MASKS.includes(petState.mask)){
    petState.mask = pick(ALL_MASKS);
  }
  if(noSave || !petState.bodyType || !ALL_BODY_TYPES.includes(petState.bodyType)){
    petState.bodyType = pick(ALL_BODY_TYPES);
  }
  petState.selfCall = MASK_SELF_CALL[petState.mask];
  petState.traits = {
    脾气:randInt(20,80), 粘人:randInt(20,90),
    胆量:randInt(20,80), 好奇:randInt(30,90), 记仇:randInt(10,70)
  };

  // 第一段：欢迎
  openingShowText("你来了。", 2000, ()=>{
    openingShowText("……等你好久了。", 2000, ()=>{
      opening.phase = 2;
      opening.phaseStart = performance.now();
      openingShowHint("点击它。");
      opening.waitingClick = true;
    });
  });
}

function openingUpdate(now, dt){
  const c = openingCtx;
  if(!c || !openingCanvas) return;
  const w = openingCanvas.clientWidth;
  const h = openingCanvas.clientHeight;
  const t = now - opening.startTime;

  // 清屏
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#1a1035");
  g.addColorStop(0.45,"#3b2a6b");
  g.addColorStop(1,"#6a5acd");
  c.fillStyle = g;
  c.fillRect(0,0,w,h);

  // 星尘飘落（用开场独立粒子）
  if(opening.particles.length < 60){
    for(let i=opening.particles.length;i<60;i++){
      opening.particles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:rand(0.6,2.4),
        vy:rand(0.15,0.5),
        vx:rand(-0.1,0.1),
        alpha:rand(0.3,0.9),
        color:pick(["#FFE9A8","#FFD6E8","#BFF7E8","#C7B8FF","#FFFFFF"]),
        phase:Math.random()*TAU
      });
    }
  }
  for(const p of opening.particles){
    p.x += p.vx;
    p.y += p.vy;
    if(p.y > h+10){ p.y = -10; p.x = Math.random()*w; }
    const pulse = 0.6+0.4*Math.sin(t*0.03+p.phase);
    c.globalAlpha = p.alpha*pulse;
    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x,p.y,p.r,0,TAU);
    c.fill();
  }
  c.globalAlpha = 1;

  // 蛋阶段
  if(opening.phase >= 2){
    const egg = opening.egg;
    // 蛋出现动画（phase 2 开始）
    if(opening.phase === 2 && egg.scale < 1){
      egg.scale = Math.min(1, egg.scale + dt*0.0015);
    }

    if(egg.scale > 0.01){
      const r = egg.r * egg.scale;
      const pulse = 1 + Math.sin(t*0.003)*0.06;

      // 光晕
      const glow = c.createRadialGradient(egg.x, egg.y, r*0.3, egg.x, egg.y, r*3*pulse);
      glow.addColorStop(0,"rgba(255,233,168,0.45)");
      glow.addColorStop(0.5,"rgba(255,214,232,0.18)");
      glow.addColorStop(1,"rgba(255,233,168,0)");
      c.fillStyle = glow;
      c.beginPath();
      c.arc(egg.x, egg.y, r*3*pulse, 0, TAU);
      c.fill();

      // 蛋身
      const eggGrad = c.createRadialGradient(egg.x-r*0.3, egg.y-r*0.4, r*0.1, egg.x, egg.y, r*1.1);
      eggGrad.addColorStop(0,"#FFFFFF");
      eggGrad.addColorStop(0.4,"#FFD6E8");
      eggGrad.addColorStop(1,"#C7B8FF");
      c.fillStyle = eggGrad;
      c.beginPath();
      c.ellipse(egg.x, egg.y, r, r*1.3, 0, 0, TAU);
      c.fill();

      // 星星斑点
      for(let i=0;i<8;i++){
        const a = (i/8)*TAU + t*0.0005;
        const sr = r * 0.7;
        const sx = egg.x + Math.cos(a)*sr*0.8;
        const sy = egg.y + Math.sin(a)*sr*1.0;
        drawStarShape(c, sx, sy, r*0.08, "rgba(255,233,168,0.7)");
      }

      // 裂纹（孵化中）
      if(egg.cracking){
        const prog = egg.crackProgress;
        c.strokeStyle = "rgba(255,233,168,0.9)";
        c.lineWidth = 3;
        c.lineCap = "round";
        const crackLines = [
          [[0,-0.9],[-0.2,-0.4],[0.1,0]],
          [[0.1,0],[0.3,0.3],[0.2,0.7]],
          [[-0.2,-0.4],[-0.4,0.1],[-0.3,0.5]]
        ];
        for(const line of crackLines){
          c.beginPath();
          for(let i=0;i<line.length;i++){
            const px = egg.x + line[i][0]*r;
            const py = egg.y + line[i][1]*r;
            if(i === 0) c.moveTo(px,py);
            else c.lineTo(px,py);
          }
          c.stroke();
        }

        // 发光裂纹
        c.strokeStyle = "rgba(255,214,232,"+prog+")";
        c.lineWidth = 6;
        c.globalAlpha = prog*0.6;
        c.stroke();
        c.globalAlpha = 1;
      }
    }

    // 点击检测（孵化前）
    if(opening.waitingClick && egg.scale >= 0.9){
      openingShowHint("点击它。");
    }
  }

  // 孵化中：粒子爆发
  if(opening.phase === 3){
    // 白光闪烁
    if(opening.flash > 0){
      c.fillStyle = "rgba(255,255,255,"+opening.flash+")";
      c.fillRect(0,0,w,h);
      opening.flash -= dt*0.003;
      if(opening.flash < 0) opening.flash = 0;
    }
  }

  // 起名后：宠物雏形展示
  if(opening.phase >= 4 && opening.phase < 8){
    // 在背景上画一个小宠物（使用 drawPet 但需要重新设置 W,H）
    // 由于 drawPet 依赖全局 pet 和 W/H，这里临时切换
    const oldW = W, oldH = H;
    const oldPX = pet.x, oldPY = pet.y;
    W = w; H = h;
    pet.x = w/2;
    pet.y = h*0.55;
    // 呼吸缩放（小宠物）
    c.save();
    c.translate(w/2, h*0.55);
    const smallScale = 0.55 + Math.min(0.15, (opening.petBirthEffect||0)*0.05);
    c.scale(smallScale, smallScale);
    c.translate(-w/2, -h*0.55);
    drawPet(c, t);
    c.restore();
    W = oldW; H = oldH;
    pet.x = oldPX; pet.y = oldPY;
  }

  // 屏幕闪白
  if(opening.flash > 0){
    c.fillStyle = "rgba(255,255,255,"+opening.flash+")";
    c.fillRect(0,0,w,h);
  }
}

function openingHandleClick(x, y){
  if(!opening.active) return;

  // 阶段2：点击蛋
  if(opening.phase === 2 && opening.waitingClick){
    const egg = opening.egg;
    const dx = x - egg.x;
    const dy = y - egg.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < egg.r * 1.6){
      opening.waitingClick = false;
      openingHideHint();
      opening.phase = 3;
      egg.cracking = true;
      egg.crackProgress = 0;

      // 震动 + 裂纹动画
      const crackAnim = setInterval(()=>{
        egg.crackProgress += 0.1;
        if(egg.crackProgress >= 1){
          clearInterval(crackAnim);
          // 孵化完成
          egg.hatched = true;
          opening.flash = 1;
          // 生成爆发粒子
          for(let i=0;i<40;i++){
            opening.particles.push({
              x: egg.x,
              y: egg.y,
              r: rand(1,4),
              vy: rand(-3,-1),
              vx: rand(-2,2),
              alpha: 1,
              color: pick(["#FFE9A8","#FFD6E8","#C7B8FF","#FFFFFF"]),
              phase: Math.random()*TAU
            });
          }

          setTimeout(()=>{
            opening.phase = 4;
            opening.phaseStart = performance.now();
            openingShowNameForm();
          }, 800);
        }
      }, 60);
    }
  }
}

      btn.innerHTML = '<span style="font-size:16px;">' + MASK_EMOJI[m] + '</span> ' + MASK_HINTS[m];

function openingConfirmName(name){
  opening.petName = name;
  const accept = judgeNameAccept(name);
  opening.nameAccepted = accept;

  petState.attributes = petState.attributes || generatePetAttributes();
  // 名字总是记录，但宠物是否使用取决于接受
  petState.attributes.givenName = name;
  petState.name = name; // ★ 修复：同时设置petState.name

  if(accept === true){
    petState.selfCall = name;
  } else {
    petState.selfCall = MASK_SELF_CALL[petState.mask];
  }

  // 显示反馈
  const form = document.getElementById("openingForm");
  const qEl = document.getElementById("openingQuestion");
  const inputEl = document.getElementById("openingInput");
  const nextBtn = document.getElementById("openingNextBtn");

  inputEl.style.display = "none";
  nextBtn.classList.remove("hidden");

  let feedback = "";
  if(accept === true){
    feedback = "它记住了这个名字。\n它靠过来蹭了蹭你。";
  } else if(accept === null){
    feedback = "它歪了歪头，勉强接受了。";
  } else {
    feedback = "它扭过头，不太喜欢这个名字。\n它继续用自己的称呼。";
  }
  qEl.textContent = feedback;

  nextBtn.onclick = ()=>{
    opening.phase = 5;
    openingShowGenderForm();
  };
}

function openingFinish(){
  const form = document.getElementById("openingForm");
  const qEl = document.getElementById("openingQuestion");
  const inputEl = document.getElementById("openingInput");
  const nextBtn = document.getElementById("openingNextBtn");

  inputEl.style.display = "none";
  qEl.textContent = "它诞生了。\n从今天起，你要照顾它。";
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = "进入";

  nextBtn.onclick = ()=>{
    // 完成开场
    opening.active = false;
    form.classList.remove("show");
    form.classList.add("hidden");

    // 初始化宠物属性
    petState.attributes = petState.attributes || generatePetAttributes();
    // ★ 修复：用户起的名字存到 petState.name，自称保持由面具决定
    petState.name = opening.petName || null;
    petState.attributes.givenName = opening.petName || null;
    petState.tutorial = petState.tutorial || {
      day:0, learnedName:false, learnedEat:false, learnedToilet:false,
      learnedSleep:false, learnedBath:false, learnedNoBite:false, learnedSpeak:false,
      nameCallCount:0, eatCount:0, toiletCount:0, sleepCount:0,
      bathCount:0, noBiteCount:0, speakCount:0
    };

    // 保存玩家档案
    try {
      localStorage.setItem("stardust_player_profile", JSON.stringify(playerProfile));
    } catch(e){}

    saveState();

    // 切换到主页面
    switchPage("home");

    // ★ 重新启动BGM和音效（开场时停止了）
    setTimeout(()=>{
      try { startBgm(); } catch(e){}
      // 恢复音效音量
      if(audioCtx && sfxGain){
        try { sfxGain.gain.setTargetAtTime((settings.sfxVolume || 0.7) * 0.35, audioCtx.currentTime, 0.2); } catch(e){}
      }
    }, 500);

    // 出生后的问候
    setTimeout(()=>{
      showBubbleFor("home", "……" + (opening.petCallPlayer || "你"), 3000);
    }, 800);
  };
}

/* ═══════════════════════════════════════════════════════
   29. 启动
   ═══════════════════════════════════════════════════════ */
function boot(){
  try { preloadPetImages(); } catch(e){ console.warn("preloadPetImages error", e); }
  try { preloadItems(); } catch(e){ console.warn("preloadItems error", e); }
  try { initAudio(); } catch(e){ console.warn("initAudio error", e); }
  try { initPageCanvases(); } catch(e){ console.warn("initPageCanvases error", e); }
  try { initStatusBar(); } catch(e){ console.warn("initStatusBar error", e); }
  try { initHomeButtons(); } catch(e){ console.warn("initHomeButtons error", e); }

  // 气泡元素
  try {
    Object.keys(bubbles).forEach(k=>{
      bubbles[k].el = document.getElementById(k+"Bubble");
    });
  } catch(e){ console.warn("bubbles init error", e); }

  try { resizeAll(); } catch(e){ console.warn("resizeAll error", e); }

  // 读取玩家档案
  try {
    const savedProfile = localStorage.getItem("stardust_player_profile");
    if(savedProfile){
      playerProfile = JSON.parse(savedProfile);
    }
  } catch(e){}

  // 判断是否首次进入（无存档 → 播放开场）
  let hasSave = false;
  try { hasSave = !!localStorage.getItem(STORAGE_KEY); } catch(e){ hasSave = false; }

  try {
    if(!hasSave){
      // 首次进入：播放开场
      switchPage("opening");
      // 延迟一帧确保页面已激活
      setTimeout(()=>{
        try { startOpening(); } catch(e){ console.warn("startOpening error", e); }
      }, 100);
    } else {
      // 已有存档：直接进入主页面
      opening.active = false;
      let loaded = false;
      try { loaded = loadState(); } catch(e){ console.warn("loadState error", e); loaded = false; }
      if(!loaded) { try { initNewPet(); } catch(e){ console.warn("initNewPet error", e); } }
      petInit = true;
      pet.x = pet.homeX;
      pet.y = pet.homeY;
      try { saveState(); } catch(e){ console.warn("saveState error", e); }

      setTimeout(()=>{
        try {
          if(loaded && loaded.offline){
            const h = loaded.offline.toFixed(1);
            showBubbleFor("home", "你走了 " + h + " 小时……我等了好久。", 4000);
          } else {
            const hour = new Date().getHours();
            let timeGreet = "";
            if(hour >= 6 && hour < 11){
              timeGreet = pick(["早安~","你醒啦？","早上好！","（伸懒腰）……早安"]);
            } else if(hour >= 11 && hour < 14){
              timeGreet = pick(["中午好~","吃饭了吗？","好晒呀~"]);
            } else if(hour >= 14 && hour < 18){
              timeGreet = pick(["下午好~","有点困了……","你在干嘛呀？"]);
            } else if(hour >= 18 && hour < 22){
              timeGreet = pick(["晚上好~","天黑了呢","今天过得怎么样？"]);
            } else {
              timeGreet = pick(["这么晚还没睡？","我都困了……","晚安……还不睡吗？","（打哈欠）……好晚了"]);
            }
            const greet = {
              "公主病":"哼，本公主勉强住下吧。","本大人":"本大人准许你照顾我。",
              "小可爱":"你好呀～小可爱来啦！","病娇":"你终于来了……我一直在等。",
              "傲娇":"才、才不是想见你呢。","冷淡":"……嗯。",
              "疯批":"哈哈！这里归老子了！","学者":"在下开始记录了。",
              "戏精":"本宫，终于等到这一刻！","憨憨":"嘿嘿，你好呀。"
            };
            const finalGreet = timeGreet + " " + (greet[petState.mask] || "");
            showBubbleFor("home", finalGreet, 4000);
          }
        } catch(e){ console.warn("greet error", e); }
      }, 800);
    }
  } catch(e){
    console.warn("boot main flow error", e);
    // 出错时强制进入开场
    opening.active = true;
    opening.phase = 2;
    opening.waitingClick = true;
    try { switchPage("opening"); } catch(e2){}
    setTimeout(()=>{ try { initOpeningCanvas(); } catch(e2){} }, 50);
  }

  // 绑定事件
  Object.keys(canvases).forEach(k=>{
    if(canvases[k]) bindCanvasEvents(canvases[k], k);
  });

  // 开场 Canvas 点击
  const opCanvas = document.getElementById("openingCanvas");
  if(opCanvas){
    opCanvas.addEventListener("pointerdown", (e)=>{
      if(!opening.active) return;
      const rect = opCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      openingHandleClick(x, y);
    });
  }

  // 聊天输入
  const chatInput = document.getElementById("homeChatInput");
  if(chatInput){
    chatInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){
        const v = chatInput.value.trim();
        if(v){ sendMessage(v, "home"); chatInput.value = ""; }
        e.preventDefault();
      }
    });
  }

  window.addEventListener("resize", ()=>{
    resizeAll();
    if(opening.active) initOpeningCanvas();
  });

  setInterval(saveState, 10000);
  window.addEventListener("beforeunload", ()=>{
    // 记录离开时间和本次游戏时长
    if(petState.scheduleMemory){
      const now = Date.now();
      petState.scheduleMemory.lastLogout = now;
      petState.scheduleMemory.logoutTimes.push(now);
      if(petState.scheduleMemory.logoutTimes.length > 10) petState.scheduleMemory.logoutTimes.shift();
      const sessionDuration = now - (petState.scheduleMemory.sessionStart || now);
      petState.scheduleMemory.totalPlayTime += sessionDuration;
    }
    saveState();
  });

  try {
    requestAnimationFrame((n)=>{
      startTime = n;
      lastFrameTime = n;
      requestAnimationFrame(loop);
    });
  } catch(e){
    console.warn("loop start error", e);
  }
}

boot();

</script>
