function drawCage(z, c){
  const x = z.x, y = z.y, w = z.w, h = z.h;
  c.save();
  c.fillStyle = "#C7B8FF";
  roundRectPath(c, x-w/2, y+h*0.42, w, 14, 7); c.fill();
  roundRectPath(c, x-w/2, y-h*0.50, w, 14, 7); c.fill();
  c.strokeStyle = "#FFB6D9"; c.lineWidth = 6; c.lineCap = "round";
  for(let i=0;i<5;i++){
    const bx = x - w*0.4 + i * (w*0.8/4);
    c.beginPath(); c.moveTo(bx, y-h*0.45); c.lineTo(bx, y+h*0.42); c.stroke();
  }
  drawStarShape(c, x, y-h*0.62, 10, "#FFE9A8");
  drawStarShape(c, x-w*0.30, y-h*0.62, 7, "#FFE9A8");
  drawStarShape(c, x+w*0.30, y-h*0.62, 7, "#FFE9A8");
  c.restore();
}

function drawPlayerBed(z, c, t){
  const x = z.x, y = z.y;
  const w = z.w, h = z.h;
  c.save();
  // 床架
  c.fillStyle = "#A8D8FF";
  roundRectPath(c, x-w/2, y-h/2, w, h, 16); c.fill();
  // 床垫
  c.fillStyle = "#FFFFFF";
  roundRectPath(c, x-w/2+8, y-h/2+10, w-16, h-20, 12); c.fill();
  // 枕头
  c.fillStyle = "#FFD6E8";
  roundRectPath(c, x-w/2+16, y-h/2+18, w*0.35, h*0.35, 12); c.fill();
  // 被子
  c.fillStyle = "#C7B8FF";
  roundRectPath(c, x-w/2+w*0.42, y-h/2+10, w*0.5, h-20, 12); c.fill();
  // 星星
  drawStarShape(c, x+w/2-30, y-h/2+25, 6, "#FFE9A8");
  drawStarShape(c, x-w/2+30, y+h/2-25, 5, "#FFE9A8");
  // 标签
  c.fillStyle = "rgba(255,233,168,0.95)";
  c.font = "bold 13px \"PingFang SC\", sans-serif";
  c.textAlign = "center";
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.005);
  c.globalAlpha = 0.7 + 0.3 * pulse;
  c.fillText("🛏️ 睡觉 / 下一天", x, y + h/2 + 22);
  c.globalAlpha = 1;
  c.restore();
}

function drawPetMat(z, c, t){
  const x = z.x, y = z.y;
  c.save();
  c.fillStyle = "#C7B8FF";
  c.beginPath(); c.ellipse(x, y, 85, 38, 0, 0, TAU); c.fill();
  c.fillStyle = "#FFD6E8";
  c.beginPath(); c.ellipse(x, y-10, 78, 32, 0, 0, TAU); c.fill();
  c.fillStyle = "#FFF0F5";
  c.beginPath(); c.ellipse(x, y-6, 66, 24, 0, 0, TAU); c.fill();
  for(let i=0;i<5;i++){
    const angle = (i/5) * TAU;
    const sx = x + Math.cos(angle) * 72;
    const sy = y - 10 + Math.sin(angle) * 28;
    drawStarShape(c, sx, sy, 4, "#FFE9A8");
  }
  c.restore();
}

function drawWaterBowl(z, c, t){

  const x = z.x, y = z.y;
  c.save();
  c.fillStyle = "#A8D8FF";

  c.beginPath(); c.ellipse(x, y-5, 30, 10, 0, 0, TAU); c.fill();

/* ═══════════════════════════════════════════════════════
   14. 状态图标
   ═══════════════════════════════════════════════════════ */
function drawStateIcons(c,t){
  const bodyR = bodyRadius();
  const cx = pet.x, cy = pet.y;
  const s = petState.state, mood = petState.mood;
  c.save();
  if(s.饱腹<30){
    const a = 0.5+0.5*Math.sin(t*0.1);
    c.globalAlpha = a;
    c.fillStyle = "#FFB86B";
    c.beginPath(); c.ellipse(cx+bodyR*1.1,cy+bodyR*0.65,16,11,-0.2,0,TAU); c.fill();
    c.fillStyle = "#FFD9A8";
    c.beginPath(); c.ellipse(cx+bodyR*1.1,cy+bodyR*0.60,13,8,-0.2,0,TAU); c.fill();
    c.globalAlpha = 1;
  }
  if(s.清洁<30){
    c.fillStyle = "rgba(150,150,150,0.4)";
    c.beginPath();
    c.arc(cx-bodyR*1.1,cy-bodyR*0.35,10,0,TAU);
    c.arc(cx-bodyR*1.28,cy-bodyR*0.18,8,0,TAU);
    c.arc(cx-bodyR*0.92,cy-bodyR*0.10,7,0,TAU);
    c.fill();
  }
  if(s.饱腹<20 || s.清洁<20 || mood==="sick"){
    const tx = cx+bodyR*1.35, ty = cy-bodyR*0.9;
    // 放大温度计
    c.fillStyle = "#FFFFFF";
    roundRectPath(c,tx-6,ty-24,12,36,5); c.fill();
    c.fillStyle = "#FF6B8A";
    roundRectPath(c,tx-4,ty-10,8,22,3); c.fill();
    c.beginPath(); c.arc(tx,ty+16,9,0,TAU); c.fill();
    // 温度计刻度
    c.fillStyle = "rgba(255,255,255,0.6)";
    c.fillRect(tx-3, ty-18, 6, 2);
    c.fillRect(tx-3, ty-12, 6, 2);
  }
  if(mood==="fear"){
    c.fillStyle = "rgba(199,184,255,0.5)";
    c.beginPath();
    c.ellipse(cx-bodyR*1.3,cy+bodyR*0.55,22,12,0.3,0,TAU);
    c.fill();
  }
  if(mood==="sleepy"){
    c.fillStyle = "rgba(255,233,168,0.85)";
    c.font = "bold "+Math.round(bodyR*0.45)+"px sans-serif";
    c.textAlign = "center"; c.textBaseline = "middle";
    const zb = Math.sin(t*0.05)*4;
    c.fillText("Z", cx+bodyR*1.0, cy-bodyR*1.2+zb);
    c.font = "bold "+Math.round(bodyR*0.32)+"px sans-serif";
    c.fillText("z", cx+bodyR*1.4, cy-bodyR*1.5+zb);
  }
  c.restore(); c.globalAlpha = 1;
}

/* ═══════════════════════════════════════════════════════
   15. 点击特效
   ═══════════════════════════════════════════════════════ */
function addClickEffect(x,y,color){
  clickEffects.push({ x, y, r:5, maxR:40, alpha:1, color });
}
function drawClickEffects(c){
  c.save();
  for(let i=clickEffects.length-1;i>=0;i--){
    const e = clickEffects[i];
    e.r += (e.maxR-e.r)*0.18;
    e.alpha -= 0.05;
    if(e.alpha<=0){ clickEffects.splice(i,1); continue; }
    c.globalAlpha = e.alpha;
    c.strokeStyle = e.color; c.lineWidth = 2.5;
    c.beginPath(); c.arc(e.x,e.y,e.r,0,TAU); c.stroke();
    c.globalAlpha = e.alpha*0.5;
    c.beginPath(); c.arc(e.x,e.y,e.r*0.6,0,TAU); c.stroke();
  }
  c.restore(); c.globalAlpha = 1;
}

/* ═══════════════════════════════════════════════════════
   16. 交互检测
   ═══════════════════════════════════════════════════════ */
function checkPart(x,y){
  const bodyR = bodyRadius();
  const headR = headRadius();
  const px = pet.x, py = pet.y;
  const headCX = px, headCY = py-bodyR*0.8;
  const noseCX = px, noseCY = py-bodyR*0.65;  // 鼻子位置
  const leftEarCX = px-bodyR*0.4, leftEarCY = py-bodyR*1.1;
  const rightEarCX = px+bodyR*0.4, rightEarCY = py-bodyR*1.1;
  const leftEyeCX = px-headR*0.35, leftEyeCY = py-bodyR*0.8;
  const rightEyeCX = px+headR*0.35, rightEyeCY = py-bodyR*0.8;
  const leftArmCX = px-bodyR*0.9, leftArmCY = py+bodyR*0.1;
  const rightArmCX = px+bodyR*0.9, rightArmCY = py+bodyR*0.1;
  const leftLegCX = px-bodyR*0.4, leftLegCY = py+bodyR*0.9;
  const rightLegCX = px+bodyR*0.4, rightLegCY = py+bodyR*0.9;
  const tailEndX = px+bodyR*1.5, tailEndY = py+bodyR*0.5;

  if(Math.hypot(x-leftEarCX,y-leftEarCY)<bodyR*0.3) return "leftEar";
  if(Math.hypot(x-rightEarCX,y-rightEarCY)<bodyR*0.3) return "rightEar";
  if(Math.hypot(x-leftEyeCX,y-leftEyeCY)<headR*0.25) return "leftEye";
  if(Math.hypot(x-rightEyeCX,y-rightEyeCY)<headR*0.25) return "rightEye";
  if(Math.hypot(x-noseCX,y-noseCY)<headR*0.2) return "nose";  // 鼻子优先于头部
  if(Math.hypot(x-tailEndX,y-tailEndY)<bodyR*0.3) return "tail";
  if(Math.hypot(x-leftArmCX,y-leftArmCY)<bodyR*0.28) return "leftArm";
  if(Math.hypot(x-rightArmCX,y-rightArmCY)<bodyR*0.28) return "rightArm";
  if(Math.hypot(x-leftLegCX,y-leftLegCY)<bodyR*0.28) return "leftLeg";
  if(Math.hypot(x-rightLegCX,y-rightLegCY)<bodyR*0.28) return "rightLeg";
  if(Math.hypot(x-headCX,y-headCY)<headR) return "head";
  if(Math.hypot(x-px,y-py)<bodyR*0.7) return "belly";
  return null;
}

        showBubbleFor(pk, maskLine || pick(["嘿嘿，痒痒的~","手手给你摸。","（伸出手掌）"]), null, "high");
      }
      break;
    case "leftLeg": case "rightLeg":
      addClickEffect(x,y,"#C7B8FF");
      setMoodOverride("angry",500);
      if(clickType === "rapid"){
        const maskLine = getMaskTouchReaction(petState.mask, "leg", "rapid");
        showBubbleFor(pk, maskLine || pick(["别踢腿！","说了别闹！","（蹬了你一脚）"]), null, "high");
      } else {
        const maskLine = getMaskTouchReaction(petState.mask, "leg", "normal");
        showBubbleFor(pk, maskLine || pick(["腿腿！别闹！","哼！","（踢了踢腿）"]), null, "high");
      }
      break;
  }
}

function checkDropZone(x,y){
  const zones = sceneLayout();
  const keys = Object.keys(zones);
  for(const k of keys){
    const z = zones[k];
    if(x>z.x-z.w/2 && x<z.x+z.w/2 && y>z.y-z.h/2 && y<z.y+z.h/2){
      return k;
    }
  }
  return null;
}

function showModal(opts){
  const mask = document.getElementById("modalMask");
  const card = document.getElementById("modalCard");
  let html = "";
  if(opts.title) html += '<div class="modal-title">'+opts.title+'</div>';
  if(opts.text) html += '<div class="modal-text">'+opts.text.replace(/\n/g,'<br>')+'</div>';
  if(opts.html) html += opts.html;
  // ★ 支持输入框
  if(opts.input){
    html += '<input type="text" id="modalInput" placeholder="'+(opts.inputPlaceholder||'')+'" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,180,220,0.5);background:rgba(255,255,255,0.9);font-size:14px;box-sizing:border-box;margin:10px 0;">';
  }
  if(opts.actions && opts.actions.length){
    html += '<div class="modal-actions">';
    opts.actions.forEach((a,i)=>{
      const cls = "modal-btn "+(a.type||"");
      html += '<button class="'+cls+'" data-idx="'+i+'">'+a.label+'</button>';
    });
    html += '</div>';
  }
  card.innerHTML = html;
  mask.classList.add("show");

  // 自动聚焦输入框
  if(opts.input){
    setTimeout(()=>{
      const inp = document.getElementById("modalInput");
      if(inp) inp.focus();
    }, 100);
  }

  if(opts.actions){
    card.querySelectorAll(".modal-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = parseInt(btn.dataset.idx);
        const a = opts.actions[idx];
        if(a.onClick){
          // 如果有输入框，把值传给onClick
          const inp = document.getElementById("modalInput");
          const val = inp ? inp.value.trim() : null;
          a.onClick(val);
        }
        if(a.keepOpen !== true) hideModal();
      });
    });
  }
}
function hideModal(){
  document.getElementById("modalMask").classList.remove("show");
}

function showChoice(opts){
  // opts: { title, text, options: [{label, value, effect}] , onPick }
  const mask = document.getElementById("modalMask");
  const card = document.getElementById("modalCard");

  let html = '<div class="modal-title">' + (opts.title || "选择") + '</div>';
  if(opts.text) html += '<div class="modal-text">' + opts.text + '</div>';
  html += '<div class="modal-actions" style="flex-direction:column;">';
  opts.options.forEach((o, i)=>{
    const cls = "modal-btn " + (o.type || "");
    html += '<button class="' + cls + '" data-idx="' + i + '" style="flex:none;width:100%;">' + o.label + '</button>';
  });
  html += '</div>';
  card.innerHTML = html;
  mask.classList.add("show");

  card.querySelectorAll(".modal-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      const o = opts.options[idx];
      hideModal();
      if(o.effect) o.effect();
      if(opts.onPick) opts.onPick(o);
    });
  });
}

let draggingFood = null;
let foodDragStart = null;

function renderFoodGrid(){
  const grid = document.getElementById("foodGrid");
  if(!grid) return;
  grid.innerHTML = "";
  FOODS.forEach(f => {
    const card = document.createElement("div");
    card.className = "food-card";
    card.innerHTML =
      '<div class="food-ico" style="background:'+f.color+'">'+f.emoji+'</div>' +
      '<div class="food-name">'+f.name+'</div>' +
      '<div class="food-desc">'+f.desc+'</div>';
    // 支持鼠标和触摸拖拽，也支持直接点击喂食
    card.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      draggingFood = f;
      foodDragStart = { x: e.clientX, y: e.clientY };
      card.classList.add("highlight");
      // 创建一个跟随指针的飞行图标
      const ghost = document.createElement("div");
      ghost.className = "flying-food";
      ghost.textContent = f.emoji;
      ghost.style.left = (e.clientX - 18) + "px";
      ghost.style.top  = (e.clientY - 18) + "px";
      ghost.style.transition = "none";
      ghost.id = "foodGhost";
      document.body.appendChild(ghost);
    });
    grid.appendChild(card);
  });
}

// 在 document 上监听拖拽移动和释放（避免只绑定在卡片上）
document.addEventListener("pointermove", (e)=>{
  const ghost = document.getElementById("foodGhost");
  if(ghost){
    ghost.style.left = (e.clientX - 18) + "px";
    ghost.style.top  = (e.clientY - 18) + "px";
  }
});

document.addEventListener("pointerup", (e)=>{
  const ghost = document.getElementById("foodGhost");
  if(ghost) ghost.remove();

  document.querySelectorAll(".food-card.highlight").forEach(el=>el.classList.remove("highlight"));

  if(!draggingFood) return;
  const food = draggingFood;
  // 判断这次是"点击"还是"拖拽"
  const moved = !!(foodDragStart &&
    Math.hypot(e.clientX - foodDragStart.x, e.clientY - foodDragStart.y) > 10);
  draggingFood = null;
  foodDragStart = null;

  // 判断是否落在宠物身上
  const feedCanvas = canvases.feed;
  if(!feedCanvas) return;
  const rect = feedCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const bodyR = bodyRadius();
  const dx = x - pet.x;
  const dy = y - pet.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if(!moved || dist < bodyR * 2.2){
    // 点击卡片直接喂食，或拖到宠物身上喂食
    applyFood(food);
    return;
  }

  // 判断是否落在食盆
  const bowl = { x: W/2, y: H*0.85 };
  if(Math.abs(x - bowl.x) < 80 && Math.abs(y - bowl.y) < 50){
    if(!petState.bowlFood) petState.bowlFood = [];
    food.addedTime = Date.now();
    food.spoiled = false;
    petState.bowlFood.push(food);
    if(petState.bowlFood.length > 3) petState.bowlFood.shift();
    showBubbleFor("feed", "（食物放进食盆了）");
    saveState();
    return;
  }

  // 拖到了别处：提示
  showBubbleFor("feed", "放到我嘴边嘛……");
});

async function feedFood(food, cardEl){
  cardEl.classList.add("highlight");
  setTimeout(()=>cardEl.classList.remove("highlight"), 200);

  // 飞行动画
  const rect = cardEl.getBoundingClientRect();
  const flyEl = document.createElement("div");
  flyEl.className = "flying-food";
  flyEl.textContent = food.emoji;
  flyEl.style.left = rect.left + "px";
  flyEl.style.top = rect.top + "px";
  document.body.appendChild(flyEl);

  await sleep(20);
  const canvas = canvases.feed;
  const cRect = canvas.getBoundingClientRect();
  const targetX = cRect.left + pet.x;
  const targetY = cRect.top + pet.y - bodyRadius();
  flyEl.style.left = targetX + "px";
  flyEl.style.top = targetY + "px";
  flyEl.style.opacity = "0.3";
  flyEl.style.transform = "scale(0.5)";

  await sleep(500);
  flyEl.remove();

  // 宠物反应
  applyFood(food);
}

function applyFood(food){
  petState._interactCount = (petState._interactCount || 0) + 1;
  addAction("主人喂了你" + food.name);
  const s = petState.state;
  const bt = BODY_TYPES[petState.bodyType] || BODY_TYPES["圆胖型"];

  // 不明物体
  if(food.mystery === "A"){
    showChoice({
      title:"不明物体A",
      text:"要让它吃吗？",
      options:[
        { label:"让它吃", type:"primary", effect:()=>{
          const r = Math.random();
          if(r < 0.3){ showBubbleFor("feed","唔……感觉好奇怪……"); petState.state.心情 = clamp(petState.state.心情+15,0,100); }
          else if(r < 0.6){ petState.state.体力 = clamp(petState.state.体力-20,0,100); showBubbleFor("feed","肚子好痛……"); }
          else if(r < 0.8){ petState.traits.脾气 = clamp(petState.traits.脾气 + randInt(-15,15),0,100); showBubbleFor("feed","感觉……变了？"); }
          else if(r < 0.9){ petState.state.体力 = clamp(petState.state.体力+30,0,100); showBubbleFor("feed","能量满满！！"); }
          else { showBubbleFor("feed","……什么都没发生。"); }
        }},
        { label:"算了，扔掉", effect:()=>{ showBubbleFor("feed","……"); }}
      ]
    });
    return;
  }
  if(food.mystery === "B"){
    const r = Math.random();
    if(r < 0.4){
      s.体力 = clamp(s.体力-40,0,100);
      showBubbleFor("feed","呼……呼……好困……");
      setMoodOverride("sleepy", 5000);
    } else if(r < 0.7){
      s.心情 = clamp(s.心情-20,0,100);
      showBubbleFor("feed","呜……不舒服……");
      setMoodOverride("sick", 5000);
    } else if(r < 0.9){
      petState.shadow = clamp(petState.shadow + randInt(-10,20),0,100);
      showBubbleFor("feed","……");
    } else {
      petState.bodyType = pick(ALL_BODY_TYPES);
      showBubbleFor("feed","！！身体变了！");
    }
    saveState(); return;
  }

  // 检查是否拒绝
  const mood = petState.mood;
  if(food.rejectChance && Math.random() < food.rejectChance){
    showBubbleFor("feed", "不要这个……");
    setMoodOverride("sad", 2000);
    return;
  }

  // 体型偏好
  let likeMul = 1.0;
  let foodText = "";

  const maskPref = FOOD_PREF[petState.mask] || { like:[], hate:[] };
  const bodyLikes = bt.likeFood || [];

  if(maskPref.like.includes(food.name) || bodyLikes.includes(food.name)){
    likeMul = 1.2;
    foodText = "喜欢！"+food.emoji;
    setMoodOverride("happy", 2500);
  } else if(maskPref.hate.includes(food.name) || !food.good){
    likeMul = 0.7;
    foodText = "……不太想吃。";
    setMoodOverride("sad", 2000);
  } else {
    foodText = "嗯，还行。";
    setMoodOverride("happy", 1500);
  }

  // 应用效果
  if(food.eff){
    Object.keys(food.eff).forEach(k=>{
      if(s[k] !== undefined){
        const v = food.eff[k];
        s[k] = clamp(s[k] + v * likeMul, 0, 100);
      }
    });
  }

  // 风险
  if(food.risk && Math.random() < food.risk.概率){
    if(food.risk.心情) s.心情 = clamp(s.心情 + food.risk.心情, 0, 100);
    if(food.risk.生病){
      s.饱腹 = clamp(s.饱腹 - 10, 0, 100);
      foodText = "呜……肚子不舒服……";
      setMoodOverride("sick", 3000);
    }
  }

  showBubbleFor("feed", foodText);
  sfxEat();
  if(!petState._todayEaten) petState._todayEaten = [];
  petState._todayEaten.push(food.name);
  recordMemory("喂食", food.name, { liked: likeMul > 1, food: food.name });

  // ★ 吃太多会呕吐
  if(s.饱腹 > 90 && Math.random() < 0.3){
    setTimeout(()=>{
      triggerBodyReaction("vomiting", 4000, 1);
      triggerBodyReaction("dizzy", 3000, 0.8);
      s.饱腹 = clamp(s.饱腹 - 20, 0, 100);
      s.心情 = clamp(s.心情 - 10, 0, 100);
      showBubbleFor(currentPage, pick(["呕……","吃太多了……","（捂住嘴）唔……","好撑……呕……"]));
    }, 1000);
  }

  // ★ 吃到喜欢的食物会脸红+流口水
  if(likeMul > 1){
    triggerBodyReaction("blushing", 2000, 0.8);
    triggerBodyReaction("drooling", 1500, 0.5);
  }
  // 三层后果：喂了最爱后，三天后它会送你礼物（延迟反应）
  if(likeMul > 1 && petState.fateFlags && !petState.fateFlags.送过礼物){
    addDelayedReaction("喂食后报恩", 1000 * 60 * 60 * 24 * 3, { food: food.name });
  }
  saveState();
}

const PLAY_GAMES = [
  { id:"feather", icon:"🪶", name:"逗猫棒" },
  { id:"ball", icon:"🎾", name:"扔球" },
  { id:"star", icon:"⭐", name:"接星星" },

];

function initPlayPage(){
  const el = document.getElementById("playControls");

  el.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "action-grid";

  PLAY_GAMES.forEach(g=>{
    const btn = document.createElement("button");

    btn.addEventListener("click", ()=>startPlayGame(g));
    grid.appendChild(btn);
  });

/* 初始化玩耍页的玩具（可拖拽） */
function initPlayToys(){
  playState.toys = [
    { id:"ball",   emoji:"🎾", imgName:"ball",   x:0.24, y:0.28, vx:0, vy:0, dragging:false, bob:Math.random()*TAU },
    { id:"yarn",   emoji:"🧶", imgName:"yarn",   x:0.76, y:0.22, vx:0, vy:0, dragging:false, bob:Math.random()*TAU },
    { id:"star",   emoji:"⭐", imgName:"star",   x:0.28, y:0.68, vx:0, vy:0, dragging:false, bob:Math.random()*TAU },

  ];
}

function startPlayGame(g){
  const s = petState.state;
  if(s.体力 < 15){
    showBubbleFor("play","太累了……不想动。");
    setMoodOverride("sleepy", 2000);
    triggerBodyReaction("dizzy", 3000, 0.8);  // 累晕了
    triggerBodyReaction("tongue_out", 2000, 0.8);  // 累得吐舌头
    return;
  }

  playState.activeGame = g.id;
  playState.gameTime = 0;

  const bt = BODY_TYPES[petState.bodyType] || BODY_TYPES["圆胖型"];
  const isLiked = bt.likePlay && bt.likePlay.includes(g.name);
  const mul = isLiked ? 1.2 : 1.0;

  s.心情 = clamp(s.心情 + 10*mul, 0, 100);
  s.体力 = clamp(s.体力 - 6, 0, 100);
  s.亲密度 = clamp(s.亲密度 + 3, 0, 100);
  s.饱腹 = clamp(s.饱腹 - 3, 0, 100);

  // ★ 玩耍时的身体反应
  triggerBodyReaction("tongue_out", 2000, 0.6);  // 兴奋得吐舌头
  if(isLiked){
    triggerBodyReaction("blushing", 2000, 0.5);  // 喜欢的游戏会脸红
    triggerBodyReaction("drooling", 1500, 0.4);  // 期待得流口水
  }
  // 体力低于30还玩会累
  if(s.体力 < 30){
    triggerBodyReaction("dizzy", 2500, 0.6);
    triggerBodyReaction("trembling", 2000, 0.4);  // 累得发抖
  }

  let text = "";
  if(isLiked) text = "最喜欢"+g.name+"了！";
  else text = "嗯，"+g.name+"……还行。";

  showBubbleFor("play", text);
  setMoodOverride("happy", 2500);
  addClickEffect(pet.x, pet.y - bodyRadius()*1.5, "#FFE9A8");
  saveState();
}

function drawPlayScene(c,t){
  // 画玩具（可拖拽）
  playState.toys.forEach(toy=>{
    const tx = toy.x * W;
    const ty = toy.y * H + Math.sin(t*0.002 + toy.bob) * 4;
    c.save();
    // 阴影圆底
    c.fillStyle = "rgba(180,140,200,0.2)";
    c.beginPath();
    c.ellipse(tx, ty+20, 28, 10, 0, 0, TAU);
    c.fill();
    // 被拖拽时高亮
    if(toy.dragging){
      c.strokeStyle = "rgba(255,150,200,0.8)";
      c.lineWidth = 3;
      c.setLineDash([6,6]);
      c.beginPath(); c.arc(tx, ty, 36, 0, TAU); c.stroke();
      c.setLineDash([]);
    }
    // 绘制玩具图片（单独图片）
    const toyImg = TOY_IMAGES[toy.imgName];
    if(toyImg && toyImg.complete && toyImg.naturalWidth > 0){
      const size = 56;
      c.drawImage(toyImg, tx - size/2, ty - size/2, size, size);
    } else {
      // 回退到 emoji
      c.font = "36px sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(toy.emoji, tx, ty);
    }
    c.restore();
  });

  // 顶部提示
  c.save();
  c.fillStyle = "rgba(154,138,176,0.9)";
  c.font = "13px \"ZCOOL KuaiLe\", \"PingFang SC\", sans-serif";
  c.textAlign = "center";
  c.textBaseline = "top";
  let hint = "拖着玩具逗它 · 点击空白处让它跑过去";
  if(playState.activeGame === "feather") hint = "🪶 拖动逗猫棒，让它追着跑！";
  else if(playState.activeGame === "ball") hint = "🎾 点击地面扔球，它会跑去接！";
  else if(playState.activeGame === "star") hint = "⭐ 点击天空，星星会掉下来，让它接住！";
  else if(playState.activeGame === "hide") hint = "🙈 它躲起来了，点击找到它！";
  c.fillText(hint, W/2, 22);
  c.restore();

  // ★ 接星星：画掉落的星星
  if(playState.stars && playState.stars.length){
    playState.stars.forEach((star, i)=>{
      if(!star.caught){
        star.y += 3; // 星星下落速度
        if(star.y >= star.targetY){
          // 星星落地，检查宠物是否在附近
          const br = bodyRadius();
          if(Math.hypot(star.x - pet.x, star.y - pet.y) < br * 1.5){
            // 接住了！
            star.caught = true;
            petState.state.心情 = clamp(petState.state.心情 + 8, 0, 100);
            petState.state.体力 = clamp(petState.state.体力 - 2, 0, 100);
            petState.state.亲密度 = clamp(petState.state.亲密度 + 3, 0, 100);
            showBubbleFor("play", pick(["接到了！","好亮的星星！","给你~","嘿嘿~"]));
            triggerBodyReaction("happy", 1500, 0.8);
            sfxHappy();
            addClickEffect(star.x, star.y, "#FFE9A8");
            recordMemory("玩耍", "接星星");
          } else {
            star.caught = true; // 没接住，消失
          }
        }
        if(!star.caught){
          // 画星星
          c.save();
          c.fillStyle = "#FFE9A8";
          c.shadowColor = "#FFE9A8";
          c.shadowBlur = 15;
          c.font = "24px sans-serif";
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText("⭐", star.x, star.y);
          c.restore();
        }
      }
    });
    // 清理已接住的星星
    playState.stars = playState.stars.filter(s=>!s.caught);
  }

  // ★ 逗猫棒：宠物追着玩具跑
  if(playState.chasingToy && playState.toys.length){
    const toy = playState.toys.find(t=>t.dragging);
    if(toy){
      const tx = toy.x * W, ty = toy.y * H;
      petState._targetX = tx;
      petState._targetY = ty;
      // 追上了
      const br = bodyRadius();
      if(Math.hypot(tx - pet.x, ty - pet.y) < br * 1.2){
        playState.chasingToy = false;
        petState.state.心情 = clamp(petState.state.心情 + 6, 0, 100);
        petState.state.体力 = clamp(petState.state.体力 - 2, 0, 100);
        petState.state.亲密度 = clamp(petState.state.亲密度 + 2, 0, 100);
        showBubbleFor("play", pick(["抓到了！","好有趣！","再来再来！","（咬住逗猫棒）嘿嘿~"]));
        triggerBodyReaction("happy", 1500, 0.8);
        sfxHappy();
        addClickEffect(pet.x, pet.y - bodyRadius(), "#FFE9A8");
        recordMemory("玩耍", "逗猫棒");
      }
    }
  }
}

/* ─── 玩耍页玩具拖拽交互 ─── */
function playSizeOf(canvas){
  const parent = canvas ? canvas.parentElement : null;
  return { w: (parent && parent.clientWidth) || W, h: (parent && parent.clientHeight) || H };
}

function handlePlayPointerDown(p, canvas){
  const sz = playSizeOf(canvas);
  for(const toy of playState.toys){
    const tx = toy.x*sz.w, ty = toy.y*sz.h;
    if(Math.hypot(p.x-tx, p.y-ty) < 36){
      toy.dragging = true;
      toy.offX = p.x - tx;
      toy.offY = p.y - ty;
      // ★ 开始玩逗猫棒：宠物会追着玩具跑
      if(playState.activeGame === "feather"){
        playState.chasingToy = true;
        showBubbleFor("play", pick(["哇！好有趣！","我要抓到你！","嘿嘿~"]));
      }
      return true;
    }
  }
  // 点击空白处 → 让宠物跑过去
  const br = bodyRadius();
  if(Math.hypot(p.x - pet.x, p.y - pet.y) > br * 1.5){
    petState._targetX = clamp(p.x, br, W - br);
    petState._targetY = clamp(p.y, br*1.2, H - br*0.5);
    playState.petTargetTime = Date.now();
    if(Math.random() < 0.5){
      showBubbleFor("play", pick(["来啦！","等等我~","我来了！"]));
    }
    // ★ 扔球玩法：点击位置扔球，宠物跑去接
    if(playState.activeGame === "ball"){
      playState.ballThrown = true;
      playState.ballTarget = { x: p.x, y: p.y };
      setTimeout(()=>{
        if(playState.ballThrown && currentPage === "play"){
          // 宠物接到球了
          playState.ballThrown = false;
          petState.state.心情 = clamp(petState.state.心情 + 5, 0, 100);
          petState.state.体力 = clamp(petState.state.体力 - 3, 0, 100);
          petState.state.亲密度 = clamp(petState.state.亲密度 + 2, 0, 100);
          showBubbleFor("play", pick(["接到了！","给你~","嘿嘿，我厉害吧？","（叼着球跑回来）"]));
          triggerBodyReaction("happy", 1500, 0.8);
          sfxHappy();
          addClickEffect(pet.x, pet.y - bodyRadius(), "#FFE9A8");
          recordMemory("玩耍", "扔球接球");
          saveState();
        }
      }, 1500);
    }
    // ★ 接星星玩法：点击位置生成星星，宠物跑去接
    if(playState.activeGame === "star"){
      playState.stars = playState.stars || [];
      playState.stars.push({ x: p.x, y: 0, targetY: p.y, caught: false });
    }
    return true;
  }
  return false;
}

function handlePlayPointerMove(p, canvas){
  const sz = playSizeOf(canvas);
  let any = false;
  for(const toy of playState.toys){
    if(toy.dragging){
      const oldX = toy.x, oldY = toy.y;
      toy.x = clamp((p.x - toy.offX) / sz.w, 0.05, 0.95);
      toy.y = clamp((p.y - toy.offY) / sz.h, 0.08, 0.92);
      // 记录拖动速度
      toy.vx = (toy.x - oldX) * sz.w;
      toy.vy = (toy.y - oldY) * sz.h;
      any = true;
    }
  }
  return any;
}

function handlePlayPointerUp(p, canvas){
  const sz = playSizeOf(canvas);
  let any = false;
  for(const toy of playState.toys){
    if(toy.dragging){
      toy.dragging = false;
      const d = Math.hypot(toy.x*sz.w - pet.x, toy.y*sz.h - pet.y);
      const br = bodyRadius();
      if(d < br*1.9){
        // 玩具碰到宠物 → 一起玩
        const s = petState.state;
        s.心情 = clamp(s.心情 + 8, 0, 100);
        s.亲密度 = clamp(s.亲密度 + 4, 0, 100);
        s.体力 = clamp(s.体力 - 4, 0, 100);
        showBubbleFor("play", pick(["嘿嘿！这个好玩！","再来一次！","抓到啦！"]));
        setMoodOverride("happy", 2000);
        addClickEffect(pet.x, pet.y - br*1.5, "#FFE9A8");
        saveState();
      } else if(d > br*3){
        // 扔得远 → 宠物跑过去捡回来
        playState.fetchingToy = toy.id;
        playState.fetchState = "going";
        petState._targetX = toy.x * sz.w;
        petState._targetY = toy.y * sz.h;
        showBubbleFor("play", pick(["我去捡回来！","等着哦~","马上回来！"]));
        setMoodOverride("happy", 1500);
      } else {
        showBubbleFor("play", "……玩具掉地上了。");
      }
      any = true;
    }
  }
  return any;
}

function initBathPage(){
  if(bathState.mode === undefined) bathState.mode = null;

  if(!bathState.mode){
    // 让玩家选模式
    const el = document.getElementById("bathControls");
    el.innerHTML =
      '<div class="step-hint">选择要做什么</div>' +
      '<div class="pill-row">' +
        '<button class="pill" data-mode="bath">🛁 洗澡</button>' +
        '<button class="pill" data-mode="toilet">🚽 上厕所</button>' +
      '</div>';
    el.querySelectorAll("[data-mode]").forEach(b=>{
      b.addEventListener("click", ()=>{
        bathState.mode = b.dataset.mode;
        if(bathState.mode === "toilet") initToiletMode();
        else initBathMode();
      });
    });
    return;
  }

  if(bathState.mode === "bath"){
    if(bathState.step === 0){ bathState.step = 1; renderBathControls(); }
    else renderBathControls();
  } else if(bathState.mode === "toilet"){
    renderToiletControls();
  }
}

function initBathMode(){
  bathState.step = 1;
  bathState.waterTemp = null;
  bathState.wetProgress = 0;
  bathState.washProgress = 0;
  bathState.rinseProgress = 0;
  bathState.dryProgress = 0;
  bathState.washedParts = { head:false, body:false, leftArm:false, rightArm:false, tail:false };
  bathState.blowTimer = 0;
  bathState.blowActive = false;
  bathState.showerX = 0.5; bathState.showerY = 0.15;  // 花洒移到顶部中央，更明显
  bathState.towelX = 0.5; bathState.towelY = 0.85;   // 毛巾移到底部中央
  renderBathControls();
  setTimeout(()=>showBubbleFor("bath", pick(["要洗澡了吗……","不要嘛！","……好吧。","嘿嘿，玩水~"])), 300);
}

let toiletState = {
  step: 0, // 0=提示 1=引导 2=完成
  spotX: 0, spotY: 0,
  progress: 0,
  dragging: false,
  petOverSpot: false
};

function initToiletMode(){
  toiletState.step = 0;
  toiletState.progress = 0;
  toiletState.spotX = W * 0.5;
  toiletState.spotY = H * 0.65;
  renderToiletControls();

function renderToiletControls(){
  const el = document.getElementById("bathControls");
  if(!el) return;
  const learned = petState.tutorial && petState.tutorial.learnedToilet;

  if(learned){
    el.innerHTML = '<div class="step-hint">🚽 它已经学会上厕所了</div>' +
      '<div class="pill-row"><button class="pill" data-action="toilet-done">完成</button>' +
      '<button class="pill" data-action="toilet-back">← 换洗澡</button></div>';
    el.querySelector("[data-action=toilet-done]").addEventListener("click", ()=>{
      bathState.mode = null;
      switchPage("home");
    });
    el.querySelector("[data-action=toilet-back]").addEventListener("click", ()=>{
      bathState.mode = "bath";
      initBathMode();
    });
    return;
  }

  el.innerHTML =
    '<div class="step-hint">🚽 把它拖到尿垫上</div>' +
    '<div class="step-track"><div class="step-fill" id="toiletFill" style="width:'+toiletState.progress+'%"></div></div>' +
    '<div class="pill-row"><button class="pill" data-action="toilet-cancel">取消</button>' +
    '<button class="pill" data-action="toilet-back">← 换洗澡</button></div>';
  el.querySelector("[data-action=toilet-cancel]").addEventListener("click", ()=>{
    bathState.mode = null;
    initBathPage();
  });
  el.querySelector("[data-action=toilet-back]").addEventListener("click", ()=>{
    bathState.mode = "bath";
    initBathMode();
  });
}

function renderBathControls(){
  const el = document.getElementById("bathControls");
  if(!el) return;
  el.innerHTML = "";

  const step = bathState.step;
  let html = "";

  if(step === 1){
    html = '<div class="step-hint">🛁 选择水温</div>' +
      '<div class="pill-row">' +
      '<button class="pill" data-temp="冷">❄️ 冷</button>' +
      '<button class="pill" data-temp="温">🌡️ 温</button>' +
      '<button class="pill" data-temp="热">🔥 热</button>' +
      '</div>';
  } else if(step === 2){
    html = '<div class="step-hint">🚿 拖动花洒到宠物身上打湿</div>' +
      '<div class="step-track"><div class="step-fill" id="wetFill" style="width:'+bathState.wetProgress+'%"></div></div>';
  } else if(step === 3){
    html = '<div class="step-hint">🧼 点击宠物不同部位搓洗</div>' +
      '<div class="step-track"><div class="step-fill" id="washFill" style="width:'+bathState.washProgress+'%"></div></div>';
  } else if(step === 4){
    html = '<div class="step-hint">💧 拖动花洒冲洗泡泡</div>' +
      '<div class="step-track"><div class="step-fill" id="rinseFill" style="width:'+bathState.rinseProgress+'%"></div></div>';
  } else if(step === 5){
    html = '<div class="step-hint">🧖 拖动毛巾擦干</div>' +
      '<div class="step-track"><div class="step-fill" id="dryFill" style="width:'+bathState.dryProgress+'%"></div></div>';
  } else if(step === 6){
    html = '<div class="step-hint">💨 点击吹风机吹干</div>' +
      '<div class="step-track"><div class="step-fill" id="blowFill" style="width:'+(bathState.blowTimer/30*100)+'%"></div></div>';
  } else if(step === 7){
    html = '<div class="step-hint">✨ 洗澡完成！</div>' +
      '<div class="pill-row"><button class="pill" data-action="finish">完成</button></div>';
  }

  el.innerHTML = html;

  // 每个步骤都加一个"换厕所"返回按钮
  if(step !== 7){
    const backRow = document.createElement("div");
    backRow.className = "pill-row";
    backRow.style.marginTop = "4px";
    backRow.innerHTML = '<button class="pill" data-action="switch-toilet" style="font-size:12px;opacity:0.7;">🚽 换厕所</button>';
    el.appendChild(backRow);
    backRow.querySelector("[data-action=switch-toilet]").addEventListener("click", ()=>{
      bathState.mode = "toilet";
      initToiletMode();
    });
  }

  // 绑定
  el.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click", ()=>{
      if(p.dataset.temp){
        bathState.waterTemp = p.dataset.temp;
        let text = "水温"+p.dataset.temp;
        if(p.dataset.temp === "冷"){
          if(Math.random() < 0.1){
            petState.state.体力 = clamp(petState.state.体力-10,0,100);
            text = "好冷……！";
          } else {
            text = pick(["凉丝丝的……","好舒服~","唔，有点凉"]);
          }
        } else if(p.dataset.temp === "热"){
          petState.state.心情 = clamp(petState.state.心情-10,0,100);
          text = pick(["烫！烫！","太热了啦！","呜呜好烫……"]);
        } else {
          text = pick(["温度刚刚好~","好舒服的水温","嘿嘿，可以洗澡了"]);
        }
        showBubbleFor("bath", text);
        bathState.step = 2;
        setTimeout(()=>showBubbleFor("bath", pick(["把花洒拖过来嘛~","我准备好了！","不要弄湿我的头！"])), 800);
        renderBathControls();
      } else if(p.dataset.action === "finish"){
        finishBath();
      }
    });
  });
}

function finishBath(){
  addAction("主人给你洗了澡");
  const s = petState.state;
  s.清洁 = clamp(s.清洁 + 40, 0, 100);
  s.心情 = clamp(s.心情 + 10, 0, 100);
  // ★ 洗澡时清除伤口（洗干净了，伤口也愈合了一些）
  if(Array.isArray(petState.marks) && petState.marks.length > 0){
    const healed = Math.min(2, petState.marks.length);  // 每次洗澡最多愈合2个伤口
    for(let i=0;i<healed;i++) petState.marks.shift();
  }
  showBubbleFor("bath", "洗好了～干净！");
  setMoodOverride("happy", 3000);
  saveState();
  setTimeout(()=>{ switchPage("home"); }, 2000);
}

function updateBathProgress(dt){
  const s = petState.state;
  const bt = BODY_TYPES[petState.bodyType] || BODY_TYPES["圆胖型"];

  if(bathState.step === 2){
    // 自动缓慢增加（如果花洒靠近宠物）
    if(bathState.showerOnPet){
      bathState.wetProgress += dt * 0.08;
      // ★ 打湿时的身体反应：发抖、挣扎
      triggerBodyReaction("trembling", 500, 0.6);
      if(Math.random() < 0.02) triggerBodyReaction("head_shake", 300, 0.8);  // 甩头
      // 进度达到25%、50%、75%时随机说话
      if(Math.floor(bathState.wetProgress/25) > Math.floor((bathState.wetProgress - dt*0.08)/25)){
        const lines = ["好凉~","呜呜头发湿了……","不要冲脸！","嘿嘿，好舒服","水进眼睛了啦！"];
        if(Math.random() < 0.6) showBubbleFor("bath", pick(lines));
      }
      if(bathState.wetProgress >= 100){
        bathState.wetProgress = 100;
        bathState.step = 3;
        renderBathControls();
        showBubbleFor("bath", pick(["好湿……","我变成落汤鸡了","呜呜，毛都贴在身上了"]));
        setTimeout(()=>showBubbleFor("bath", pick(["现在可以搓泡泡了吗？","轻点搓哦~","我脖子也要洗！"])), 1000);
      }
      const fill = document.getElementById("wetFill");
      if(fill) fill.style.width = bathState.wetProgress + "%";
    }
  } else if(bathState.step === 3){
    // ★ 搓洗时：挣扎、脸红
    if(bathState.scrubOnPet && Math.random() < 0.03){
      triggerBodyReaction("trembling", 400, 0.4);
      triggerBodyReaction("blushing", 500, 0.3);
    }
  } else if(bathState.step === 4){
    if(bathState.showerOnPet){
      bathState.rinseProgress += dt * 0.08;
      // ★ 冲洗时：甩水、吐舌头
      if(Math.random() < 0.02){
        triggerBodyReaction("head_shake", 400, 1);  // 甩头甩水
        triggerBodyReaction("tongue_out", 300, 0.5);
      }
      if(Math.floor(bathState.rinseProgress/33) > Math.floor((bathState.rinseProgress - dt*0.08)/33)){
        const lines = ["泡泡冲掉了~","好干净！","还有泡泡啦！","冲冲冲~"];
        if(Math.random() < 0.5) showBubbleFor("bath", pick(lines));
      }
      if(bathState.rinseProgress >= 100){
        bathState.rinseProgress = 100;
        bathState.step = 5;
        renderBathControls();
        showBubbleFor("bath", pick(["冲干净了！","现在可以擦干了吗？","好冷，快给我毛巾！"]));
        triggerBodyReaction("trembling", 2000, 0.7);  // 冷得发抖
      }
      const fill = document.getElementById("rinseFill");
      if(fill) fill.style.width = bathState.rinseProgress + "%";
    }
  } else if(bathState.step === 5){
    if(bathState.towelOnPet){
      bathState.dryProgress += dt * 0.1;
      // ★ 擦干时：舒服、脸红
      if(Math.random() < 0.03){
        triggerBodyReaction("blushing", 500, 0.5);
        triggerBodyReaction("tongue_out", 400, 0.4);
      }
      if(Math.floor(bathState.dryProgress/33) > Math.floor((bathState.dryProgress - dt*0.1)/33)){
        const lines = ["好暖和~","擦得我好舒服","不要太用力啦！","嘿嘿，毛都蓬起来了"];
        if(Math.random() < 0.5) showBubbleFor("bath", pick(lines));
      }
      if(bathState.dryProgress >= 100){
        bathState.dryProgress = 100;
        bathState.step = 6;
        renderBathControls();
        showBubbleFor("bath", pick(["差不多干了~","还要吹头发吗？","我不喜欢吹风机……"]));
      }
      const fill = document.getElementById("dryFill");
      if(fill) fill.style.width = bathState.dryProgress + "%";
    }
  } else if(bathState.step === 6){
    if(bathState.blowActive){
      bathState.blowTimer += dt * 0.03;
      // ★ 吹干时：头晕、吐舌头、毛乱飞
      if(Math.random() < 0.03){
        triggerBodyReaction("dizzy", 500, 0.5);
        triggerBodyReaction("tongue_out", 400, 0.6);
      }
      if(Math.floor(bathState.blowTimer/10) > Math.floor((bathState.blowTimer - dt*0.03)/10)){
        const lines = ["呼呼呼~","风好大！","我的毛都飞起来了","好暖和呀"];
        if(Math.random() < 0.5) showBubbleFor("bath", pick(lines));
      }
      if(bathState.blowTimer >= 30){
        bathState.blowTimer = 30;
        bathState.step = 7;
        renderBathControls();
      }
      const fill = document.getElementById("blowFill");
      if(fill) fill.style.width = (bathState.blowTimer/30*100) + "%";
    }
  }
}

function drawBathScene(c,t){
  // 浴缸
  const bx = W/2, by = H*0.6;
  c.save();
  // 外壁
  c.fillStyle = "#BDE0FF";
  roundRectPath(c,bx-W*0.4,by-90,W*0.8,180,30);
  c.fill();
  // 内壁
  c.fillStyle = "#E8F4FF";
  roundRectPath(c,bx-W*0.36,by-70,W*0.72,140,20);
  c.fill();
  // 水面
  c.fillStyle = "rgba(168,216,255,0.6)";
  c.beginPath();
  c.ellipse(bx, by-10, W*0.32, 40, 0, 0, TAU);
  c.fill();
  // 泡泡
  for(let i=0;i<8;i++){
    const px = bx - W*0.3 + ((i*73)%(W*0.6));
    const py = by - 40 + ((i*41)%80);
    c.fillStyle = "rgba(255,255,255,0.5)";
    c.beginPath();
    c.arc(px, py, 5 + (i%4)*2, 0, TAU);
    c.fill();
  }
  c.restore();

  // 花洒（全程显示，步骤2和4时高亮，放大尺寸更明显）
  const sx = W * bathState.showerX;
  const sy = H * bathState.showerY;
  const showerActive = bathState.step === 2 || bathState.step === 4;
  const showerVisible = bathState.step >= 1; // 步骤1以后都显示
  if(showerVisible){
    c.save();
    if(showerActive){
      // 发光效果
      c.shadowColor = "#7BC8FF";
      c.shadowBlur = 25;
    }
    // 花洒手柄（放大）
    c.strokeStyle = showerActive ? "#5AB0F0" : "#A8D8FF";
    c.lineWidth = 10;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(sx, sy);
    c.lineTo(sx+35, sy+45);
    c.stroke();
    // 花洒喷头（放大）
    c.fillStyle = showerActive ? "#5AB0F0" : "#A8D8FF";
    c.beginPath();
    c.arc(sx+35, sy+55, 28, 0, TAU);
    c.fill();
    // 花洒喷头内圈
    c.fillStyle = "#E8F4FF";
    c.beginPath();
    c.arc(sx+35, sy+55, 16, 0, TAU);
    c.fill();
    // 花洒喷水孔
    c.fillStyle = showerActive ? "#5AB0F0" : "#A8D8FF";
    for(let i=0;i<5;i++){
      const hx = sx+35 + Math.cos(i*1.2)*10;
      const hy = sy+55 + Math.sin(i*1.2)*10;
      c.beginPath();
      c.arc(hx, hy, 2.5, 0, TAU);
      c.fill();
    }
    c.restore();
    // 花洒提示文字
    if(showerActive){
      c.save();
      c.fillStyle = "rgba(90,176,240,0.95)";
      c.font = "bold 14px sans-serif";
      c.textAlign = "center";
      c.fillText("← 拖动花洒到宠物身上", sx+35, sy-15);
      c.restore();
    }
    // 非活跃时也显示提示
    if(!showerActive && bathState.step === 1){
      c.save();
      c.fillStyle = "rgba(154,138,176,0.8)";
      c.font = "12px sans-serif";
      c.textAlign = "center";
      c.fillText("（下一步会用到花洒）", sx+35, sy-15);
      c.restore();
    }
  }

  // 毛巾（步骤5时高亮）
  const tx = W * bathState.towelX;
  const ty = H * bathState.towelY;
  const towelActive = bathState.step === 5;
  c.save();
  if(towelActive){
    c.shadowColor = "#FFB6D9";
    c.shadowBlur = 20;
  }
  c.fillStyle = towelActive ? "#FF9EC7" : "#FFD6E8";
  roundRectPath(c,tx-32,ty-20,64,40,12);
  c.fill();
  c.fillStyle = towelActive ? "#FFB6D9" : "#FFB6D9";
  roundRectPath(c,tx-24,ty-14,48,28,8);
  c.fill();
  c.restore();
  if(towelActive){
    c.save();
    c.fillStyle = "rgba(255,150,200,0.9)";
    c.font = "12px sans-serif";
    c.textAlign = "center";
    c.fillText("← 拖动我", tx, ty-28);
    c.restore();
  }

  // 吹风机
  c.save();
  c.fillStyle = "#C7B8FF";
  roundRectPath(c,W-80,H-160,50,30,8);
  c.fill();
  c.fillStyle = "#A88CC8";
  roundRectPath(c,W-40,H-155,15,20,4);
  c.fill();
  c.fillStyle = "#FFE9A8";
  c.font = "12px sans-serif";
  c.textAlign = "center";
  c.fillText("💨", W-55, H-100);
  c.restore();
}

function drawToiletScene(c, t){
  // 尿垫
  const px = W/2, py = H*0.72;
  toiletState.spotX = px;
  toiletState.spotY = py;
  c.save();
  // 垫子
  c.fillStyle = "rgba(255,214,232,0.85)";
  roundRectPath(c, px-90, py-40, 180, 80, 14);
  c.fill();
  c.strokeStyle = "rgba(255,182,217,0.9)";
  c.lineWidth = 3;
  roundRectPath(c, px-90, py-40, 180, 80, 14);
  c.stroke();
  // 星星装饰
  drawStarShape(c, px-70, py-20, 4, "#FFFFFF");
  drawStarShape(c, px+70, py+20, 4, "#FFFFFF");
  // 文字
  c.fillStyle = "rgba(90,74,122,0.9)";
  c.font = "bold 14px \"PingFang SC\", sans-serif";
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillText("🚽 尿垫", px, py);

  // 高亮提示
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.006);
  if(toiletState.progress > 0 || toiletState.dragging){
    c.strokeStyle = "rgba(255,233,168," + (0.4 + 0.5*pulse) + ")";
    c.lineWidth = 4;
    c.setLineDash([8, 8]);
    roundRectPath(c, px-100, py-50, 200, 100, 18);
    c.stroke();
    c.setLineDash([]);
  }
  c.restore();
}

function drawPetInBath(c,t){
  const bx = W/2, by = H*0.6;
  c.save();
  c.translate(bx, by - 50);
  const scale = 0.9;
  c.scale(scale, scale);
  // 临时设置 pet 位置
  const oldX = pet.x, oldY = pet.y;
  pet.x = 0; pet.y = 0;
  drawPet(c,t);
  pet.x = oldX; pet.y = oldY;
  c.restore();
}

function initCagePage(){
  cageState.inCage = true;
  const el = document.getElementById("cageControls");
  if(!el) return;

  const s = petState.state;
  const t = petState.traits;

  if(isYandereLoyal()){
    setTimeout(()=>{
      showBubbleFor("cage", yandereReply("cage"));
    }, 600);
  } else {
    const cageTexts = {
      "公主病":"放本公主出去！",
      "本大人":"你竟敢关本大人？",
      "小可爱":"呜呜……宝宝错了……",
      "傲娇":"才、才不想出去。",
      "冷淡":"……",
      "疯批":"哈哈哈哈这里挺好玩的。",
      "学者":"在下正在观察这个笼子的结构。",
      "戏精":"本宫的命好苦啊……",
      "憨憨":"嘿嘿，这里有点小。",
      "病娇":"你终于来看我了。"
    };
    setTimeout(()=>{
      showBubbleFor("cage", cageTexts[petState.mask] || "……");
    }, 600);
  }

  let reactionText = "";
  if(t.脾气 > 60) reactionText = "摇晃栏杆";
  else if(t.胆量 < 40) reactionText = "哭泣";
  else if(t.记仇 > 70) reactionText = "装死";
  else if(s.信任度 < 30) reactionText = "假顺从";
  else if(petState.mask === "冷淡") reactionText = "沉默";
  else if(s.亲密度 < 20) reactionText = "绝食";
  else reactionText = "蹲在角落";

  el.innerHTML = '';
  const grid = document.createElement("div");
  grid.className = "action-grid";

  const actions = [
    { icon:"💬", name:"对话", fn:()=>{ promptCageTalk(); } },
    { icon:"🍎", name:"喂食", fn:()=>{ cageFeed(); } },
    { icon:"🔒", name:"加锁", fn:()=>{ lockCage(); } },
    { icon:"🚪", name:"放出", fn:()=>{ releaseFromCage(); } },
    { icon:"⛓️", name:"加罚", fn:()=>{ addPunishment(); } }
  ];
  actions.forEach(a=>{
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.innerHTML = '<span class="aic">'+a.icon+'</span>'+a.name;
    btn.addEventListener("click", a.fn);
    grid.appendChild(btn);
  });

  const info = document.createElement("div");
  info.style.cssText = "margin-top:12px;font-size:12px;color:rgba(255,255,255,0.6);text-align:center;";
  const minutes = Math.floor(cageState.timeInCageMs / 60000);
  info.textContent = "已关押 " + minutes + " 分钟 · 状态：" + reactionText;
  grid.appendChild(info);

  el.appendChild(grid);
}

function promptCageTalk(){
  showModal({
    title:"💬 对它说话",
    html:'<input id="cageTalkInput" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,233,168,0.4);background:rgba(255,255,255,0.1);color:#fff;font-size:14px;outline:none;" placeholder="输入想说的话...">',
    actions:[
      { label:"说", type:"primary", onClick:()=>{
        const v = document.getElementById("cageTalkInput")?.value?.trim();
        if(v){
          petState.state.亲密度 = clamp(petState.state.亲密度 + 0.5, 0, 100);
          sendCageMessage(v);
        }
      }},
      { label:"取消", onClick:()=>{} }
    ]
  });
}

async function sendCageMessage(input){
  showThinking("cage");
  await sleep(600);
  const reply = localReply(input);
  showBubbleFor("cage", reply);
  saveState();
}

function cageFeed(){
  const food = pick(FOODS.filter(f=>f.good));
  const s = petState.state;
  if(s.亲密度 < 20 && Math.random() < 0.5){
    showBubbleFor("cage","……我不吃。");
    setMoodOverride("sad", 2000);
    return;
  }
  if(food.eff){
    Object.keys(food.eff).forEach(k=>{
      if(s[k] !== undefined) s[k] = clamp(s[k] + food.eff[k]*0.7, 0, 100);
    });
  }
  showBubbleFor("cage", food.emoji + " 还行……");
  saveState();
}

function lockCage(){
  if(!petState.inCage && !cageState.inCage){
    showBubbleFor("cage", "它不在笼子里呀……");
    return;
  }
  petState.cageLockLevel = (petState.cageLockLevel || 0) + 1;
  if(petState.cageLockLevel > 3) petState.cageLockLevel = 3;
  const lockNames = ["简单锁", "普通锁", "复杂锁", "超级锁"];
  showBubbleFor("cage", "（你给笼子加上了" + lockNames[petState.cageLockLevel] + "）");
  sfxCage();
  if(petState.cageLockLevel >= 2){
    showBubbleFor("cage", pick(["……打不开了。","（它沮丧地看着锁）","哼。","……"]));
  }
  saveState();
}

function addPunishment(){

function drawCageScene(c, t){
  const bx = W/2, by = H/2;
  c.save();
  // 笼底
  c.fillStyle = "#C7B8FF";
  roundRectPath(c, bx-110, by+90, 220, 16, 8); c.fill();
  // 笼顶
  roundRectPath(c, bx-110, by-110, 220, 16, 8); c.fill();
  // 栏杆
  c.strokeStyle = "#FFB6D9";
  c.lineWidth = 7;
  c.lineCap = "round";
  for(let i=0;i<5;i++){
    const lx = bx - 90 + i*45;
    c.beginPath();
    c.moveTo(lx, by-105);
    c.lineTo(lx, by+95);
    c.stroke();
  }
  // 星星
  drawStarShape(c, bx, by-128, 9, "#FFE9A8");
  drawStarShape(c, bx-70, by-128, 6, "#FFE9A8");
  drawStarShape(c, bx+70, by-128, 6, "#FFE9A8");

  // 暗影光晕
  const shadowA = petState.shadow / 100;
  if(shadowA > 0.15){
    const g = c.createRadialGradient(bx,by,30,bx,by,170);
    g.addColorStop(0,"rgba(123,79,168,"+(shadowA*0.4)+")");
    g.addColorStop(1,"rgba(61,31,92,0)");
    c.fillStyle = g;
    c.beginPath();
    c.arc(bx,by,170,0,TAU);
    c.fill();
  }

  // 状态文字
  const s = petState.state;
  c.fillStyle = "rgba(255,233,168,0.9)";
  c.font = "13px \"PingFang SC\", sans-serif";
  c.textAlign = "center";
  c.textBaseline = "top";
  const mins = Math.floor(cageState.timeInCageMs / 60000);
  c.fillText("关押中 · " + mins + " 分钟", bx, 24);
  if(mins > 4) c.fillText("心情 ↓  亲密度 ↓", bx, 44);
  if(mins > 8) c.fillText("⚠️ 快要生病了", bx, 64);
  if(mins > 12) c.fillText("⚠️ 暗影值上升", bx, 84);
  c.restore();
}

function drawPetInCage(c,t){
  const bx = W/2, by = H/2 - 20;
  c.save();
  c.translate(bx, by);

  // ★ 笼子里的挣扎效果：根据愤怒/恐惧值决定挣扎程度
  const s = petState.state;
  const struggleLevel = (s.心情 < 40 ? 1 : 0) + (petState.discipline?.恐惧值 > 50 ? 1 : 0);
  if(struggleLevel > 0 && Math.sin(t*0.1) > 0.3){
    c.translate((Math.random()-0.5) * 4 * struggleLevel, (Math.random()-0.5) * 2 * struggleLevel);
  }

  c.scale(0.8, 0.8);
  const oldX = pet.x, oldY = pet.y;
  pet.x = 0; pet.y = 0;
  drawPet(c,t);
  pet.x = oldX; pet.y = oldY;

  // ★ 抓栏杆的爪子效果
  if(struggleLevel > 0 && Math.sin(t*0.15) > 0.5){
    c.save();
    c.strokeStyle = "rgba(100,80,120,0.6)";
    c.lineWidth = 4;
    c.lineCap = "round";
    // 左爪抓栏杆
    c.beginPath();
    c.moveTo(-50, -10);
    c.lineTo(-65, -25);
    c.stroke();
    // 右爪抓栏杆
    c.beginPath();
    c.moveTo(50, -10);
    c.lineTo(65, -25);
    c.stroke();
    c.restore();
  }

  c.restore();
}

function renderDressItems(){
  const grid = document.getElementById("dressItemGrid");
  if(!grid) return;
  grid.innerHTML = "";
  ACCESSORIES.forEach(acc=>{
    const div = document.createElement("div");
    div.className = "dress-item";
    // 检查是否已佩戴
    const equipped = (petState.accessories||[]).some(a=>{
      return typeof a === "string" ? a === acc.id : a.id === acc.id;
    });
    if(equipped) div.classList.add("equipped");
    const img = ACCESSORY_IMAGES[acc.imgName];
    div.innerHTML = img ? '<img src="'+img.src+'" alt="'+acc.name+'">' : '<span style="font-size:24px;">🎀</span>';
    div.title = acc.name;
    // 拖拽开始
    div.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      startDressDrag(acc, e.clientX, e.clientY);
    });
    grid.appendChild(div);
  });
}

function startDressDrag(acc, x, y){
  dressState.dragging = acc;
  // 创建幽灵元素
  const ghost = document.createElement("div");
  ghost.className = "dress-ghost";
  const img = ACCESSORY_IMAGES[acc.imgName];
  ghost.innerHTML = img ? '<img src="'+img.src+'">' : '<span style="font-size:30px;">🎀</span>';
  ghost.style.left = x + "px";
  ghost.style.top = y + "px";
  document.body.appendChild(ghost);
  dressState.ghostEl = ghost;

  const onMove = (e)=>{
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";
  };
  const onUp = (e)=>{
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    ghost.remove();
    dressState.ghostEl = null;
    dressState.dragging = null;
    // 计算落点相对于宠物的位置
    const canvas = document.getElementById("dressCanvas");
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    // 宠物位置（和renderPage中一致）
    const petX = rect.width / 2;
    const petY = rect.height * 0.45;
    const br = bodyRadius();
    // 转换为相对于宠物中心的bodyR倍数
    const relX = (px - petX) / br;
    const relY = (py - petY) / br;
    // 只有落在宠物附近才佩戴
    const dist = Math.hypot(relX, relY);
    if(dist < 2.5){
      equipAccessory(acc.id, relX, relY);
    } else {
      // 落在外面，取下
      unequipAccessory(acc.id);
    }
  };
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function equipAccessory(accId, x, y){
  if(!petState.accessories) petState.accessories = [];
  // 移除旧的同id饰品
  petState.accessories = petState.accessories.filter(a=>{
    return typeof a === "string" ? a !== accId : a.id !== accId;
  });
  // 添加新的（带位置）
  petState.accessories.push({ id: accId, x: x, y: y });
  // 宠物反应
  const acc = ACCESSORIES.find(a=>a.id===accId);
  const likes = Math.random() > 0.3;
  if(likes){
    showBubbleFor("dress", pick(["哇，好看！","这个我喜欢~","嘿嘿，谢谢！","再给我戴一个！"]));
    petState.state.心情 = clamp(petState.state.心情 + 3, 0, 100);
  } else {
    showBubbleFor("dress", pick(["……这个好奇怪。","不要这个嘛。","哼，不好看。","摘掉！"]));
    petState.state.心情 = clamp(petState.state.心情 - 2, 0, 100);
  }
  recordMemory("装扮", acc ? acc.name : accId);
  renderDressItems();
  saveState();
}

function unequipAccessory(accId){
  if(!petState.accessories) return;
  petState.accessories = petState.accessories.filter(a=>{
    return typeof a === "string" ? a !== accId : a.id !== accId;
  });
  showBubbleFor("dress", pick(["嗯……摘掉了。","不要摘嘛！","好吧。","嘿嘿，轻松了~"]));
  renderDressItems();
  saveState();
}

// 应用暗影管教操作
async function applyDarkOperation(opId){
  const op = DARK_OPERATIONS.find(o=>o.id === opId);
  if(!op) return;
  const d = petState.discipline;
  // 累积次数
  d.opCounts[opId] = (d.opCounts[opId] || 0) + 1;
  const count = d.opCounts[opId];
  // 应用数值影响
  const s = petState.state;
  for(const key in op.effects){
    const val = op.effects[key];
    if(key === "体力") s.体力 = clamp(s.体力 + val, 0, 100);
    else if(key === "饱腹") s.饱腹 = clamp(s.饱腹 + val, 0, 100);
    else if(key === "信任度") s.信任度 = clamp(s.信任度 + val, 0, 100);
    else if(key === "愤怒") s.心情 = clamp(s.心情 - val, 0, 100);
    else if(key === "抑郁") s.心情 = clamp(s.心情 - val, 0, 100);
    else if(d[key] !== undefined) d[key] = clamp(d[key] + val, 0, 100);
  }
  d.count++;
  d.lastTime = Date.now();
  // 记录记忆
  recordMemory("管教", op.name, { darkMode:true, count:count });
  // 根据累积次数获取反应
  const reactionLevel = Math.min(count, 4);
  const reactions = op.reactions[reactionLevel] || op.reactions[4] || ["……"];
  const reaction = pick(reactions);
  // 根据面具生成台词
  const line = generateDarkLine(opId, count, reaction);
  showBubbleFor("dark", line);
  // ★ 视觉反应
  const intensity = 1 + count * 0.2;
  if(opId === "starTouch") triggerReaction("gentle", intensity);
  else if(opId === "shadowShock" || opId === "starWhip") triggerReaction("shock", intensity);
  else if(opId === "gravityMagic") triggerReaction("hit", intensity * 1.2);
  else if(opId === "flamePurify") triggerReaction("flame", intensity);
  else if(opId === "deepSeal") triggerReaction("water", intensity);
  else if(opId === "stardustDisassemble") triggerReaction("shock", intensity * 1.5);
  else triggerReaction("hit", intensity);

  // ★ 身体反应系统：根据操作严重程度触发
  let severity = 1;
  if(opId === "starTouch") severity = 1;
  else if(opId === "shadowShock" || opId === "starWhip" || opId === "fluffyGlove") severity = 2;
  else if(opId === "gravityMagic" || opId === "flamePurify" || opId === "deepSeal" || opId === "candyBarrier") severity = 3;
  else if(opId === "stardustDisassemble") severity = 4;
  // 累积次数增加严重程度
  severity = Math.min(4, severity + Math.floor(count / 3));
  await triggerHitReaction(severity);

  // ★ 特殊操作的额外反应
  if(opId === "flamePurify" && count >= 2){
    triggerBodyReaction("vomiting", 3000, 0.8);  // 火焰净化可能导致呕吐
  }
  if(opId === "deepSeal" && count >= 3){
    triggerBodyReaction("dizzy", 4000, 1);  // 深海封印导致头晕
    triggerBodyReaction("blank_stare", 3000, 0.8);  // 眼神空洞
  }
  if(opId === "stardustDisassemble"){
    triggerBodyReaction("rolling_eyes", 3000, 1);  // 翻白眼
    triggerBodyReaction("foaming", 4000, 0.7);  // 口吐白沫
  }
  if(d.恐惧值 > 80){
    triggerBodyReaction("incontinence", 4000, 0.8);  // 极度恐惧导致失禁
    // 在宠物位置添加水渍
    if(!petState.poops) petState.poops = [];
    petState.poops.push({ x: pet.x, y: pet.y + 30, since: Date.now(), type: "wet" });
  }
  // 播放音效
  if(opId === "shadowShock" || opId === "starWhip") sfxHit();
  else if(opId === "flamePurify") sfxDiscipline();
  else if(opId === "deepSeal") sfxDrink();
  else sfxPetHead();
  // 设置情绪
  if(d.恐惧值 > 60) setMoodOverride("fear", 3000);
  else if(d.黑化值 > 50) setMoodOverride("angry", 3000);
  else setMoodOverride("sad", 2000);
  // 更新UI
  renderDarkStats();
  renderDarkControls();
  // 检查路径判定
  checkDarkPaths();
  saveState();
}

function generateDarkLine(opId, count, reaction){
  const mask = petState.mask;
  const baseLines = {
    "公主病": ["本公主不依！你竟敢！", "哼，等着瞧！", "……呜呜，本公主错了……"],
    "本大人": ["大胆！本大人不会屈服的！", "你会后悔的！", "……知道了。"],
    "小可爱": ["呜呜……宝宝错了……", "不要这样嘛……", "我听话了……"],
    "病娇": ["你打我是因为在乎我，对吧？", "没关系，我永远原谅你……", "……再用力一点？"],
    "傲娇": ["……知道了", "我才不怕！", "别、别误会……"],
    "冷淡": ["……", "嗯。", "……随便。"],
    "疯批": ["哈哈哈哈再来！", "有趣！", "嘿嘿嘿……"],
    "学者": ["在下……记录……这次……", "数据+1", "……结论：痛。"],
    "戏精": ["啊——本宫的心好痛——", "不要啊——", "……罢了。"],
    "憨憨": ["啊？为什么？", "哦……", "我错了吗？"]
  };
  const lines = baseLines[mask] || baseLines["冷淡"];
  if(count >= 3) return lines[2] || lines[lines.length-1];
  if(count >= 2) return lines[1] || lines[0];
  return lines[0];
}

// 检查暗影管教学路径判定
function checkDarkPaths(){
  const d = petState.discipline;
  // 路径A：服从值满
  if(d.服从值 >= 100 && !d._pathChecked){
    d._pathChecked = true;
    const isFake = d.记仇值 > 50;
    if(isFake){
      showModal({
        title:"⚠️ 假顺从",
        text:"它表面上完全服从了……\n但眼神在躲闪。\n它是真的变了，还是在等机会？",
        actions:[{ label:"继续观察", type:"primary", onClick:()=>{} }]
      });
    } else {
      showModal({
        title:"✨ 真心服从",
        text:"它的眼神变得温顺。\n它是真的服从你了。",
        actions:[{ label:"好", type:"primary", onClick:()=>{
          petState.traits.脾气 = clamp(petState.traits.脾气 - 20, 0, 100);
          petState.traits.粘人 = clamp(petState.traits.粘人 + 20, 0, 100);
        }}]
      });
    }
    return;
  }
  // 路径B：精神崩溃（黑化满或天使归零）
  if((d.黑化值 >= 100 || d.天使值 <= 0) && !d._pathChecked){
    d._pathChecked = true;
    const isAngel = d.天使值 > 50;
    if(isAngel){
      triggerAngelForm();
    } else {
      triggerDemonForm();
    }
    return;
  }
}

// 天使形态
function triggerAngelForm(){
  petState.discipline.天使值 = 100;
  petState.discipline.黑化值 = 0;
  petState.mood = "happy";
  showModal({
    title:"✨ 天使化",
    text:"它的身体泛起柔和的白光。\n它不再记仇，但也不再亲近你——\n它超脱了。",
    actions:[{ label:"继续", type:"primary", onClick:()=>{
      showBubbleFor("dark", "……我还在。");
      recordMemory("天使化");
    }}]
  });
  saveState();
}

// 恶魔形态
function triggerDemonForm(){
  petState.discipline.黑化值 = 100;
  petState.discipline.天使值 = 0;
  petState.mood = "angry";
  petState.traits.脾气 = clamp(petState.traits.脾气 + 30, 0, 100);
  petState.traits.记仇 = clamp(petState.traits.记仇 + 30, 0, 100);
  showModal({
    title:"🌑 恶魔化",
    text:"暗影将它包裹。\n它不再是它了。\n但它依然记得你做过的一切。",
    actions:[{ label:"继续", type:"danger", onClick:()=>{
      showBubbleFor("dark", "……哼。");
      recordMemory("恶魔化");
    }}]
  });
  saveState();
}

function getSemanticLine(semantic){
  const mask = petState.mask;
  const lines = SEMANTIC_LINES[semantic];
  if(!lines) return "……";
  const maskLines = lines[mask] || lines["冷淡"] || ["……"];
  return pick(maskLines);
}

function triggerSemantic(semantic, pageKey){
  pageKey = pageKey || currentPage;
  const line = getSemanticLine(semantic);
  showBubbleFor(pageKey, line);
  recordMemory("语义事件", semantic);
  const effects = {
    "拒绝食物": { 饱腹: -2 },
    "随地排泄": { 清洁: -10 },
    "被训哭": { 心情: -5, 恐惧值: +5 },
    "绝食": { 饱腹: -5 },
    "抑郁": { 心情: -3 },
    "生病求助": { 健康: -5 },
    "离家出走": { 亲密度: -10 },
    "回家": { 亲密度: +5 },
    "报复": { 信任度: -5 },
    "假顺从": { 记仇值: +3 },
    "反击玩家": { 恐惧值: -3, 愤怒: +5 }
  };
  const e = effects[semantic];
  if(e){
    const s = petState.state;
    const d = petState.discipline;
    for(const key in e){
      if(key === "饱腹") s.饱腹 = clamp(s.饱腹 + e[key], 0, 100);
      else if(key === "清洁") s.清洁 = clamp(s.清洁 + e[key], 0, 100);
      else if(key === "心情") s.心情 = clamp(s.心情 + e[key], 0, 100);
      else if(key === "健康") s.体力 = clamp(s.体力 + e[key], 0, 100);
      else if(key === "亲密度") s.亲密度 = clamp(s.亲密度 + e[key], 0, 100);
      else if(key === "信任度") s.信任度 = clamp(s.信任度 + e[key], 0, 100);
      else if(key === "恐惧值") d.恐惧值 = clamp(d.恐惧值 + e[key], 0, 100);
      else if(key === "记仇值") d.记仇值 = clamp(d.记仇值 + e[key], 0, 100);
      else if(key === "愤怒") s.心情 = clamp(s.心情 - e[key], 0, 100);
    }
  }
  saveState();
}

/* ═══════════════ 隐藏状态系统 ═══════════════
   假顺从/伺机报复/抑郁/绝食 —— 玩家看不到，只能通过行为猜测 */
function checkHiddenStates(){
  const d = petState.discipline;
  const s = petState.state;
  const hs = petState.hiddenStates;
  const now = Date.now();

  // 假顺从：服从高 + 记仇高
  hs.假顺从 = (d.服从值 > 70 && d.记仇值 > 50);

  // 伺机报复：记仇 > 80
  if(d.记仇值 > 80 && !hs.伺机报复){
    hs.伺机报复 = true;
    hs.报复倒计时 = 3 + Math.floor(Math.random() * 5); // 3-7天后爆发
    hs.最后报复时间 = now;
  } else if(d.记仇值 <= 60){
    hs.伺机报复 = false;
  }

  // 抑郁：长期深海封印 或 心情长期低于30
  const deepSealCount = d.opCounts?.deepSeal || 0;
  hs.抑郁 = (deepSealCount > 3) || (s.心情 < 30 && now - (petState._lowMoodTime || now) > 3600000);
  if(s.心情 < 30 && !petState._lowMoodTime) petState._lowMoodTime = now;
  else if(s.心情 >= 30) petState._lowMoodTime = null;

  // 绝食：亲密度 < 20 + 心情 < 30
  hs.绝食 = (s.亲密度 < 20 && s.心情 < 30);

  // 伺机报复爆发
  if(hs.伺机报复 && hs.报复倒计时 > 0){
    const daysSince = (now - hs.最后报复时间) / 86400000;
    if(daysSince >= hs.报复倒计时){
      triggerRevenge();
      hs.报复倒计时 = 0;
      hs.最后报复时间 = now;
      hs.伺机报复 = false;
      d.记仇值 = clamp(d.记仇值 - 30, 0, 100);
    }
  }
}

/* 报复爆发 */
function triggerRevenge(){
  const revenges = [
    { action:"打翻食盆", effect:()=>{ petState.bowlFood = []; petState.state.清洁 = clamp(petState.state.清洁 - 15, 0, 100); } },
    { action:"破坏物品", effect:()=>{ petState.state.清洁 = clamp(petState.state.清洁 - 20, 0, 100); } },
    { action:"随地排泄", effect:()=>{ addPoop(); } },
    { action:"离家出走", effect:()=>{ triggerRunaway(); } },
    { action:"咬你一口", effect:()=>{ petState.state.信任度 = clamp(petState.state.信任度 - 10, 0, 100); } }
  ];
  const r = pick(revenges);
  r.effect();
  triggerSemantic("报复", "home");
  showModal({
    title:"⚠️ 报复事件",
    text:"它" + r.action + "了！\n它记仇太久，终于爆发了。",
    actions:[{ label:"知道了", type:"primary", onClick:()=>{} }]
  });
  recordMemory("报复爆发", r.action);
  saveState();
}

/* 应用隐藏状态的行为表现（在 petSoulTick 中调用） */
function applyHiddenStateBehavior(){
  const hs = petState.hiddenStates;
  if(!hs) return;

  // 抑郁：动作迟缓，拒绝互动
  if(hs.抑郁 && Math.random() < 0.3){
    if(currentPage === "home"){
      triggerSemantic("抑郁", "home");
      petState.state.心情 = clamp(petState.state.心情 - 1, 0, 100);
    }
    return true; // 阻止其他行为
  }

  // 绝食：拒绝进食
  if(hs.绝食 && Math.random() < 0.4){
    if(currentPage === "home" || currentPage === "feed"){
      triggerSemantic("绝食", currentPage);
    }
    return true;
  }

  // 假顺从：表面听话，眼神躲闪
  if(hs.假顺从 && Math.random() < 0.2){
    if(currentPage === "home"){
      triggerSemantic("假顺从", "home");
    }
  }

  return false;
}

/* 获取隐藏状态描述（供AI系统提示词用） */
function getHiddenStateSummary(){
  const hs = petState.hiddenStates;
  if(!hs) return "无隐藏状态";
  const states = [];
  if(hs.假顺从) states.push("假顺从（表面听话，暗中记仇）");
  if(hs.伺机报复) states.push("伺机报复（记仇值高，可能随时爆发）");
  if(hs.抑郁) states.push("抑郁（动作迟缓，拒绝互动）");
  if(hs.绝食) states.push("绝食（拒绝进食）");
  return states.length > 0 ? states.join("；") : "无隐藏状态";
}

/* ═══════════════ 离家出走监控系统 ═══════════════ */
const RUNAWAY_LOCATIONS = ["客厅角落", "街角", "公园", "废弃星尘区", "伴侣处", "孩子处"];

/* 触发离家出走 */
function triggerRunaway(){
  if(petState.runaway.isAway) return;
  if(!checkContentSafety("runaway")) return;
  petState.runaway.isAway = true;
  petState.runaway.awayTime = Date.now();
  petState.runaway.location = pick(RUNAWAY_LOCATIONS);
  petState.runaway.canCatch = true;
  petState.runaway.isDeadOutside = false;
  triggerSemantic("离家出走", "home");
  recordMemory("离家出走", petState.runaway.location);
  showModal({
    title:"🚪 它离家出走了！",
    text:"它离开了家，现在在" + petState.runaway.location + "。\n\n你可以选择抓它回来，或者让它自己回来。\n外面很危险，它可能会受伤，甚至……回不来。",
    actions:[
      { label:"去抓它回来", type:"primary", onClick:()=>catchRunaway() },
      { label:"让它自己冷静", type:"default", onClick:()=>{} }
    ]
  });
  saveState();
}

/* 检查是否应该离家出走 */
function checkRunaway(){
  const r = petState.runaway;
  if(r.isAway) return;
  const s = petState.state;
  const hoursSinceInteraction = (Date.now() - r.lastInteraction) / 3600000;
  // 触发条件：亲密度 < 40 + 连续8小时未互动（从30/12小时调整）
  if(s.亲密度 < 40 && hoursSinceInteraction > 8){
    // 脾气高更容易出走，粘人高概率低
    const chance = (petState.traits.脾气 / 100) * (1 - petState.traits.粘人 / 200);
    if(Math.random() < chance * 0.2){ // 概率从0.1提高到0.2
      triggerRunaway();
    }
  }
  // ★ 新增：被虐待太严重也会离家出走（恐惧>80或记仇>80）
  if((petState.discipline.恐惧值 > 80 || petState.discipline.记仇值 > 80) && hoursSinceInteraction > 2){
    if(Math.random() < 0.05){
      triggerRunaway();
    }
  }
}

/* 抓回离家出走的宠物 */
function catchRunaway(){
  const r = petState.runaway;
  if(!r.isAway) return;
  if(r.isDeadOutside){
    showModal({
      title:"💀 它已经不在了",
      text:"你去晚了。\n它在外面遇到了食肉动物……\n\n你可以重新领养一只新的宠物。",
      actions:[{ label:"重新领养", type:"primary", onClick:()=>{ resetPet(); switchPage("opening"); } }]
    });
    return;
  }
  r.isAway = false;
  r.location = "";
  // 抓回后：信任大降，恐惧上升
  petState.state.信任度 = clamp(petState.state.信任度 - 20, 0, 100);
  petState.state.亲密度 = clamp(petState.state.亲密度 - 10, 0, 100);
  petState.discipline.恐惧值 = clamp(petState.discipline.恐惧值 + 15, 0, 100);
  // 可能假顺从
  if(petState.discipline.记仇值 > 50){
    petState.hiddenStates.假顺从 = true;
  }
  triggerSemantic("回家", "home");
  recordMemory("被抓回");
  showBubbleFor("home", "……你来了。");
  saveState();
}

/* 宠物自行回归判定 */
function checkRunawayReturn(){
  const r = petState.runaway;
  if(!r.isAway) return;
  const hoursAway = (Date.now() - r.awayTime) / 3600000;
  // 每小时进行一次生存判定
  if(hoursAway < 1) return;
  // 生存判定：胆量、粘人度、亲密度、好奇心共同决定
  const survival = (petState.traits.胆量 * 0.3 + petState.traits.粘人 * 0.3 + petState.state.亲密度 * 0.3 + (100 - petState.traits.好奇) * 0.1) / 100;
  const deathChance = (1 - survival) * 0.05 * hoursAway;
  if(checkContentSafety("death") && Math.random() < deathChance){
    r.isDeadOutside = true;
    recordMemory("死在外面", r.location);
    showModal({
      title:"💀 它没有回来",
      text:"它在" + r.location + "遇到了危险……\n外面的世界，只有食肉动物。\n\n你可以重新领养一只新的宠物。",
      actions:[{ label:"重新领养", type:"primary", onClick:()=>{ resetPet(); switchPage("opening"); } }]
    });
    saveState();
    return;
  }
  // 自行回归判定
  const returnChance = (petState.traits.粘人 / 100) * 0.1 + (petState.state.亲密度 / 100) * 0.05;
  if(Math.random() < returnChance){
    const returnTypes = ["悔悟回归", "走投无路回归", "受伤回归", "假装回归"];
    const returnType = pick(returnTypes);
    r.isAway = false;
    r.location = "";
    if(returnType === "受伤回归"){
      petState.state.体力 = clamp(petState.state.体力 - 30, 0, 100);
    }
    if(returnType === "假装回归"){
      petState.hiddenStates.伺机报复 = true;
      petState.hiddenStates.报复倒计时 = 2 + Math.floor(Math.random() * 3);
      petState.hiddenStates.最后报复时间 = Date.now();
    }
    petState.state.信任度 = clamp(petState.state.信任度 - 10, 0, 100);
    petState.state.亲密度 = clamp(petState.state.亲密度 + 5, 0, 100);
    triggerSemantic("回家", "home");
    recordMemory("自行回归", returnType);
    showModal({
      title:"🏠 它回来了",
      text:"它" + returnType + "了。\n它看起来" + (returnType === "受伤回归" ? "很虚弱" : "很复杂") + "。",
      actions:[
        { label:"接纳它", type:"primary", onClick:()=>{
          petState.state.亲密度 = clamp(petState.state.亲密度 + 10, 0, 100);
          showBubbleFor("home", "……我回来了。");
        }},
        { label:"冷处理", type:"default", onClick:()=>{
          petState.state.信任度 = clamp(petState.state.信任度 - 5, 0, 100);
          showBubbleFor("home", "……嗯。");
        }}
      ]
    });
    saveState();
  }
}

/* ═══════════════ 伴侣与繁育系统 ═══════════════ */
const PARTNER_NAMES = ["小星星","棉花糖","云朵","布丁","奶茶","汤圆","饺子","桃子","樱桃","栗子"];

/* 生成随机伴侣NPC */
function generatePartner(){
  const masks = Object.keys(MASK_DATA || {});
  const bodyTypes = Object.keys(BODY_TYPES);
  return {
    name: pick(PARTNER_NAMES),
    mask: pick(masks.length > 0 ? masks : ["小可爱"]),
    bodyType: pick(bodyTypes.length > 0 ? bodyTypes : ["圆胖型"]),
    traits: {
      脾气: 20 + Math.random()*60,
      粘人: 20 + Math.random()*60,
      胆量: 20 + Math.random()*60,
      好奇: 20 + Math.random()*60,
      记仇: 20 + Math.random()*60
    },
    patience: 50 + Math.random()*50, // 耐心
    ambition: 20 + Math.random()*60, // 野心
    playerAffinity: 50, // 对玩家好感
    petAffinity: 60 + Math.random()*30, // 对宠物好感
    arriveTime: Date.now(),
    stayDays: 2 + Math.floor(Math.random()*4) // 停留2-5天
  };
}

/* 触发伴侣事件 */
function triggerPartnerEvent(){
  if(petState.partner) return;
  if(petState.stage !== "成年") return;
  if(petState.state.亲密度 < 60) return;

  const partner = generatePartner();
  triggerSemantic("伴侣来访", "home");
  recordMemory("伴侣来访", partner.name);

  showModal({
    title:"💕 伴侣来访",
    text: petState.name + "带了" + partner.name + "到门口。\n\n" + partner.name + "是一只" + partner.bodyType + "，性格" + partner.mask + "。\n\n你要怎么做？",
    actions:[
      { label:"允许进入", type:"primary", onClick:()=>acceptPartner(partner) },
      { label:"拒绝，让它走", type:"default", onClick:()=>rejectPartner(partner) },
      { label:"先观察，不表态", type:"default", onClick:()=>observePartner(partner) },
      { label:"把宠物关起来", type:"danger", onClick:()=>lockPetForPartner(partner) }
    ]
  });
}

/* 允许伴侣进入 */
function acceptPartner(partner){
  petState.partner = partner;
  showBubbleFor("home", partner.name + "进来了～");
  recordMemory("接纳伴侣", partner.name);
  saveState();
}

/* 拒绝伴侣 */
function rejectPartner(partner){
  triggerSemantic("伴侣被拒", "home");
  recordMemory("拒绝伴侣", partner.name);
  petState.state.心情 = clamp(petState.state.心情 - 10, 0, 100);
  petState.state.亲密度 = clamp(petState.state.亲密度 - 5, 0, 100);
  // 记仇高的宠物会记很久
  if(petState.traits.记仇 > 50){
    petState.discipline.记仇值 = clamp(petState.discipline.记仇值 + 10, 0, 100);
  }
  saveState();
}

/* 观察伴侣 */
function observePartner(partner){
  showBubbleFor("home", "……（你在观察" + partner.name + "）");
  // 30秒后自动决定
  setTimeout(()=>{
    if(!petState.partner){
      if(Math.random() < 0.5){
        acceptPartner(partner);
      } else {
        rejectPartner(partner);
      }
    }
  }, 30000);
}

/* 把宠物关起来阻止伴侣 */
function lockPetForPartner(partner){
  petState.state.信任度 = clamp(petState.state.信任度 - 15, 0, 100);
  petState.discipline.记仇值 = clamp(petState.discipline.记仇值 + 15, 0, 100);
  showBubbleFor("home", "你把我关起来了……");
  recordMemory("被关起来阻止伴侣");
  // 小概率私奔
  if(petState.state.信任度 < 30 && petState.traits.好奇 > 60 && Math.random() < 0.2){
    triggerSemantic("私奔倾向", "home");
    setTimeout(()=>triggerRunaway(), 5000);
  }
  saveState();
}

/* 检查伴侣去留 */
function checkPartnerStatus(){
  const p = petState.partner;
  if(!p) return;
  const daysStayed = (Date.now() - p.arriveTime) / 86400000;
  // 停留时间到了，判定去留
  if(daysStayed >= p.stayDays){
    // 留下条件：对玩家好感高 + 对宠物好感高 + 环境安全
    const stayChance = (p.playerAffinity / 100) * 0.4 + (p.petAffinity / 100) * 0.4 + (petState.state.亲密度 / 100) * 0.2;
    if(Math.random() < stayChance){
      // 留下，可能繁育
      p.stayDays += 2;
      if(Math.random() < 0.3){
        triggerBreeding();
      }
    } else {
      // 离开
      showBubbleFor("home", p.name + "走了……");
      recordMemory("伴侣离开", p.name);
      petState.state.心情 = clamp(petState.state.心情 - 8, 0, 100);
      petState.partner = null;
    }
    saveState();
  }
}

/* 触发生育 */
function triggerBreeding(){
  if(!petState.partner) return;
  if(petState.children.length >= 3) return; // 最多3个孩子
  const child = {
    name: pick(PARTNER_NAMES),
    mask: Math.random() < 0.5 ? petState.mask : petState.partner.mask,
    bodyType: Math.random() < 0.5 ? petState.bodyType : petState.partner.bodyType,
    traits: {
      脾气: clamp((petState.traits.脾气 + petState.partner.traits.脾气)/2 + (Math.random()-0.5)*30, 0, 100),
      粘人: clamp((petState.traits.粘人 + petState.partner.traits.粘人)/2 + (Math.random()-0.5)*30, 0, 100),
      胆量: clamp((petState.traits.胆量 + petState.partner.traits.胆量)/2 + (Math.random()-0.5)*30, 0, 100),
      好奇: clamp((petState.traits.好奇 + petState.partner.traits.好奇)/2 + (Math.random()-0.5)*30, 0, 100),
      记仇: clamp((petState.traits.记仇 + petState.partner.traits.记仇)/2 + (Math.random()-0.5)*30, 0, 100)
    },
    birthTime: Date.now(),
    generation: (petState.generation || 1) + 1
  };
  petState.children.push(child);
  recordMemory("生育", child.name);
  showModal({
    title:"👶 新生命！",
    text: petState.name + "和" + petState.partner.name + "的孩子出生了！\n\n名字：" + child.name + "\n性格：" + child.mask + "\n体型：" + child.bodyType + "\n\n孩子会在家谱中记录。",
    actions:[{ label:"太好了！", type:"primary", onClick:()=>{} }]
  });
  saveState();
}

/* 检查伴侣事件触发 */
function checkPartnerEvent(){
  if(petState.partner) return;
  if(petState.stage !== "成年") return;
  if(petState.state.亲密度 < 40) return; // 降低亲密度要求，从60降到40
  // 每天有5%概率触发（从0.1%提高到5%）
  if(Math.random() < 0.05){
    triggerPartnerEvent();
  }
}

/* ═══════════════ 多宠互动系统 ═══════════════ */
const RELATION_TYPES = ["友好","竞争","爱慕","嫉妒","联盟","敌对","绿茶","争宠"];

/* 初始化关系值 */
function initRelations(){
  if(!petState.relations) petState.relations = {};
  if(petState.partner && !petState.relations[petState.partner.name]){
    petState.relations[petState.partner.name] = {
      友好: 50, 竞争: 20, 爱慕: 60, 嫉妒: 10, 联盟: 0, 敌对: 0, 绿茶: 0, 争宠: 20
    };
  }
}

/* 多宠互动行为 */
function multiPetInteraction(){
  const p = petState.partner;
  if(!p) return;
  initRelations();
  const rel = petState.relations[p.name];
  if(!rel) return;

  // 随机选择互动行为
  const r = Math.random();
  if(r < 0.15 && rel.友好 > 50){
    // 一起讨好玩家
    showBubbleFor("home", "（" + p.name + "和" + petState.name + "一起凑过来）");
    petState.state.心情 = clamp(petState.state.心情 + 3, 0, 100);
    p.playerAffinity = clamp(p.playerAffinity + 2, 0, 100);
    recordMemory("和伴侣一起讨好");
  } else if(r < 0.25 && rel.争宠 > 40){
    // 争宠
    if(Math.random() < 0.5){
      showBubbleFor("home", "（" + petState.name + "把" + p.name + "挤开了）");
      rel.争宠 = clamp(rel.争宠 + 5, 0, 100);
      rel.友好 = clamp(rel.友好 - 3, 0, 100);
      recordMemory("争宠", "挤开伴侣");
    } else {
      showBubbleFor("home", "（" + p.name + "抢在前面撒娇）");
      p.playerAffinity = clamp(p.playerAffinity + 3, 0, 100);
      rel.嫉妒 = clamp(rel.嫉妒 + 5, 0, 100);
      recordMemory("被伴侣争宠");
    }
  } else if(r < 0.35 && rel.嫉妒 > 50){
    // 嫉妒行为
    showBubbleFor("home", "（" + petState.name + "瞪了" + p.name + "一眼）");
    petState.state.心情 = clamp(petState.state.心情 - 2, 0, 100);
    recordMemory("嫉妒伴侣");
  } else if(r < 0.45 && rel.联盟 > 50){
    // 联合行为
    if(Math.random() < 0.5){
      // 一起破坏
      petState.state.清洁 = clamp(petState.state.清洁 - 10, 0, 100);
      showBubbleFor("home", "（它们一起把东西弄乱了）");
      recordMemory("和伴侣一起破坏");
    } else {
      // 一起讨好
      showBubbleFor("home", "（它们一起看着你）");
      petState.state.亲密度 = clamp(petState.state.亲密度 + 2, 0, 100);
      recordMemory("和伴侣一起讨好");
    }
  } else if(r < 0.55 && rel.敌对 > 40){
    // 敌对行为
    showBubbleFor("home", "（" + petState.name + "和" + p.name + "吵架了）");
    petState.state.心情 = clamp(petState.state.心情 - 5, 0, 100);
    recordMemory("和伴侣吵架");
  } else if(r < 0.7 && rel.友好 > 40){
    // ★ 新增：一起玩耍
    showBubbleFor("home", "（" + petState.name + "和" + p.name + "在追逐打闹）");
    petState.state.心情 = clamp(petState.state.心情 + 5, 0, 100);
    petState.state.体力 = clamp(petState.state.体力 - 3, 0, 100);
    rel.友好 = clamp(rel.友好 + 2, 0, 100);
    recordMemory("和伴侣一起玩耍");
  } else if(r < 0.8 && rel.爱慕 > 50){
    // ★ 新增：互相舔毛/亲密行为
    showBubbleFor("home", "（" + petState.name + "给" + p.name + "舔毛）");
    petState.state.心情 = clamp(petState.state.心情 + 4, 0, 100);
    rel.爱慕 = clamp(rel.爱慕 + 3, 0, 100);
    rel.友好 = clamp(rel.友好 + 2, 0, 100);
    recordMemory("和伴侣亲密");
  } else if(r < 0.9 && rel.友好 > 60){
    // ★ 新增：分享食物
    if(petState.bowlFood && petState.bowlFood.length > 0){
      const shared = petState.bowlFood.shift();
      showBubbleFor("home", "（" + petState.name + "把" + shared.name + "分给了" + p.name + "）");
      p.playerAffinity = clamp(p.playerAffinity + 5, 0, 100);
      rel.友好 = clamp(rel.友好 + 5, 0, 100);
      recordMemory("分享食物给伴侣");
    }
  } else {
    // ★ 新增：一起睡觉
    showBubbleFor("home", "（" + petState.name + "和" + p.name + "依偎在一起睡着了）");
    petState.state.体力 = clamp(petState.state.体力 + 5, 0, 100);
    petState.state.心情 = clamp(petState.state.心情 + 2, 0, 100);
    recordMemory("和伴侣一起睡觉");
  }
  saveState();
}

/* 玩家偏爱某只宠物的影响 */
function playerFavoritism(favored){
  const p = petState.partner;
  if(!p) return;
  initRelations();
  const rel = petState.relations[p.name];
  if(!rel) return;
  if(favored === "pet"){
    // 玩家偏爱自家宠物
    rel.嫉妒 = clamp(rel.嫉妒 + 5, 0, 100);
    rel.争宠 = clamp(rel.争宠 + 3, 0, 100);
    p.playerAffinity = clamp(p.playerAffinity - 3, 0, 100);
  } else if(favored === "partner"){
    // 玩家偏爱伴侣
    rel.嫉妒 = clamp(rel.嫉妒 + 8, 0, 100);
    petState.state.心情 = clamp(petState.state.心情 - 5, 0, 100);
    petState.discipline.记仇值 = clamp(petState.discipline.记仇值 + 3, 0, 100);
  }
  saveState();
}

/* ═══════════════ 起名系统 ═══════════════ */
function trySetName(newName){
  if(!newName || !newName.trim()) return;
  newName = newName.trim().slice(0, 10);
  const t = petState.traits;
  const mask = petState.mask;

  // 判定是否接受
  let accept = false;
  if(t.粘人 > 60 || mask === "小可爱") accept = true;
  else if(t.脾气 > 70 || mask === "本大人" || mask === "公主病") accept = false;
  else accept = Math.random() < 0.5;

  if(accept){
    petState.name = newName;
    petState.nameAccepted = true;
    petState.state.亲密度 = clamp(petState.state.亲密度 + 5, 0, 100);
    triggerSemantic("接受改名", "home");
    showBubbleFor("home", "（它似乎很喜欢这个名字）");
    recordMemory("接受名字", newName);
  } else {
    petState.state.亲密度 = clamp(petState.state.亲密度 - 3, 0, 100);
    triggerSemantic("拒绝改名", "home");
    showBubbleFor("home", "（它不喜欢这个名字）");
    recordMemory("拒绝名字", newName);
    // 好奇心高的宠物可能自己改名
    if(t.好奇 > 70 && Math.random() < 0.3){
      setTimeout(()=>{
        const selfNames = ["小星","团子","毛毛","球球","豆豆","咪咪"];
        const selfName = pick(selfNames);
        petState.name = selfName;
        petState.nameAccepted = true;
        showBubbleFor("home", "（它决定叫自己" + selfName + "）");
        recordMemory("自己改名", selfName);
        saveState();
      }, 5000);
    }
  }
  saveState();
}
